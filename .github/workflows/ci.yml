name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: node scripts/build-electron.mjs

  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sync, device-agent, credentials, package-service, server, directory, ai]
    defaults:
      run:
        working-directory: services/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22 runs the TypeScript tests directly; node:sqlite is built in.
      - if: hashFiles(format('services/{0}/package-lock.json', matrix.package)) != ''
        run: npm ci --no-audit --no-fund
      # package-service tests start a private dbus-daemon.
      - if: matrix.package == 'package-service'
        run: sudo apt-get install -y --no-install-recommends dbus-daemon
      # ai: real llama.cpp inference on a generated random-weight GGUF (~0.5 MB; no model is downloaded or committed).
      - if: matrix.package == 'ai'
        run: |
          pip install --quiet gguf numpy
          python3 tools/make-tiny-gguf.py "$RUNNER_TEMP/tiny.gguf"
          echo "WORKSUITE_AI_SMOKE_MODEL=$RUNNER_TEMP/tiny.gguf" >> "$GITHUB_ENV"
      - run: npm test

  os-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GRUB recovery/previous-kernel entries, kernel retention, boot-time repair (WSOS-BOOT-003, SRS §9.2).
      - run: tests/boot/recovery-boot.test.sh
      # Reinstall keeping /home (SRS §9.2-R6): directory run, then a loop-device disk with /home in LUKS2.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools cryptsetup-bin fdisk
      - run: sudo sh tests/boot/reinstall-keep-home.test.sh
      # AppArmor profiles parse (WSOS-SEC-009); perf gate evaluator (PRF-*).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apparmor apparmor-utils
      - run: tests/security/apparmor.test.sh
      - run: tests/security/isolation-claims.test.sh
      # Default inbound-deny nftables ruleset; nft -c needs root.
      - run: sudo apt-get install -y --no-install-recommends nftables && sudo sh tests/security/firewall.test.sh
      - run: tests/perf/gates.test.sh
      - run: tests/image/fetch-desktop.sh
      # Session scripts with stubbed programs: lock, idle, greeter, polkit agent fallback, screen-sharing consent.
      - run: sh tests/session/session-test.sh
      # Window title bars: the Labwc WorkSuite themes, their button images and the rc.xml layout (issues #15, #33).
      - run: sh tests/session/window-theme.test.sh
      # WorkSuite's polkit agent (C listener + Python agent) against the runner's real polkitd and pkexec.
      - run: sudo apt-get install -y --no-install-recommends polkitd pkexec libpolkit-agent-1-dev gcc make pkgconf && sudo sh tests/session/polkit-agent-integration.sh
      # Kiosk mode session scripts (WSOS-AUTH-002).
      - run: sh tests/session/kiosk-test.sh
      # Device PIN / security-key PAM profiles, daemon and packaging (runs the helper unit tests too).
      - run: sh tests/session/signin-pam-test.sh
      # pam_worksuite.so through real libpam with a stand-in helper (WSOS-DIR-009).
      - run: sudo apt-get install -y --no-install-recommends libpam0g-dev gcc make && sh native/pam-worksuite/test.sh
      # File-system layout (SRS §11.6-b): packaged paths, XDG base directories for user state.
      - run: sh tests/session/fs-layout-test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/sbom/spdx.test.mjs
      - run: node --test tools/release/publish-update-center.test.mjs
      # Ring names, aliases and suites agree everywhere (tools/release/rings.mjs, docs/release-channels.md).
      - run: node --test tools/release/rings.test.mjs
      # No private key material in the tree (WSOS-SEC-011).
      - run: "! git grep -I -l -e 'BEGIN [A-Z ]*PRIVATE KEY' -- . ':!docs/**'"

  wayland-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # labwc + foot run the headless end-to-end tests (grim + wtype: the shell stays below the apps on every desktop);
      # the shell's node_modules run the panel-client test.
      - run: sudo apt-get install -y --no-install-recommends dbus-daemon libwayland-dev labwc foot grim wtype python3-pip && pip install --break-system-packages pywayland dbus-next pyyaml
      - run: cd shell && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund
      - run: make -C native/wayland-bridge test
      # Remote support input helper against headless labwc (issue #37).
      - run: sh native/rs-input/test.sh
      - run: python3 -m unittest discover -s installer/tests
      - run: python3 -m unittest discover -s tests/hw
      - run: cd services/session/greeter && python3 -m unittest discover -s tests -t .
      - run: cd services/session/kiosk && python3 -m unittest discover -s tests -t .
      - run: cd services/session/toasts && python3 -m unittest discover -s tests -t .
      - run: cd services/session/signin && python3 -m unittest discover -s tests -t .
      - run: cd services/session/polkit && python3 -m unittest discover -s tests -t .
      - run: cd services/session/osk && python3 -m unittest discover -s tests -t .
      - run: cd services/session/gestures && python3 -m unittest discover -s tests -t .
      # Calamares job modules (a libcalamares stand-in in each test).
      - run: for t in installer/modules/*/tests; do python3 -m unittest discover -s "$t" || exit 1; done

  portals:
    # Portal acceptance (SRS §7.1): each portal interface WorkSuite uses, against xdg-desktop-portal with the -wlr and
    # -gtk backends in a headless Labwc, with WorkSuite's portals.conf, xdpw config and screen-sharing consent chooser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon dbus-x11 labwc xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk grim pipewire wireplumber python3-dbus-next gsettings-desktop-schemas dconf-service libglib2.0-bin xwayland x11-utils procps
      - run: timeout 300 sh tests/portals/run.sh
      # X11 apps through on-demand XWayland in headless Labwc with WorkSuite's rc.xml (WSOS-LCH-002).
      - run: timeout 120 sh tests/session/xwayland-test.sh

  apt-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends apt-utils gnupg
      # Signed APT repository with real apt (no root): publish, verify, upgrade; tampered and foreign-signed refused.
      - run: tests/repo/apt-e2e.sh
