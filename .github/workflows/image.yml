name: Image

# Builds the .debs and the live ISO for amd64 and arm64 from the same commit (WSOS-ARM-001) inside Debian trixie,
# with WorkSuite Office, boots each ISO in QEMU (UEFI: OVMF / AAVMF, WSOS-ARM-008), checks the boot marker and
# uploads the ISO, its SHA256 and an SPDX SBOM (WSOS-SEC-011). Tags v* also attach them to a GitHub release.
# Tags v* also publish to the WorkSuite Update Center when UPDATE_CENTER_TOKEN is set (job update-center below).
# A second, test-only "-perf" image runs the perf/reliability probes and must pass the CI gates in
# tests/perf/gates.tsv (WSOS-PRF-001…005, REL-001/002, ARM-007).
# arm64 builds natively on GitHub's arm64 runners (no cross live-build). Hosted runners have no KVM, so QEMU runs
# in TCG (slow).
#
# Secret WORKSUITE_DESKTOP_TOKEN (optional): actions:read on Livezen-Technologies/worksuite-desktop, for the
# "worksuite-Linux" artifact of its build.yml (tools/fetch-desktop.sh); falls back to WORKSUITE_OFFICE_TOKEN. Variables
# WORKSUITE_DESKTOP_URL + WORKSUITE_DESKTOP_SHA256 fetch a published deb instead.
# Secret WORKSUITE_OFFICE_TOKEN: a token with actions:read on Livezen-Technologies/worksuite-office, used to download
# the "linux-packages-$ARCH" artifact of its build.yml (tools/fetch-office.sh). Optional variables
# WORKSUITE_OFFICE_URL fetches a published deb instead. Variable WORKSUITE_OFFICE_SHA256 pins the deb and is required
# for release builds (tools/fetch-office.sh). Pull requests from forks get no
# secrets, so they build a dev image without Office. arm64: when no arm64 Office deb exists yet, the build warns
# and continues without Office instead of failing release mode.
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: snapshot.debian.org timestamp to build from
        default: '20261001T000000Z'
      office_run:
        description: worksuite-office build.yml run ID to take the Office deb from (empty for the latest)
        required: false
        type: string
      desktop_run:
        description: worksuite-desktop build.yml run ID to take the Desktop deb from (empty for the latest)
        default: ''
      perf:
        description: also build the -perf image and apply the perf gates
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            qemu: qemu-system-x86 ovmf
            boot_timeout: 2400
          - arch: arm64
            runner: ubuntu-24.04-arm
            qemu: qemu-system-arm qemu-efi-aarch64 ipxe-qemu
            boot_timeout: 4800
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    container:
      image: debian:trixie
      options: --privileged
    env:
      SNAPSHOT: ${{ inputs.snapshot || '20261001T000000Z' }}
      ARCH: ${{ matrix.arch }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      HAS_OFFICE_SOURCE: ${{ secrets.WORKSUITE_OFFICE_TOKEN != '' || vars.WORKSUITE_OFFICE_URL != '' }}
      HAS_DESKTOP_SOURCE: ${{ secrets.WORKSUITE_DESKTOP_TOKEN != '' || secrets.WORKSUITE_OFFICE_TOKEN != '' || vars.WORKSUITE_DESKTOP_URL != '' }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl gh live-build debootstrap debhelper dpkg-dev fakeroot build-essential dbus-daemon ${{ matrix.qemu }} xorriso squashfs-tools mtools dosfstools
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Build-Depends from packaging/debian/control, except Node (setup-node provides it).
      - run: |
          deps=$(sed -n '/^Build-Depends:/,/^[A-Z][A-Za-z-]*:/p' packaging/debian/control | grep -v '^#' | sed '$d' | sed 's/^Build-Depends://' | tr '\n' ' ' | tr ',' '\n' | grep -vE 'nodejs|npm' | sed 's/^ *//;s/ *$//' | grep . | paste -sd, -)
          apt-get satisfy -y --no-install-recommends "$deps"
      # -d: Node 22 comes from setup-node, not a dpkg package. Builds this runner's arch (amd64 or arm64) + all.
      - run: packaging/build-debs.sh -d
      - name: Fetch WorkSuite Office
        id: office
        if: env.HAS_OFFICE_SOURCE == 'true'
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        env:
          GH_TOKEN: ${{ secrets.WORKSUITE_OFFICE_TOKEN }}
          WORKSUITE_OFFICE_URL: ${{ vars.WORKSUITE_OFFICE_URL }}
          WORKSUITE_OFFICE_SHA256: ${{ vars.WORKSUITE_OFFICE_SHA256 }}
          WORKSUITE_OFFICE_RUN: ${{ inputs.office_run }}
          # Tagged releases must pin the deb by vars.WORKSUITE_OFFICE_SHA256; other builds only warn when it is unset.
          WORKSUITE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: tools/fetch-office.sh
      # WorkSuite Desktop (worksuite-desktop build.yml, artifact worksuite-Linux). WORKSUITE_DESKTOP_TOKEN (actions:read
      # on Livezen-Technologies/worksuite-desktop); without it the Office token is tried, which works when that token
      # covers both repositories. Optional: when it can't be fetched, the image ships without it (web app windows).
      - name: Fetch WorkSuite Desktop
        id: desktop
        if: env.HAS_DESKTOP_SOURCE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKSUITE_DESKTOP_TOKEN || secrets.WORKSUITE_OFFICE_TOKEN }}
          WORKSUITE_DESKTOP_URL: ${{ vars.WORKSUITE_DESKTOP_URL }}
          WORKSUITE_DESKTOP_SHA256: ${{ vars.WORKSUITE_DESKTOP_SHA256 }}
          WORKSUITE_DESKTOP_RUN: ${{ inputs.desktop_run }}
        run: tools/fetch-desktop.sh
      # Release mode (Office required) everywhere but fork pull requests, which have no secrets. arm64 without an
      # Office deb (none published for arm64 yet) warns and builds without it.
      - name: Build the ISO
        run: |
          release=0
          if [ "${{ github.event_name }}" != pull_request ] || [ "$HAS_OFFICE_SOURCE" = true ]; then release=1; fi
          if [ "$ARCH" = arm64 ] && ! ls live-build/config/packages.chroot/worksuite-office*_arm64.deb live-build/config/packages.chroot/worksuite-office*_all.deb >/dev/null 2>&1; then
            [ $release = 1 ] && echo "::warning::No arm64 WorkSuite Office deb (linux-packages-arm64); the arm64 image ships without Office"
            release=0
          fi
          if [ "${{ steps.desktop.outcome }}" != success ]; then
            [ $release = 1 ] && echo "::warning::No WorkSuite Desktop deb (worksuite-Linux); the image's start menu uses web app windows"
            export WORKSUITE_DESKTOP_OPTIONAL=1
          fi
          # Point the image's APT source at the Update Center's OS repository once its archive keyring is packaged.
          [ -f packaging/keyring/worksuite-archive-keyring.gpg ] && export WORKSUITE_REPO=1
          WORKSUITE_RELEASE=$release live-build/build.sh
      - name: Name the ISO
        id: iso
        run: |
          iso=$(ls live-build/out/*-$ARCH.iso | head -n1)
          [ -f "$iso.sha256" ] || (cd "$(dirname "$iso")" && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256")
          echo "path=$iso" >> "$GITHUB_OUTPUT"
      - run: tools/sbom/generate.sh $ARCH
      - run: tests/vm/boot-test.sh "${{ steps.iso.outputs.path }}" ${{ matrix.boot_timeout }}
      # Perf/reliability gates on a separate test image (probes stop the greeter and create a test user).
      - if: inputs.perf != false
        run: WORKSUITE_PERF=1 live-build/build.sh
      - if: inputs.perf != false
        run: PERF_PROFILE=ci-$ARCH-tcg BOOT_LOG=live-build/out/perf-serial.log tests/vm/boot-test.sh "$(ls live-build/out/*-$ARCH-perf.iso | head -n1)" ${{ matrix.boot_timeout }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worksuite-os-${{ matrix.arch }}
          path: |
            live-build/out/*.iso
            live-build/out/*.sha256
            live-build/out/*.spdx.json
            live-build/out/*.packages
            live-build/out/perf-serial.log
            packaging/out/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: worksuite-os-*
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release images only: the -perf test images stay in the workflow artifacts.
          files=$(find dist \( -name '*.iso' -o -name '*.sha256' -o -name '*.spdx.json' \) ! -name '*-perf*')
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "WorkSuite OS $TAG" --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber $files

  # Optional: publish the tag to the WorkSuite Update Center (Livezen-Technologies/worksite-download, §18) so devices
  # update from it. Runs only when the UPDATE_CENTER_TOKEN secret is set: an Update Center API client of kind CI with
  # os.publish ("<client_id>.<secret>"). Variables: UPDATE_CENTER_URL (default https://download.worksuitecloud.com),
  # UPDATE_CENTER_RING (development | pilot, or the Update Center's aliases canary | beta; default development; stable
  # only by promotion in the Update Center; mapping in tools/release/rings.mjs, docs/release-channels.md),
  # UPDATE_CENTER_RELEASE_TYPE (feature | security | emergency; default feature), UPDATE_CENTER_MIN_VERSION.
  # The APT repository is signed here with the archive key: secret WORKSUITE_ARCHIVE_GPG_KEY (ASCII-armoured private
  # key from tools/repo/keygen.sh) and optional WORKSUITE_KEY_PASSPHRASE. Without the key only the ISOs are published.
  update-center:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      HAS_TOKEN: ${{ secrets.UPDATE_CENTER_TOKEN != '' }}
      HAS_ARCHIVE_KEY: ${{ secrets.WORKSUITE_ARCHIVE_GPG_KEY != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::UPDATE_CENTER_TOKEN not set; not publishing to the Update Center"
      - if: env.HAS_TOKEN == 'true'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git gnupg apt-utils dpkg-dev xz-utils nodejs
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: worksuite-os-*
          path: dist
      - name: Build and sign the APT suite
        if: env.HAS_TOKEN == 'true' && env.HAS_ARCHIVE_KEY == 'true'
        env:
          WORKSUITE_ARCHIVE_GPG_KEY: ${{ secrets.WORKSUITE_ARCHIVE_GPG_KEY }}
          WORKSUITE_KEY_PASSPHRASE: ${{ secrets.WORKSUITE_KEY_PASSPHRASE }}
          RING: ${{ vars.UPDATE_CENTER_RING || 'development' }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$WORKSUITE_ARCHIVE_GPG_KEY" | gpg --batch --import
          # Ring → suite from the one mapping (docs/release-channels.md); canary/beta are accepted as aliases.
          suite=$(node tools/release/rings.mjs ci-suite "$RING")
          debs=$(find dist -name '*.deb' | sort -u)
          tools/repo/publish.sh apt-repo "$suite" $debs
          gpg --batch --export > apt-repo/worksuite-archive-keyring.gpg
          tar -C apt-repo -czf apt-repo.tar.gz dists pool worksuite-archive-keyring.gpg
          rm -rf "$GNUPGHOME"
      - name: Publish to the Update Center
        if: env.HAS_TOKEN == 'true'
        env:
          UPDATE_CENTER_TOKEN: ${{ secrets.UPDATE_CENTER_TOKEN }}
          UC_URL: ${{ vars.UPDATE_CENTER_URL || 'https://download.worksuitecloud.com' }}
          RING: ${{ vars.UPDATE_CENTER_RING || 'development' }}
          TYPE: ${{ vars.UPDATE_CENTER_RELEASE_TYPE || 'feature' }}
          MIN_VERSION: ${{ vars.UPDATE_CENTER_MIN_VERSION }}
          TAG: ${{ github.ref_name }}
        run: |
          set -- --version "$TAG" --ring "$RING" --type "$TYPE" --dist dist
          [ -n "$MIN_VERSION" ] && set -- "$@" --min-version "$MIN_VERSION"
          [ -f apt-repo.tar.gz ] && set -- "$@" --apt apt-repo.tar.gz
          node tools/release/publish-update-center.mjs "$@"
