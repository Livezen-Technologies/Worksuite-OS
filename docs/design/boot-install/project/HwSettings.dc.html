<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – Devices and Drivers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1040px; height: 640px; box-sizing: border-box; border-radius: 16px; overflow: hidden; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0C1E46; border: 1px solid rgba(127,178,255,0.18); box-shadow: 0 30px 80px rgba(0,0,0,0.55)">
<nav style="width: 220px; box-sizing: border-box; padding: 20px 12px; background: #091838; border-right: 1px solid rgba(127,178,255,0.12); display: flex; flex-direction: column; gap: 2px">
<div style="padding: 4px 10px 16px; font-size: 16px; font-weight: 600">Settings</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<span style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; font-size: 14px; background: {{n.bg}}; color: {{n.color}}; font-weight: {{n.weight}}">{{n.label}}<sc-if value="{{n.count}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #1F6BFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{n.count}}</span></sc-if></span>
</sc-for>
</nav>
<section style="flex: 1; min-width: 0; padding: 26px 30px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">{{title}}</h1>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.25); font-size: 13px; font-weight: 500; cursor: pointer">{{topAction}}</button>
</div>

<sc-if value="{{isDevices}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #8FA3C8; text-transform: uppercase; letter-spacing: 0.08em">{{g.name}}</span>
<div style="border-radius: 12px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{g.items}}" as="d" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: {{d.border}}">
<span style="width: 34px; height: 34px; border-radius: 9px; background: rgba(31,107,255,0.16); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; font-weight: 500">{{d.name}}</span><span style="font-size: 12px; color: #8FA3C8">{{d.sub}}</span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{d.statusColor}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{d.statusColor}}"></span>{{d.status}}</span>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isDrivers}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 12px; background: rgba(31,107,255,0.1); border: 1px solid rgba(31,107,255,0.35)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg>
<span style="flex: 1; font-size: 14px"><strong>3 driver updates</strong> available · 186 MB · 1 needs a restart</span>
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; cursor: pointer">Install selected</button>
</div>
<div style="border-radius: 12px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{drivers}}" as="d" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-top: {{d.border}}; cursor: pointer">
<input type="checkbox" checked="{{d.on}}" disabled="{{d.locked}}" aria-label="{{d.name}}" style="width: 18px; height: 18px; accent-color: #1F6BFF">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500">{{d.name}}<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: {{d.tagBg}}; color: {{d.tagColor}}">{{d.tag}}</span></span>
<span style="font-size: 12px; color: #8FA3C8">{{d.sub}}</span>
</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9D6EE">{{d.ver}}</span>
</label>
</sc-for>
</div>
<div style="display: flex; gap: 20px; font-size: 13px">
<label style="display: flex; align-items: center; gap: 8px; color: #C9D6EE"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #1F6BFF">Install driver updates with OS updates</label>
<a href="#" style="margin-left: auto">Roll back a driver</a>
</div>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"page":{"editor":"enum","options":["devices","drivers"],"default":"devices"},"$preview":{"width":1040,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const pg = this.props.page ?? 'devices';
    const N = [['Network','',''],['Bluetooth','',''],['Display','',''],['Devices','devices',''],['Drivers','drivers','3'],['Updates','',''],['About','','']];
    const nav = N.map(n => { const on = n[1] === pg; return { label: n[0], count: n[2], bg: on ? 'rgba(31,107,255,0.2)' : 'transparent', color: on ? '#FFFFFF' : '#C9D6EE', weight: on ? 600 : 400 }; });
    const OK = '#5FD39A', WARN = '#FFB98A', OFF = '#8FA3C8';
    const G = [
      ['Connected', [['HP LaserJet M110w','Printer · USB','Ready',OK,'M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z'],['Logitech MX Keys','Keyboard · Bluetooth','Connected',OK,'M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M8 14h8'],['Webcam C920','Camera · USB','Needs driver',WARN,'M4 7h11v10H4zM15 10l5-3v10l-5-3']]],
      ['Built in', [['Intel Wi-Fi 6 AX201','Network adapter','Working',OK,'M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0'],['NVIDIA GeForce RTX 3050','Graphics · open driver','Update available',WARN,'M3 6h18v12H3zM7 10h4v4H7z']]],
      ['Off', [['Fingerprint reader','Disabled in Privacy','Off',OFF,'M12 11v4M8 12a4 4 0 0 1 8 0v3M5 12a7 7 0 0 1 14 0']]]
    ];
    const groups = G.map(g => ({ name: g[0], items: g[1].map((d, i) => ({ name: d[0], sub: d[1], status: d[2], statusColor: d[3], icon: d[4], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' })) }));
    const D = [
      ['NVIDIA graphics','Proprietary · better gaming performance · restart required','545.29 → 550.40','PROPRIETARY','rgba(255,159,90,0.16)','#FFB98A',true,false],
      ['Logitech C920 webcam','Enables autofocus and 1080p','new · 2.1.0','RECOMMENDED','rgba(95,211,154,0.16)','#5FD39A',true,false],
      ['Intel Wi-Fi firmware','Stability fix for sleep and wake','83.0 → 86.1','SECURITY','rgba(255,138,122,0.16)','#FF8A7A',true,true],
      ['HP printer driver','Up to date','1.4.2','OPEN SOURCE','rgba(127,178,255,0.12)','#C9D6EE',false,false],
      ['Realtek audio','Up to date','6.0.9','OPEN SOURCE','rgba(127,178,255,0.12)','#C9D6EE',false,false]
    ];
    const drivers = D.map((d, i) => ({ name: d[0], sub: d[1], ver: d[2], tag: d[3], tagBg: d[4], tagColor: d[5], on: d[6], locked: d[7] || !d[6] && i > 2, border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' }));
    return { nav, groups, drivers, isDevices: pg === 'devices', isDrivers: pg === 'drivers',
      title: pg === 'devices' ? 'Devices' : 'Drivers', topAction: pg === 'devices' ? 'Add device' : 'Check for updates' };
  }
}
</script>
</body>
</html>
