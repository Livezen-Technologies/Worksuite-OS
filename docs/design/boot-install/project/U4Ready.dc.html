<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update ready to restart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; box-sizing: border-box; padding-bottom: 40px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.3) 0%, transparent 38%), radial-gradient(circle at 18% 80%, rgba(31,107,255,0.45) 0%, transparent 45%), linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%)">
<dc-import name="UpdSettings" state="ready" hint-size="1040px,640px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(2,6,16,0.55); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-labelledby="sch-t" style="width: 440px; box-sizing: border-box; border-radius: 18px; background: #0F2350; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden">
<div style="padding: 24px 24px 16px; display: flex; flex-direction: column; gap: 6px">
<h2 id="sch-t" style="margin: 0; font-size: 19px; font-weight: 700">When should we restart?</h2>
<p style="margin: 0; font-size: 14px; color: #C9D6EE">Save your work first. Open apps will reopen after the update.</p>
</div>
<div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid {{o.border}}; background: {{o.bg}}; cursor: pointer">
<input type="radio" name="when" checked="{{o.on}}" onChange="{{o.pick}}" style="width: 18px; height: 18px; accent-color: #1F6BFF">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{o.label}}</span><span style="font-size: 12px; color: #8FA3C8">{{o.desc}}</span></span>
</label>
</sc-for>
</div>
<div style="padding: 14px 18px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: flex-end; gap: 10px">
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Cancel</button>
<button style="all: unset; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; cursor: pointer">{{cta}}</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 1 }; }
  renderVals() {
    const P = [['Restart now', 'About 4 minutes', 'Restart now'], ['Tonight at 02:00', 'Recommended · leave it plugged in', 'Schedule for 02:00'], ['When I shut down', 'Installs before power off', 'Install on shut down'], ['Remind me tomorrow', 'Security fixes will wait', 'Remind me']];
    const cur = this.state.pick;
    return { cta: P[cur][2], opts: P.map((p, i) => ({ label: p[0], desc: p[1], on: i === cur,
      border: i === cur ? '#1F6BFF' : 'rgba(127,178,255,0.14)', bg: i === cur ? 'rgba(31,107,255,0.12)' : 'transparent',
      pick: () => this.setState({ pick: i }) })) };
  }
}
</script>
</body>
</html>
