<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recovery menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; position: relative; background: radial-gradient(ellipse 70% 50% at 50% 0%, #0E2A55 0%, #061029 60%, #030816 100%); font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA">
<header style="height: 64px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(127,178,255,0.1)">
<svg width="26" height="26" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#061029"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
<span style="font-size: 16px; font-weight: 600">WorkSuite Recovery</span>
<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E739C">1.1 · vda · EFI</span>
</header>
<div style="padding: 44px 120px 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Something went wrong at startup</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">WorkSuite OS didn't start correctly 3 times in a row. Choose how you'd like to fix it.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<button style="all: unset; display: flex; gap: 16px; padding: 18px 20px; border-radius: 14px; border: 1px solid {{i.border}}; background: {{i.bg}}; cursor: pointer">
<span style="width: 44px; height: 44px; border-radius: 12px; background: {{i.tint}}; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{i.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">{{i.title}}<sc-if value="{{i.tag}}" hint-placeholder-val="{{false}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 5px; background: rgba(95,211,154,0.16); color: #5FD39A">{{i.tag}}</span></sc-if></span>
<span style="font-size: 13px; color: #8FA3C8; line-height: 1.45">{{i.desc}}</span>
</span>
</button>
</sc-for>
</div>
</div>
<footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; box-sizing: border-box; padding: 0 40px; border-top: 1px solid rgba(127,178,255,0.1); display: flex; align-items: center; gap: 28px; font-size: 13px; color: #8FA3C8">
<button style="all: unset; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"></path></svg>Connect to Wi-Fi</button>
<button style="all: unset; cursor: pointer">English (US)</button>
<span style="margin-left: auto"></span>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.25); color: #E8EEFA; cursor: pointer">Restart</button>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.25); color: #E8EEFA; cursor: pointer">Shut down</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const I = [
      ['Startup repair','Automatically find and fix problems that stop WorkSuite OS from starting.','M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z','RECOMMENDED','#5FD39A','rgba(95,211,154,0.14)',true],
      ['Restore a snapshot','Go back to how the system was before a recent update. Files stay.','M3 12a9 9 0 1 0 2.6-6.4M3 4v5h5M12 8v4l3 2','','#7FB2FF','rgba(31,107,255,0.18)',false],
      ['Reinstall WorkSuite OS','Fresh system files. Choose whether to keep your files.','M12 4v11M7 10l5 5 5-5M4 20h16','','#7FB2FF','rgba(31,107,255,0.18)',false],
      ['Unlock disk with recovery key','Use if you forgot your disk passphrase.','M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z','','#7FB2FF','rgba(31,107,255,0.18)',false],
      ['Copy files to USB','Back up your files before making changes.','M9 3h6v6H9zM6 9h12v12H6z','','#7FB2FF','rgba(31,107,255,0.18)',false],
      ['Terminal','Advanced: a root shell for manual repair.','M4 5h16v14H4zM7 9l3 3-3 3M12 15h5','','#8FA3C8','rgba(127,178,255,0.1)',false]
    ];
    return { items: I.map(i => ({ title: i[0], desc: i[1], icon: i[2], tag: i[3], color: i[4], tint: i[5],
      border: i[6] ? '#1F6BFF' : 'rgba(127,178,255,0.14)', bg: i[6] ? 'rgba(31,107,255,0.12)' : 'rgba(14,32,72,0.55)' })) };
  }
}
</script>
</body>
</html>
