<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>On-screen keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit} button:focus-visible{outline:2px solid #18D4F0;outline-offset:2px} .k:active{background:#2A4A8F!important;transform:translateY(1px)} @keyframes blink{50%{opacity:0}}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(ellipse 80% 60% at 30% 10%, #1F4FB8 0%, #0A1A3D 60%)">
<section style="position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 760px; padding: 18px 20px; border-radius: 16px; background: #10244F; border: 1px solid rgba(127,178,255,0.2); display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #8FA3C8">Chat · Design team</span>
<div style="min-height: 56px; border-radius: 12px; border: 2px solid #1F6BFF; padding: 12px 14px; font-size: 18px; line-height: 1.4; word-break: break-word">{{text}}<span style="display: inline-block; width: 2px; height: 22px; margin-left: 1px; vertical-align: -4px; background: #18D4F0; animation: blink 1s step-end infinite"></span></div>
</section>
<div role="group" aria-label="On-screen keyboard" style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(7,19,48,0.97); border-top: 1px solid rgba(127,178,255,0.2); padding: 8px 28px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(20px)">
<div style="display: flex; align-items: center; height: 44px; gap: 6px">
<button aria-label="Emoji" onClick="{{emo}}" class="k" style="all: unset; width: 44px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer">☺</button>
<button aria-label="Clipboard" class="k" style="all: unset; width: 44px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer">📋</button>
<div style="flex: 1; display: flex; justify-content: center; gap: 2px">
<sc-for list="{{sugg}}" as="s" hint-placeholder-count="3"><button onClick="{{s.pick}}" class="k" style="all: unset; padding: 8px 26px; border-radius: 8px; font-size: 16px; color: {{s.col}}; font-weight: {{s.w}}; cursor: pointer; border-right: 1px solid rgba(127,178,255,0.12)">{{s.t}}</button></sc-for>
</div>
<button aria-label="Voice typing" class="k" style="all: unset; width: 44px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button aria-label="Keyboard layout" onClick="{{cycleMode}}" class="k" style="all: unset; padding: 0 12px; height: 36px; border-radius: 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #C9D6EE; cursor: pointer">⌨ {{modeName}}</button>
<button aria-label="Hide keyboard" class="k" style="all: unset; width: 44px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #C9D6EE; cursor: pointer">⌄</button>
</div>
<div style="display: flex; gap: {{gap}}; justify-content: center">
<sc-for list="{{halves}}" as="h" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px; width: {{h.w}}">
<sc-for list="{{h.rows}}" as="r" hint-placeholder-count="4"><div style="display: flex; gap: 7px; justify-content: center"><sc-for list="{{r}}" as="k" hint-placeholder-count="10"><button class="k" aria-label="{{k.a}}" onClick="{{k.p}}" style="all: unset; position: relative; flex: {{k.f}}; height: 58px; border-radius: 10px; background: {{k.bg}}; box-shadow: 0 1px 0 rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: {{k.fs}}; font-weight: 500; color: {{k.col}}; cursor: pointer"><span style="position: absolute; top: 4px; right: 7px; font-size: 10px; color: #5E739C">{{k.alt}}</span>{{k.l}}</button></sc-for></div></sc-for>
</div>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 248px; bottom: 228px; display: flex; gap: 4px; padding: 6px; border-radius: 12px; background: #E8EEFA; color: #0A1A3D; box-shadow: 0 10px 30px rgba(0,0,0,0.4); visibility: {{accVis}}"><span style="padding: 8px 12px; border-radius: 8px; font-size: 20px">è</span><span style="padding: 8px 12px; border-radius: 8px; font-size: 20px; background: #1F6BFF; color: #FFF">é</span><span style="padding: 8px 12px; border-radius: 8px; font-size: 20px">ê</span><span style="padding: 8px 12px; border-radius: 8px; font-size: 20px">ë</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p){super(p);this.state={text:'Can we move the review to',shift:0,page:'abc',mode:0};}
  renderVals(){
    const {text,shift,page,mode}=this.state, up=shift>0;
    const add=c=>()=>this.setState({text:text+(up?c.toUpperCase():c),shift:shift===1?0:shift});
    const K=(l,o={})=>({l,a:o.a||l,p:o.p||add(l),f:o.f||1,alt:o.alt||'',bg:o.bg||'rgba(127,178,255,0.16)',col:o.col||'#E8EEFA',fs:o.fs||'21px'});
    const dk='rgba(127,178,255,0.07)';
    const shiftK=K(shift===2?'⇪':'⇧',{a:'Shift',f:1.5,bg:shift?'#1F6BFF':dk,p:()=>this.setState({shift:(shift+1)%3})});
    const back=K('⌫',{a:'Backspace',f:1.5,bg:dk,p:()=>this.setState({text:text.slice(0,-1)})});
    const L=page==='abc'?[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']]:[['1','2','3','4','5','6','7','8','9','0'],['@','#','₹','_','&','-','+','(',')'],['*','"',"'",':',';','!','?']];
    const alts={q:'1',w:'2',e:'3',r:'4',t:'5',y:'6',u:'7',i:'8',o:'9',p:'0'};
    const rows=[L[0].map(c=>K(up?c.toUpperCase():c,{alt:page==='abc'?alts[c]:''})),L[1].map(c=>K(up?c.toUpperCase():c)),[shiftK].concat(L[2].map(c=>K(up?c.toUpperCase():c)),[back]),
      [K(page==='abc'?'?123':'ABC',{a:'Switch symbols',f:1.5,bg:dk,fs:'15px',p:()=>this.setState({page:page==='abc'?'123':'abc'})}),K(',',{bg:dk}),K('WorkSuite · EN',{a:'Space',f:5,fs:'13px',col:'#8FA3C8',p:()=>this.setState({text:text+' '})}),K('.',{bg:dk}),K('↵',{a:'Send',f:1.8,bg:'#1F6BFF',p:()=>this.setState({text:''})})]];
    const split=mode===1, cut=r=>{const h=Math.ceil(r.length/2);return [r.slice(0,h),r.slice(h)];};
    const halves=split?[0,1].map(i=>({w:'470px',rows:rows.map(r=>cut(r)[i])})):[{w:'1224px',rows}];
    const last=text.split(' ').pop().toLowerCase();
    const S=last===''||'tomorrow'.startsWith(last)?['tomorrow','Thursday','next week']:[last,last+'s',last+'ing'];
    return {text,halves,gap:split?'284px':'0',modeName:['Full','Split'][mode],cycleMode:()=>this.setState({mode:(mode+1)%2}),accVis:'hidden',
      emo:()=>this.setState({text:text+'👍'}),
      sugg:S.map((t,i)=>({t,col:i===0?'#FFFFFF':'#C9D6EE',w:i===0?600:400,pick:()=>this.setState({text:text.replace(/\S*$/,'')+t+' '})}))};
  }
}
</script>
</body>
</html>
