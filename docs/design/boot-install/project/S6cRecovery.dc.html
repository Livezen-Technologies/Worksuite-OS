<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Recovery key</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="Sidebar" step="6" sub="3" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 40px 56px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 6 · RECOVERY KEY</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Save your recovery key</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8; max-width: 640px">If you forget your disk passphrase, this key is the only way to unlock your files. We won't show it again.</p>
</div>
<div style="padding: 24px; border-radius: 16px; background: rgba(4,10,26,0.6); border: 1px dashed rgba(24,212,240,0.5); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
<span style="padding: 12px 0; text-align: center; border-radius: 8px; background: rgba(14,32,72,0.8); font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: 0.08em">{{g}}</span>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
<button style="all: unset; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>{{a.label}}</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid {{ackBorder}}; background: rgba(14,32,72,0.6); cursor: pointer">
<input type="checkbox" checked="{{ack}}" onChange="{{toggle}}" style="width: 20px; height: 20px; accent-color: #1F6BFF">
<span style="font-size: 15px">I've saved my recovery key somewhere safe</span>
</label>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: flex-end">
<button disabled="{{blocked}}" style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: {{ctaColor}}; background: {{ctaBg}}; cursor: pointer">Continue</button>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ack: false }; }
  renderVals() {
    const ack = this.state.ack;
    return { ack, groups: ['XXXXXX','XXXXXX','XXXXXX','XXXXXX','XXXXXX','XXXXXX','XXXXXX','XXXXXX'],
      actions: [{ label: 'Save to USB drive', icon: 'M9 3h6v6H9zM6 9h12v12H6zM10 13v4M14 13v4' }, { label: 'Show QR code', icon: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2z' }, { label: 'Print', icon: 'M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z' }],
      ackBorder: ack ? '#1F6BFF' : 'rgba(127,178,255,0.2)',
      blocked: !ack, ctaBg: ack ? '#1F6BFF' : 'rgba(31,107,255,0.3)', ctaColor: ack ? '#FFFFFF' : 'rgba(255,255,255,0.5)',
      toggle: () => this.setState({ ack: !ack }) };
  }
}
</script>
</body>
</html>
