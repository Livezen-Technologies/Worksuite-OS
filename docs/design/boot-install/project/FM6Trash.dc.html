<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files – trash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="FMSide" active="Trash" hint-size="220px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 60px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(127,178,255,0.12); background: #0C1E46">
<span style="font-size: 15px; font-weight: 600">Trash</span>
<button style="all: unset; margin-left: auto; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(127,178,255,0.25); font-size: 13px; display: flex; align-items: center; cursor: pointer">Restore all</button>
<button style="all: unset; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,138,122,0.45); color: #FFB4A8; font-size: 13px; font-weight: 600; display: flex; align-items: center; cursor: pointer">Empty Trash</button>
</header>
<div style="margin: 16px 24px 0; display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: rgba(31,107,255,0.08); border: 1px solid rgba(31,107,255,0.3); font-size: 13px; color: #C9D6EE">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"></path></svg>
<span>Items are deleted for good after 30 days. 5 items · 46 MB.</span>
</div>
<div style="flex: 1; padding: 12px 24px; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 240px 120px 140px; gap: 12px; padding: 10px 14px; font-size: 12px; color: #8FA3C8"><span>Name</span><span>Original location</span><span>Deleted</span><span></span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 240px 120px 140px; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: 13px; background: {{r.bg}}">
<span style="display: flex; align-items: center; gap: 10px; opacity: 0.85"><span style="width: 26px; height: 26px; border-radius: 6px; background: {{r.c}}; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 700">{{r.ext}}</span>{{r.n}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">{{r.loc}}</span>
<span style="color: {{r.whenColor}}">{{r.when}}</span>
<span style="display: flex; gap: 12px; justify-content: flex-end"><button style="all: unset; font-size: 13px; color: #7FB2FF; cursor: pointer">Restore</button><button style="all: unset; font-size: 13px; color: #8FA3C8; cursor: pointer">Delete</button></span>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [['Old logo.png','PNG','#7A4FE0','~/Pictures','Today'],['Draft v1.docx','DOCX','#1F6BFF','~/Documents/Projects','Yesterday'],['Screen recording.mp4','MP4','#D9572B','~/Videos','12 Oct'],['Invoice copy.pdf','PDF','#D9452B','~/Downloads','2 Oct'],['temp-notes.md','MD','#5E739C','~/Desktop','17 Sep · 2 days left']];
    return { rows: R.map((r, i) => ({ n: r[0], ext: r[1], c: r[2], loc: r[3], when: r[4], whenColor: r[4].includes('left') ? '#FFB98A' : '#C9D6EE', bg: i % 2 ? 'rgba(255,255,255,0.02)' : 'transparent' })) };
  }
}
</script>
</body>
</html>
