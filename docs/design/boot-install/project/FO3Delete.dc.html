<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File operations · delete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit} button:focus-visible{outline:2px solid #18D4F0;outline-offset:2px} @keyframes stripe{to{background-position:28px 0}}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: linear-gradient(160deg, #12306B, #050E24)"><div aria-hidden="true" style="position: absolute; inset: 40px 60px; border-radius: 14px; background: #0E2048; border: 1px solid rgba(127,178,255,0.12); display: flex; overflow: hidden"><div style="width: 200px; background: #0A1A3D"></div><div style="flex: 1; padding: 70px 30px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 26px; align-content: start"><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span></div></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(3,8,22,0.55)"></div>
<section role="alertdialog" aria-labelledby="dt" style="position: absolute; border-radius: 16px; background: #10244F; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.5); left: 50%; top: 50%; transform: translate(-50%,-50%); width: 520px; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 14px; align-items: flex-start"><span style="width: 42px; height: 42px; border-radius: 12px; background: {{iconBg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{iconCol}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></span><div style="display: flex; flex-direction: column; gap: 4px"><h2 id="dt" style="margin: 0; font-size: 18px; font-weight: 700">{{title}}</h2><span style="font-size: 13px; color: #C9D6EE; line-height: 1.5">{{body}}</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: rgba(4,10,26,0.35); font-size: 13px">
<span style="display: flex; justify-content: space-between"><span>📁 Old renders</span><span style="color: #8FA3C8; font-family: 'IBM Plex Mono', monospace">2.4 GB · 311 items</span></span>
<span style="display: flex; justify-content: space-between"><span>📄 draft-v1.psd</span><span style="color: #8FA3C8; font-family: 'IBM Plex Mono', monospace">640 MB</span></span>
<span style="display: flex; justify-content: space-between"><span>📄 notes.txt</span><span style="color: #8FA3C8; font-family: 'IBM Plex Mono', monospace">4 KB</span></span>
</div>
<div role="radiogroup" aria-label="Delete mode" style="display: flex; padding: 3px; border-radius: 10px; background: rgba(4,10,26,0.5)"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="all: unset; flex: 1; text-align: center; padding: 8px; border-radius: 8px; font-size: 13px; background: {{m.bg}}; cursor: pointer">{{m.label}}</button></sc-for></div>
<div style="display: flex; justify-content: flex-end; gap: 10px"><button style="all: unset; padding: 11px 20px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); font-size: 14px; cursor: pointer">Cancel</button><button style="all: unset; padding: 11px 22px; border-radius: 10px; background: {{ctaBg}}; color: {{ctaCol}}; font-size: 14px; font-weight: 600; cursor: pointer">{{cta}}</button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p){super(p);this.state={perm:false};}
  renderVals(){
    const p=this.state.perm;
    return {title:p?'Delete 3 items permanently?':'Move 3 items to Trash?',
      body:p?'This frees 3.0 GB right away. These items can’t be recovered from Trash or snapshots after 30 days.':'You can restore them from Trash for 30 days. Nothing leaves this computer.',
      iconBg:p?'rgba(255,138,122,0.16)':'rgba(31,107,255,0.2)',iconCol:p?'#FF8A7A':'#7FB2FF',
      cta:p?'Delete permanently':'Move to Trash',ctaBg:p?'#E5484D':'#1F6BFF',ctaCol:'#FFFFFF',
      modes:[['Move to Trash',false],['Delete permanently (Shift+Del)',true]].map(([l,v])=>({label:l,on:v===p,bg:v===p?(v?'rgba(229,72,77,0.35)':'#1F6BFF'):'transparent',pick:()=>this.setState({perm:v})}))};
  }
}
</script>
</body>
</html>
