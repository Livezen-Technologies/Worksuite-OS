<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – About</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="SetNav" active="About" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; padding: 26px 36px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #12306B 0%, #0A1A3D 60%)">

<div style="display: flex; align-items: center; gap: 22px; padding: 22px 24px; border-radius: 18px; background: radial-gradient(circle at 88% 15%, rgba(24,212,240,0.32), transparent 45%), linear-gradient(120deg, #173F94, #0D2353); border: 1px solid rgba(127,178,255,0.2)">
<svg width="76" height="76" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#14357A"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">WorkSuite OS 1.1</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9D6EE">stable · build 2026.10.14 · amd64</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5FD39A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FD39A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Up to date · checked 4 min ago</span>
</span>
<span style="display: flex; flex-direction: column; gap: 8px">
<button style="all: unset; padding: 9px 16px; border-radius: 9px; background: rgba(255,255,255,0.14); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer">Check for updates</button>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.25); font-size: 13px; text-align: center; cursor: pointer">Copy system info</button>
</span>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H4zM2 20h20"></path></svg>
<span style="font-size: 13px; color: #8FA3C8">Device name</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">alex-laptop</span>
<button style="all: unset; margin-left: auto; font-size: 13px; color: #7FB2FF; cursor: pointer">Rename</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{specs}}" as="s" hint-placeholder-count="6">
<div style="display: flex; gap: 12px; padding: 13px 14px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<span style="width: 34px; height: 34px; border-radius: 9px; background: rgba(31,107,255,0.16); display: flex; align-items: center; justify-content: center; flex: none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 11px; color: #8FA3C8; text-transform: uppercase; letter-spacing: 0.06em">{{s.k}}</span><span style="font-size: 13px; font-weight: 500">{{s.v}}</span><span style="font-size: 11px; color: #8FA3C8">{{s.d}}</span></span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">Storage · vda</span><span style="color: #8FA3C8">26.7 GB free of 39.5 GB</span></div>
<div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: rgba(127,178,255,0.12)">
<sc-for list="{{store}}" as="s" hint-placeholder-count="4"><span style="width: {{s.w}}; background: {{s.c}}"></span></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px">
<sc-for list="{{store}}" as="s" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #C9D6EE"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{s.c}}"></span>{{s.n}} {{s.size}}</span></sc-for>
</div>
</div>
<div style="padding: 6px 0; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<sc-for list="{{sec}}" as="s" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 16px; font-size: 12px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{s.c}}"></span><span style="flex: 1; color: #C9D6EE">{{s.k}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">{{s.v}}</span></div>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 22px; font-size: 13px; margin-top: auto">
<a href="#">Release notes</a><a href="#">Get help</a><a href="#">Licenses &amp; open source</a><a href="#">Privacy statement</a>
<span style="margin-left: auto; font-size: 12px; color: #5E739C">© 2026 [Company]</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [
      ['Processor','Intel Core i7-1360P','12 cores · up to 5.0 GHz','M7 7h10v10H7zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3'],
      ['Memory','16 GB LPDDR5','6.2 GB in use','M3 7h18v10H3zM7 11v2M11 11v2M15 11v2'],
      ['Graphics','NVIDIA RTX 3050','+ Intel Iris Xe','M3 6h18v12H3zM7 10h4v4H7z'],
      ['Display','14″ 2560 × 1600','120 Hz · 150% scale','M3 4h18v12H3zM8 20h8M12 16v4'],
      ['Desktop','WorkSuite Shell 1.1','Wayland session','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
      ['Kernel','6.11.4-worksuite','firmware 1.18.2','M4 5h16v14H4zM7 9l3 3-3 3M12 15h5']
    ];
    const ST = [['System','8.1 GB','20%','#1F6BFF'],['Apps','3.2 GB','8%','#18D4F0'],['Your files','1.4 GB','4%','#7A4FE0'],['Snapshots','0.1 GB','1%','#5E739C']];
    const SEC = [['Disk encryption','LUKS2 · on','#5FD39A'],['Secure Boot','enabled','#5FD39A'],['Firewall','on','#5FD39A'],['Managed by','[Company]','#B9A0FF']];
    return { specs: S.map(s => ({ k: s[0], v: s[1], d: s[2], icon: s[3] })),
      store: ST.map(s => ({ n: s[0], size: s[1], w: s[2], c: s[3] })),
      sec: SEC.map(s => ({ k: s[0], v: s[1], c: s[2] })) };
  }
}
</script>
</body>
</html>
