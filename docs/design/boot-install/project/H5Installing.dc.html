<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installing drivers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ws-spin{to{transform:rotate(360deg)}}
.ws-spin{animation:ws-spin 1s linear infinite;transform-origin:50% 50%}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; box-sizing: border-box; padding-bottom: 40px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.3) 0%, transparent 38%), radial-gradient(circle at 18% 80%, rgba(31,107,255,0.45) 0%, transparent 45%), linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%)">
<dc-import name="HwSettings" page="drivers" hint-size="1040px,640px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(2,6,16,0.55); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-labelledby="di-t" style="width: 500px; box-sizing: border-box; border-radius: 18px; background: #0F2350; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden">
<div style="padding: 24px 24px 12px; display: flex; flex-direction: column; gap: 6px">
<h2 id="di-t" style="margin: 0; font-size: 19px; font-weight: 700">Installing driver updates</h2>
<p style="margin: 0; font-size: 14px; color: #8FA3C8">A restore point was created first, so you can roll back.</p>
</div>
<div style="padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: {{r.bg}}">
<div style="display: flex; align-items: center; gap: 12px">
<sc-if value="{{r.done}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#5FD39A"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#0F2350" stroke-width="2.4" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{r.active}}" hint-placeholder-val="{{false}}"><svg class="ws-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18D4F0" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"></path></svg></sc-if>
<sc-if value="{{r.wait}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(127,178,255,0.3)"></span></sc-if>
<span style="flex: 1; font-size: 14px; font-weight: 500">{{r.name}}</span>
<span style="font-size: 12px; color: #8FA3C8">{{r.state}}</span>
</div>
<sc-if value="{{r.active}}" hint-placeholder-val="{{false}}"><div style="height: 4px; border-radius: 2px; background: rgba(127,178,255,0.12); overflow: hidden; margin-left: 32px"><div style="height: 100%; width: 62%; background: linear-gradient(90deg, #1F6BFF, #18D4F0)"></div></div></sc-if>
</div>
</sc-for>
</div>
<div style="margin: 0 16px 16px; display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(255,159,90,0.08); border: 1px solid rgba(255,159,90,0.3); font-size: 13px; color: #C9D6EE">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"></path></svg>
<span>The NVIDIA graphics driver needs a restart to finish. The screen may flicker briefly.</span>
</div>
<div style="padding: 14px 18px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: flex-end; gap: 10px">
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Run in background</button>
<button disabled style="all: unset; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.5); background: rgba(31,107,255,0.3)">Restart now</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [['Intel Wi-Fi firmware 86.1','Installed','done'],['Logitech C920 webcam 2.1.0','Installing… 62%','active'],['NVIDIA graphics 550.40','Waiting · 142 MB','wait']];
    return { rows: R.map(r => ({ name: r[0], state: r[1], done: r[2] === 'done', active: r[2] === 'active', wait: r[2] === 'wait', bg: r[2] === 'active' ? 'rgba(24,212,240,0.08)' : 'transparent' })) };
  }
}
</script>
</body>
</html>
