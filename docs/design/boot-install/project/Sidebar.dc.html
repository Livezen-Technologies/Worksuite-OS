<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav style="width: 260px; height: 800px; box-sizing: border-box; padding: 32px 20px; background: #071330; border-right: 1px solid rgba(127,178,255,0.12); display: flex; flex-direction: column; gap: 28px; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="28" height="28" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#071330"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
<span style="font-size: 16px; font-weight: 600; line-height: 1.25">WorkSuite OS Setup</span>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; background: {{s.bg}}">
<span style="width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; background: {{s.dot}}; color: {{s.dotText}}; flex: none">{{s.mark}}</span>
<span style="font-size: 14px; color: {{s.color}}; font-weight: {{s.weight}}">{{s.label}}</span>
</div>
<sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
<ul style="list-style: none; margin: 4px 0 6px 21px; padding: 0 0 0 18px; border-left: 2px solid rgba(127,178,255,0.18); display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{s.subs}}" as="u" hint-placeholder-count="2">
<li style="display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: {{u.color}}; font-weight: {{u.weight}}; background: {{u.bg}}">
<span style="width: 7px; height: 7px; border-radius: 50%; background: {{u.dot}}; flex: none"></span>{{u.label}}<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #5E739C">{{u.tag}}</span>
</li>
</sc-for>
</ul>
</sc-if>
</li>
</sc-for>
</ol>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E739C">
<span>{{modeLabel}}</span>
<span>1.0 · amd64 · EFI</span>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":1,"min":1,"max":6},"sub":{"editor":"int","default":1,"min":1,"max":4},"express":{"editor":"boolean","default":false},"$preview":{"width":260,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = Number(this.props.step ?? 1) - 1;
    const sub = Number(this.props.sub ?? 1) - 1;
    const ex = this.props.express === true || this.props.express === 'true';
    const S = [
      ['Language', ex ? ['Language'] : ['Language', 'Keyboard']],
      ['Installation type', ['Disk', 'Encryption']],
      ['Your account', ['Name and password', 'Computer name']],
      ['Time zone', [ex ? 'Region and city · auto' : 'Region and city']],
      ['Review', ['Summary', 'Confirm disk']],
      ['Install', ['Copy files', 'Configure system', 'Recovery key', 'Complete']]
    ];
    const steps = S.map((s, i) => ({
      label: s[0], mark: i < cur ? '✓' : String(i + 1), open: i === cur,
      bg: i === cur ? 'rgba(31,107,255,0.18)' : 'transparent',
      dot: i < cur ? '#5FD39A' : i === cur ? '#1F6BFF' : 'rgba(127,178,255,0.12)',
      dotText: i <= cur ? '#FFFFFF' : '#8FA3C8',
      color: i <= cur ? '#E8EEFA' : '#8FA3C8', weight: i === cur ? 600 : 400,
      subs: s[1].map((l, j) => ({ label: l.split(' · ')[0], tag: l.includes(' · ') ? 'AUTO' : '',
        dot: j < sub ? '#5FD39A' : j === sub ? '#18D4F0' : 'rgba(127,178,255,0.25)',
        color: j <= sub ? '#E8EEFA' : '#8FA3C8', weight: j === sub ? 600 : 400,
        bg: j === sub ? 'rgba(24,212,240,0.08)' : 'transparent' }))
    }));
    return { steps, modeLabel: ex ? 'Express install' : 'Custom install' };
  }
}
</script>
</body>
</html>
