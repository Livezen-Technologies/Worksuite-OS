<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cancel installation dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
@keyframes ws-pop{from{opacity:0;transform:translateY(8px) scale(0.98)}to{opacity:1;transform:none}}
.ws-pop{animation:ws-pop 0.18s ease-out}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D; overflow: hidden">
<dc-import name="Sidebar" step="1" sub="1" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 48px 56px 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 1 OF 6</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Welcome to WorkSuite OS</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">Choose your language and how you'd like to install.</p>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button onClick="{{open}}" style="all: unset; padding: 12px 16px; font-size: 15px; color: #8FA3C8; cursor: pointer">Quit installer</button>
<button style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #1F6BFF">Continue</button>
</footer>
</main>

<sc-if value="{{shown}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; background: rgba(2,6,16,0.62); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center">
<div class="ws-pop" role="alertdialog" aria-labelledby="dlg-t" aria-describedby="dlg-d" style="width: 460px; box-sizing: border-box; border-radius: 18px; background: #0F2350; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden">
<div style="padding: 28px 28px 22px; display: flex; gap: 18px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(255,159,90,0.14); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><circle cx="12" cy="18" r="0.5"></circle></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 id="dlg-t" style="margin: 0; font-size: 19px; font-weight: 700">Quit the installer?</h2>
<p id="dlg-d" style="margin: 0; font-size: 14px; color: #C9D6EE; line-height: 1.5">Nothing has been installed yet, and your disk hasn't changed. You can start again any time from the boot menu.</p>
</div>
</div>
<div style="padding: 16px 20px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: flex-end; gap: 10px">
<button onClick="{{close}}" style="all: unset; padding: 11px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; box-shadow: 0 6px 18px rgba(31,107,255,0.35); cursor: pointer">Keep installing</button>
<button onClick="{{close}}" style="all: unset; padding: 11px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #FFB4A8; border: 1px solid rgba(255,138,122,0.4); cursor: pointer">Quit installer</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { shown: true }; }
  renderVals() {
    return { shown: this.state.shown, open: () => this.setState({ shown: true }), close: () => this.setState({ shown: false }) };
  }
}
</script>
</body>
</html>
