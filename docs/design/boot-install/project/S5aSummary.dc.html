<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="Sidebar" step="5" sub="1" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 40px 56px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 5 · SUMMARY</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Check your choices</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">Nothing has changed on your disk yet.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<div style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.14)">
<span style="width: 36px; height: 36px; border-radius: 9px; background: rgba(31,107,255,0.18); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 12px; color: #8FA3C8; text-transform: uppercase; letter-spacing: 0.06em">{{c.k}}</span>
<span style="font-size: 15px; font-weight: 500">{{c.v}}</span>
<span style="font-size: 13px; color: #8FA3C8">{{c.d}}</span>
</span>
<button style="all: unset; align-self: flex-start; font-size: 13px; color: #7FB2FF; cursor: pointer">Edit</button>
</div>
</sc-for>
</div>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button style="all: unset; padding: 12px 16px; font-size: 15px; color: #8FA3C8; cursor: pointer">Quit installer</button>
<div style="display: flex; gap: 12px">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<button style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; box-shadow: 0 8px 24px rgba(31,107,255,0.35); cursor: pointer">Continue</button>
</div>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const C = [
      ['Language', 'English (US)', 'Keyboard: English (US)', 'M3 5h12M9 3v2M5 9c2 4 6 6 10 6M13 21l5-10 5 10M15 17h6'],
      ['Disk', 'Erase vda · 40.00 GiB', 'EFI 512 MiB + WorkSuite 39.50 GiB · swap file', 'M3 6h18v12H3zM17 12h.01'],
      ['Encryption', 'On · LUKS2', 'Passphrase set · asked at startup', 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4'],
      ['Account', 'Alex Perera (alex)', 'Administrator · password required', 'M12 8a4 4 0 1 0 0 .01M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6'],
      ['Computer name', 'alex-laptop', 'Visible on your network', 'M4 5h16v11H4zM2 20h20'],
      ['Time zone', 'Asia/Colombo · UTC+05:30', 'Detected automatically', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2']
    ];
    return { cards: C.map(c => ({ k: c[0], v: c[1], d: c[2], icon: c[3] })) };
  }
}
</script>
</body>
</html>
