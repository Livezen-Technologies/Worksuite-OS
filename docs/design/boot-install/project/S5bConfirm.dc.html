<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Confirm disk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="Sidebar" step="5" sub="2" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #3A1E22 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 40px 56px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #FFB98A; letter-spacing: 0.08em">STEP 5 · CONFIRM DISK</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">This will erase your disk</h1>
<p style="margin: 0; font-size: 15px; color: #C9D6EE">After you press Install, these changes can't be undone.</p>
</div>
<div style="border-radius: 14px; border: 1px solid rgba(255,159,90,0.4); background: rgba(255,159,90,0.06); overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid rgba(255,159,90,0.2)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="17" cy="12" r="1"></circle></svg>
<span style="flex: 1; font-size: 16px; font-weight: 600">vda · 40.00 GiB</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #FFB98A">/dev/vda</span>
</div>
<sc-for list="{{ops}}" as="o" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px; font-size: 14px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; width: 64px; padding: 3px 0; text-align: center; border-radius: 5px; background: {{o.tagBg}}; color: {{o.tagColor}}">{{o.tag}}</span>
<span style="flex: 1">{{o.text}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">{{o.size}}</span>
</div>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 1px solid {{ackBorder}}; background: rgba(14,32,72,0.6); cursor: pointer">
<input type="checkbox" checked="{{ack}}" onChange="{{toggle}}" style="width: 20px; height: 20px; accent-color: #D9452B">
<span style="font-size: 15px">I understand that all data on <strong>vda</strong> will be permanently deleted</span>
</label>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button style="all: unset; padding: 12px 16px; font-size: 15px; color: #8FA3C8; cursor: pointer">Quit installer</button>
<div style="display: flex; gap: 12px">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<button disabled="{{blocked}}" style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: {{ctaColor}}; background: {{ctaBg}}; cursor: pointer">Erase and install</button>
</div>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ack: false }; }
  renderVals() {
    const ack = this.state.ack;
    const O = [['DELETE','Existing partition table and all data','40.00 GiB','rgba(255,138,122,0.18)','#FF8A7A'],['CREATE','GPT partition table','','rgba(31,107,255,0.18)','#7FB2FF'],['CREATE','EFI system partition · FAT32','512 MiB','rgba(31,107,255,0.18)','#7FB2FF'],['CREATE','WorkSuite · ext4 in LUKS2','39.50 GiB','rgba(31,107,255,0.18)','#7FB2FF'],['FORMAT','Swap file on WorkSuite partition','auto','rgba(127,178,255,0.12)','#C9D6EE']];
    return { ack, ops: O.map(o => ({ tag: o[0], text: o[1], size: o[2], tagBg: o[3], tagColor: o[4] })),
      ackBorder: ack ? '#D9452B' : 'rgba(127,178,255,0.2)',
      blocked: !ack, ctaBg: ack ? '#D9452B' : 'rgba(217,69,43,0.3)', ctaColor: ack ? '#FFFFFF' : 'rgba(255,255,255,0.5)',
      toggle: () => this.setState({ ack: !ack }) };
  }
}
</script>
</body>
</html>
