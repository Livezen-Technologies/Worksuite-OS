<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ws-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ws-rise{animation:ws-rise 0.2s ease-out}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.3) 0%, transparent 38%), radial-gradient(circle at 18% 80%, rgba(31,107,255,0.45) 0%, transparent 45%), linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%)">
<div class="ws-rise" role="dialog" aria-label="Start" style="position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); width: 660px; height: 660px; box-sizing: border-box; border-radius: 22px; background: rgba(10,24,56,0.97); border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 40px 90px rgba(0,0,0,0.6); backdrop-filter: blur(24px); display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 26px 0; display: flex; flex-direction: column; gap: 18px; flex: 1; min-height: 0">
<div style="display: flex; align-items: center; gap: 10px; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 22px; background: rgba(4,10,26,0.6); border: 1px solid rgba(127,178,255,0.18); font-size: 14px; color: #8FA3C8">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
Type to search apps, files and settings
<span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 6px; border: 1px solid #3D5280; border-radius: 4px">Super Space</span>
</div>

<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 600">{{sectionTitle}}</span>
<button onClick="{{toggle}}" style="all: unset; display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: rgba(255,255,255,0.07); font-size: 12px; cursor: pointer">{{toggleLabel}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{chev}}"></path></svg></button>
</div>

<sc-if value="{{pinned}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px 6px">
<sc-for list="{{pins}}" as="p" hint-placeholder-count="12">
<button style="all: unset; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 4px; border-radius: 12px; background: {{p.bg}}; cursor: pointer">
<span style="position: relative; width: 44px; height: 44px; border-radius: 12px; background: {{p.c}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; box-shadow: 0 6px 14px rgba(0,0,0,0.25)">{{p.i}}<sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #D9452B; border: 2px solid #0A1838; font-size: 10px; display: flex; align-items: center; justify-content: center">{{p.badge}}</span></sc-if></span>
<span style="font-size: 12px; color: #E8EEFA">{{p.n}}</span>
</button>
</sc-for>
</div>
<div style="height: 1px; background: rgba(127,178,255,0.1)"></div>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 600">Recommended</span><span style="font-size: 12px; color: #7FB2FF">More ›</span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px">
<sc-for list="{{recs}}" as="r" hint-placeholder-count="6">
<span style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px">
<span style="width: 34px; height: 34px; border-radius: 8px; background: {{r.c}}; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 700; flex: none">{{r.i}}</span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</span><span style="font-size: 11px; color: #8FA3C8">{{r.d}}</span></span>
</span>
</sc-for>
</div>
</sc-if>

<sc-if value="{{all}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 1px; padding-right: 4px">
<sc-for list="{{alpha}}" as="g" hint-placeholder-count="5">
<span style="padding: 8px 10px 4px; font-size: 12px; font-weight: 700; color: #18D4F0">{{g.l}}</span>
<sc-for list="{{g.apps}}" as="a" hint-placeholder-count="2">
<span style="display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 9px"><span style="width: 30px; height: 30px; border-radius: 8px; background: {{a.c}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">{{a.i}}</span><span style="font-size: 13px">{{a.n}}</span><span style="margin-left: auto; font-size: 11px; color: #5E739C">{{a.tag}}</span></span>
</sc-for>
</sc-for>
</div>
</sc-if>
</div>

<div style="margin-top: 14px; padding: 12px 22px; display: flex; align-items: center; gap: 12px; background: rgba(4,10,26,0.45); border-top: 1px solid rgba(127,178,255,0.1)">
<button style="all: unset; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 10px; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #1F6BFF, #18D4F0); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">AP</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">Alex Perera</span><span style="font-size: 11px; color: #8FA3C8">[Company]</span></span>
</button>
<span style="margin-left: auto; display: flex; gap: 6px">
<sc-for list="{{footer}}" as="f" hint-placeholder-count="4">
<button aria-label="{{f.t}}" title="{{f.t}}" style="all: unset; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: rgba(255,255,255,0.05)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg></button>
</sc-for>
</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52px; box-sizing: border-box; padding: 0 10px; background: rgba(6,14,34,0.88); border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: center; gap: 6px">
<span style="width: 40px; height: 40px; border-radius: 10px; background: rgba(31,107,255,0.5); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="4" fill="#FFFFFF"></rect><rect x="20" y="20" width="20" height="20" fill="#1F4FB0"></rect><rect x="0" y="20" width="20" height="20" rx="4" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="4" fill="#18D4F0"></rect></svg></span>
<sc-for list="{{dock}}" as="d" hint-placeholder-count="5"><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 7px; background: {{d}}"></span></span></sc-for>
<span style="position: absolute; right: 16px; font-size: 12px; color: #C9D6EE">01:05</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { all: false }; }
  renderVals() {
    const all = this.state.all;
    const P = [['Files','F','#0E8FA8'],['Docs','D','#1F6BFF'],['Sheets','S','#2E9E6A'],['Mail','M','#D9572B','8'],['Chat','C','#7A4FE0','12'],['Browser','B','#B7791F'],['Calendar','31','#D9452B'],['Photos','P','#0E8FA8'],['Terminal','>','#3D5280'],['App Center','A','#1F6BFF','3'],['Settings','⚙','#5E739C'],['Monitor','~','#2E9E6A']];
    const R = [['Budget 2027.xlsx','XLSX','#2E9E6A','Edited 10 min ago'],['Q4 plan draft.docx','DOCX','#1F6BFF','Opened 1 h ago'],['Team offsite.pptx','PPTX','#D9572B','Yesterday'],['Signed NDA.pdf','PDF','#D9452B','From Mail · yesterday'],['Slack','NEW','#7A4FE0','Recently installed'],['Logo export.png','PNG','#7A4FE0','12 Oct']];
    const AL = [['A',[['App Center','A','#1F6BFF','']]],['B',[['Browser','B','#B7791F','']]],['C',[['Calendar','31','#D9452B',''],['Chat','C','#7A4FE0','']]],['D',[['Docs','D','#1F6BFF','']]],['F',[['Files','F','#0E8FA8','']]],['K',[['Krita','K','#7A4FE0','Flatpak']]],['M',[['Mail','M','#D9572B',''],['Monitor','~','#2E9E6A','']]],['O',[['Obsidian','O','#5E3FB0','AppImage']]],['S',[['Settings','⚙','#5E739C',''],['Sheets','S','#2E9E6A',''],['Slack','S','#7A4FE0','new']]],['T',[['Terminal','>','#3D5280','']]],['V',[['VS Code','V','#1F6BFF','.deb']]]];
    return { pinned: !all, all, sectionTitle: all ? 'All apps' : 'Pinned', toggleLabel: all ? 'Back' : 'All apps', chev: all ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6',
      toggle: () => this.setState({ all: !all }),
      pins: P.map((p, i) => ({ n: p[0], i: p[1], c: p[2], badge: p[3] || '', bg: i === 2 ? 'rgba(255,255,255,0.07)' : 'transparent' })),
      recs: R.map(r => ({ n: r[0], i: r[1], c: r[2], d: r[3] })),
      alpha: AL.map(g => ({ l: g[0], apps: g[1].map(a => ({ n: a[0], i: a[1], c: a[2], tag: a[3] })) })),
      footer: [['Files','M3 6h6l2 2h10v11H3z'],['Settings','M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2'],['Lock','M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z'],['Power','M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0']].map(f => ({ t: f[0], icon: f[1] })),
      dock: ['#0E8FA8','#1F6BFF','#2E9E6A','#D9572B','#7A4FE0'] };
  }
}
</script>
</body>
</html>
