<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – Privacy and security</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="SetNav" active="Privacy &amp; security" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; padding: 26px 36px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #0F3A3A 0%, #0A1A3D 60%)">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Privacy &amp; security</h1>

<div style="display: flex; align-items: center; gap: 22px; padding: 18px 22px; border-radius: 16px; background: linear-gradient(120deg, rgba(46,158,106,0.22), rgba(14,32,72,0.7)); border: 1px solid rgba(95,211,154,0.35)">
<div style="position: relative; width: 72px; height: 72px; flex: none">
<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30" fill="none" stroke="rgba(95,211,154,0.18)" stroke-width="7"></circle><circle cx="36" cy="36" r="30" fill="none" stroke="#5FD39A" stroke-width="7" stroke-linecap="round" stroke-dasharray="170 189" transform="rotate(-90 36 36)"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">{{score}}</span>
</div>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700">Your device is well protected</span><span style="font-size: 13px; color: #C9D6EE">1 suggestion: turn on automatic lock when you walk away.</span></span>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; background: #2E9E6A; font-size: 13px; font-weight: 600; cursor: pointer">Review</button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{status}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 13px 14px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{s.c}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
<span style="font-size: 13px; font-weight: 600">{{s.t}}</span>
<span style="font-size: 11px; color: {{s.c}}">{{s.d}}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; flex: 1; min-height: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 600">App permissions</span><span style="font-size: 11px; color: #8FA3C8">Recently used</span></div>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{perms}}" as="p" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: {{p.border}}; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 500">{{p.t}}</span><span style="font-size: 11px; color: #8FA3C8">{{p.d}}</span></span>
<sc-if value="{{p.live}}" hint-placeholder-val="{{false}}"><span style="font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(255,159,90,0.2); color: #FFB98A">IN USE</span></sc-if>
<input type="checkbox" checked="{{p.on}}" onChange="{{p.toggle}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<span aria-hidden="true" style="width: 40px; height: 24px; border-radius: 12px; background: {{p.track}}; position: relative; flex: none"><span style="position: absolute; top: 3px; left: {{p.knob}}; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span>
</label>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Data and history</span>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{data}}" as="d" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: {{d.border}}; font-size: 13px">
<span style="flex: 1">{{d.t}}</span><span style="color: #C9D6EE; font-size: 12px">{{d.v}}</span><span style="color: #5E739C">›</span>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: #8FA3C8">IT can see device health and policy status only. <a href="#">What does IT see?</a></span>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { cam: true, mic: true, loc: false, scr: false, files: true } }; }
  renderVals() {
    const on = this.state.on;
    const P = [['cam','Camera','Chat, Browser','M4 7h11v10H4zM15 10l5-3v10l-5-3',1],['mic','Microphone','Chat','M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0',1],['loc','Location','Off for all apps','M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z',0],['scr','Screen sharing','Apps must ask every time','M3 4h18v12H3zM8 20h8',0],['files','Folders','Apps ask before opening','M3 6h6l2 2h10v11H3z',0]];
    return { score: '92',
      status: [['Encrypted','LUKS2 · on','M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4','#5FD39A'],['Firewall','Blocking incoming','M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z','#5FD39A'],['Secure Boot','Enabled','M5 12.5l4.5 4.5L19 7.5','#5FD39A'],['Walk-away lock','Off · suggested','M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z','#FFB98A']].map(s => ({ t: s[0], d: s[1], icon: s[2], c: s[3] })),
      perms: P.map((p, i) => { const v = !!on[p[0]]; return { t: p[1], d: p[2], icon: p[3], live: !!p[4] && v, on: v, border: i ? '1px solid rgba(127,178,255,0.1)' : 'none',
        track: v ? '#1F6BFF' : 'rgba(127,178,255,0.25)', knob: v ? '19px' : '3px', toggle: () => this.setState({ on: Object.assign({}, on, { [p[0]]: !v }) }) }; }),
      data: [['Recent files','Keep 30 days'],['Search history','On this device'],['Crash reports','Ask each time'],['Usage statistics','Off'],['Clear all history','']].map((d, i) => ({ t: d[0], v: d[1], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' })) };
  }
}
</script>
</body>
</html>
