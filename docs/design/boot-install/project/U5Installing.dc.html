<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installing update</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ws-spin{to{transform:rotate(360deg)}}
.ws-spin{animation:ws-spin 1.4s linear infinite;transform-origin:50% 50%}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #040A1A; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
<div style="position: relative; width: 120px; height: 120px">
<svg class="ws-spin" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(127,178,255,0.12)" stroke-width="4"></circle><path d="M60 6a54 54 0 0 1 54 54" fill="none" stroke="#18D4F0" stroke-width="4" stroke-linecap="round"></path></svg>
<svg width="48" height="48" viewBox="0 0 60 60" aria-hidden="true" style="position: absolute; left: 36px; top: 36px"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#040A1A"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<h1 style="margin: 0; font-size: 28px; font-weight: 500">Updating WorkSuite OS · {{pct}}%</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">Don't turn off your computer. It will restart once more.</p>
</div>
<div style="width: 420px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 4px; border-radius: 2px; background: rgba(127,178,255,0.12); overflow: hidden"><div style="height: 100%; width: {{w}}; background: linear-gradient(90deg, #1F6BFF, #18D4F0)"></div></div>
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E739C"><span>{{phase}}</span><span>1.0 → 1.1</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"percent":{"editor":"range","default":37,"min":0,"max":100,"step":1},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.percent ?? 37;
    const phase = p < 10 ? 'Creating restore snapshot' : p < 70 ? 'Applying system files' : p < 95 ? 'Updating drivers' : 'Finishing up';
    return { pct: p, w: p + '%', phase };
  }
}
</script>
</body>
</html>
