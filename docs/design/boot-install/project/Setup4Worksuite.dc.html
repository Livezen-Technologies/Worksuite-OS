<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup – WorkSuite apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 64px 0 48px; background: radial-gradient(ellipse 70% 60% at 50% 0%, #163B82 0%, #0A1A3D 60%, #060E22 100%); font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; display: flex; flex-direction: column; align-items: center; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">4 OF 5</div>
<h1 style="margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">Choose your WorkSuite apps</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">We'll install these in the background. Add more later from the App Center.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: 900px">
<sc-for list="{{apps}}" as="a" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; border: 1px solid {{a.border}}; background: {{a.bg}}; cursor: pointer">
<span style="width: 44px; height: 44px; border-radius: 11px; background: {{a.color}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #FFFFFF; flex: none">{{a.initial}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">{{a.name}}</span>
<span style="font-size: 12px; color: #8FA3C8">{{a.desc}}</span>
</span>
<input type="checkbox" checked="{{a.on}}" onChange="{{a.toggle}}" aria-label="{{a.name}}" style="width: 20px; height: 20px; accent-color: #1F6BFF">
</label>
</sc-for>
</div>
<div style="width: 900px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.16)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#18D4F0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Sign in to your WorkSuite workspace</span>
<span style="font-size: 13px; color: #8FA3C8">Sync files, mail and settings from your organization.</span>
</span>
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #E8EEFA; border: 1px solid rgba(127,178,255,0.3); cursor: pointer">Sign in</button>
</div>
<div style="margin-top: auto; width: 900px; display: flex; justify-content: space-between; align-items: center">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; color: #E8EEFA; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<div style="display: flex; gap: 8px" aria-hidden="true">
<span style="width: 6px; height: 6px; border-radius: 3px; background: #5FD39A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #5FD39A"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: #5FD39A"></span>
<span style="width: 24px; height: 6px; border-radius: 3px; background: #18D4F0"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(127,178,255,0.3)"></span>
</div>
<button style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; box-shadow: 0 8px 24px rgba(31,107,255,0.35); cursor: pointer">Install {{count}} apps</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { off: { Notes: true } }; }
  renderVals() {
    const off = this.state.off;
    const A = [['Docs','Documents & PDFs','#1F6BFF'],['Sheets','Spreadsheets','#2E9E6A'],['Mail','Email & calendar','#D9572B'],['Chat','Team messaging','#7A4FE0'],['Drive','Cloud files','#0E8FA8'],['Notes','Quick notes','#B7791F']];
    const apps = A.map(a => {
      const on = !off[a[0]];
      return { name: a[0], desc: a[1], color: a[2], initial: a[0][0], on,
        border: on ? 'rgba(31,107,255,0.6)' : 'rgba(127,178,255,0.16)', bg: on ? 'rgba(31,107,255,0.1)' : 'rgba(14,32,72,0.6)',
        toggle: () => this.setState({ off: Object.assign({}, off, { [a[0]]: on }) }) };
    });
    return { apps, count: apps.filter(a => a.on).length };
  }
}
</script>
</body>
</html>
