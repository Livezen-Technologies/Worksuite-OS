<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recovery – restore snapshot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; position: relative; background: radial-gradient(ellipse 70% 50% at 50% 0%, #0E2A55 0%, #061029 60%, #030816 100%); font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA">
<header style="height: 64px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(127,178,255,0.1)">
<button aria-label="Back to recovery menu" style="all: unset; width: 36px; height: 36px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.2); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="font-size: 16px; font-weight: 600">WorkSuite Recovery</span>
</header>
<div style="padding: 40px 160px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Restore a snapshot</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">System files go back to the chosen point. Documents, photos and other personal files are not touched.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{snaps}}" as="s" hint-placeholder-count="4">
<label style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 12px; border: 1px solid {{s.border}}; background: {{s.bg}}; cursor: pointer">
<input type="radio" name="snap" checked="{{s.on}}" onChange="{{s.pick}}" style="width: 18px; height: 18px; accent-color: #1F6BFF">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">{{s.title}}<sc-if value="{{s.tag}}" hint-placeholder-val="{{false}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 5px; background: rgba(95,211,154,0.16); color: #5FD39A">{{s.tag}}</span></sc-if></span>
<span style="font-size: 13px; color: #8FA3C8">{{s.desc}}</span>
</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">{{s.ver}}</span>
</label>
</sc-for>
</div>
<div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(31,107,255,0.08); border: 1px solid rgba(31,107,255,0.3); font-size: 13px; color: #C9D6EE">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5h.01"></path></svg>
<span>Apps installed after {{when}} will need to be reinstalled. A snapshot of the current state is saved first, so you can undo this.</span>
</div>
</div>
<footer style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding: 0 160px; border-top: 1px solid rgba(127,178,255,0.1); display: flex; align-items: center; justify-content: flex-end; gap: 12px">
<button style="all: unset; padding: 12px 22px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Cancel</button>
<button style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; box-shadow: 0 8px 24px rgba(31,107,255,0.35); cursor: pointer">Restore and restart</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 0 }; }
  renderVals() {
    const S = [['Before update to 1.1','Today, 02:03 · automatic','1.0','LAST WORKING','02:03 today'],['Weekly snapshot','Sun 11 Oct, 03:00 · automatic','1.0','','11 Oct'],['Before installing Docs','Thu 8 Oct, 14:22 · app install','1.0','','8 Oct'],['After first setup','Thu 1 Oct, 18:40 · install','1.0','','1 Oct']];
    const cur = this.state.pick;
    return { when: S[cur][4], snaps: S.map((s, i) => ({ title: s[0], desc: s[1], ver: 'v' + s[2], tag: s[3], on: i === cur,
      border: i === cur ? '#1F6BFF' : 'rgba(127,178,255,0.14)', bg: i === cur ? 'rgba(31,107,255,0.12)' : 'rgba(14,32,72,0.5)',
      pick: () => this.setState({ pick: i }) })) };
  }
}
</script>
</body>
</html>
