<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Region and city</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="Sidebar" step="4" sub="1" express="{{express}}" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 40px 56px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 4 · REGION AND CITY</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Where are you?</h1>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(95,211,154,0.08); border: 1px solid rgba(95,211,154,0.35)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5FD39A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>
<span style="flex: 1; font-size: 14px"><strong>Detected automatically</strong> · Asia/Colombo from your network</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(95,211,154,0.18); color: #5FD39A">AUTO</span>
</div>
<div style="position: relative; height: 260px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(127,178,255,0.16); background-color: #081634; background-image: radial-gradient(rgba(127,178,255,0.22) 1.2px, transparent 1.4px); background-size: 14px 14px">
<div style="position: absolute; top: 0; bottom: 0; left: 66%; width: 40px; background: rgba(24,212,240,0.14); border-left: 1px solid rgba(24,212,240,0.4); border-right: 1px solid rgba(24,212,240,0.4)"></div>
<div style="position: absolute; left: calc(66% + 12px); top: 146px; width: 16px; height: 16px; border-radius: 50%; background: #18D4F0; box-shadow: 0 0 0 6px rgba(24,212,240,0.25), 0 0 20px rgba(24,212,240,0.8)"></div>
<div style="position: absolute; left: calc(66% + 44px); top: 130px; padding: 8px 12px; border-radius: 8px; background: rgba(4,10,26,0.85); border: 1px solid rgba(127,178,255,0.2); display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Colombo</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">UTC+05:30 · 20:08</span></div>
</div>
<sc-if value="{{custom}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="reg" style="font-size: 13px; font-weight: 500; color: #C9D6EE">Region</label><select id="reg" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit"><option>Asia</option><option>Europe</option><option>Americas</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="city" style="font-size: 13px; font-weight: 500; color: #C9D6EE">City</label><select id="city" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit"><option>Colombo</option><option>Kolkata</option><option>Dubai</option></select></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #C9D6EE; padding-top: 22px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1F6BFF">Set time from the internet</label>
</div>
</sc-if>
<sc-if value="{{express}}" hint-placeholder-val="{{false}}">
<button style="all: unset; font-size: 14px; color: #7FB2FF; cursor: pointer">Not right? Choose region and city</button>
</sc-if>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button style="all: unset; padding: 12px 16px; font-size: 15px; color: #8FA3C8; cursor: pointer">Quit installer</button>
<div style="display: flex; gap: 12px">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<button style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; box-shadow: 0 8px 24px rgba(31,107,255,0.35); cursor: pointer">Continue</button>
</div>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"express":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const ex = !!(this.props.express ?? false);
    return { express: ex, custom: !ex };
  }
}
</script>
</body>
</html>
