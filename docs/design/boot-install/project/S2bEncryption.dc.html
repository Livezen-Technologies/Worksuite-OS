<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Encryption</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="Sidebar" step="2" sub="2" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 40px 56px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 2 · ENCRYPTION</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Encrypt your disk?</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8; max-width: 640px">Keeps your files safe if the computer is lost or stolen. You'll type this passphrase each time it starts.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button onClick="{{on}}" style="all: unset; display: flex; gap: 14px; padding: 18px; border-radius: 12px; border: 1px solid {{onBorder}}; background: {{onBg}}; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#18D4F0" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600">Encrypt (recommended)</span><span style="font-size: 13px; color: #8FA3C8">LUKS2 full-disk encryption</span></span>
</button>
<button onClick="{{off}}" style="all: unset; display: flex; gap: 14px; padding: 18px; border-radius: 12px; border: 1px solid {{offBorder}}; background: {{offBg}}; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600">Don't encrypt</span><span style="font-size: 13px; color: #8FA3C8">Faster setup, no passphrase at startup</span></span>
</button>
</div>
<sc-if value="{{enc}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.14)">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p1" style="font-size: 13px; font-weight: 500; color: #C9D6EE">Passphrase</label>
<input id="p1" type="password" onInput="{{setA}}" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p2" style="font-size: 13px; font-weight: 500; color: #C9D6EE">Confirm passphrase</label>
<input id="p2" type="password" onInput="{{setB}}" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{confirmBorder}}; background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit">
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><div style="height: 4px; border-radius: 2px; background: {{b}}"></div></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px">
<span style="color: {{msgColor}}">{{msg}}</span>
<span style="color: #8FA3C8">Strength: {{strength}}</span>
</div>
</div>
<div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(255,159,90,0.08); border: 1px solid rgba(255,159,90,0.3); font-size: 13px; color: #C9D6EE">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path></svg>
<span>If you forget this passphrase, the recovery key (shown at the end of install) is the only way back in.</span>
</div>
</sc-if>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button style="all: unset; padding: 12px 16px; font-size: 15px; color: #8FA3C8; cursor: pointer">Quit installer</button>
<div style="display: flex; gap: 12px">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<button disabled="{{blocked}}" style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: {{ctaColor}}; background: {{ctaBg}}; cursor: pointer">Continue</button>
</div>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { enc: true, a: '', b: '' }; }
  renderVals() {
    const { enc, a, b } = this.state;
    const score = Math.min(4, (a.length >= 8) + (a.length >= 12) + /[0-9]/.test(a) + /[^A-Za-z0-9]/.test(a));
    const names = ['—', 'Weak', 'Fair', 'Good', 'Strong'];
    const col = ['#FF8A7A', '#FF8A7A', '#FFB98A', '#18D4F0', '#5FD39A'][score];
    let msg = 'At least 8 characters', mc = '#8FA3C8', cb = 'rgba(127,178,255,0.25)';
    if (b && a !== b) { msg = 'Passphrases do not match'; mc = '#FF8A7A'; cb = '#FF8A7A'; }
    else if (b && a === b && a.length >= 8) { msg = 'Passphrases match'; mc = '#5FD39A'; cb = '#5FD39A'; }
    const ok = !enc || (a.length >= 8 && a === b);
    const sel = 'rgba(31,107,255,0.12)', un = 'rgba(14,32,72,0.6)';
    return { enc, msg, msgColor: mc, confirmBorder: cb, strength: names[score],
      bars: [0,1,2,3].map(i => i < score ? col : 'rgba(127,178,255,0.15)'),
      onBorder: enc ? '#1F6BFF' : 'rgba(127,178,255,0.16)', onBg: enc ? sel : un,
      offBorder: !enc ? '#1F6BFF' : 'rgba(127,178,255,0.16)', offBg: !enc ? sel : un,
      blocked: !ok, ctaBg: ok ? '#1F6BFF' : 'rgba(31,107,255,0.3)', ctaColor: ok ? '#FFFFFF' : 'rgba(255,255,255,0.5)',
      on: () => this.setState({ enc: true }), off: () => this.setState({ enc: false }),
      setA: e => this.setState({ a: e.target.value }), setB: e => this.setState({ b: e.target.value }) };
  }
}
</script>
</body>
</html>
