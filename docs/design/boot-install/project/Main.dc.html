<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WorkSuite OS boot menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: radial-gradient(ellipse 70% 55% at 50% 30%, #12306B 0%, #0A1A3D 55%, #060E22 100%); font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden">

<div style="margin-top: 104px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="72" height="72" viewBox="0 0 60 60" aria-hidden="true">
<rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect>
<rect x="20" y="20" width="20" height="20" fill="#0A1A3D"></rect>
<rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect>
<rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect>
</svg>
<h1 style="margin: 18px 0 0; font-size: 44px; font-weight: 700; letter-spacing: -0.02em">WorkSuite OS</h1>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8FA3C8; display: flex; gap: 10px; align-items: center">
<span>1.0</span><span style="color: #3D5280">/</span><span>amd64</span><span style="color: #3D5280">/</span><span>built 2026-10-15</span>
</div>
</div>

<div style="margin-top: 52px; width: 520px; box-sizing: border-box; padding: 10px; background: rgba(14, 32, 72, 0.72); border: 1px solid rgba(127, 178, 255, 0.16); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 4px">
<button style="all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 10px; background: #1F6BFF; box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 8px 24px rgba(31,107,255,0.35); cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M4 20h16"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
<span style="font-size: 16px; font-weight: 600; color: #FFFFFF">Install WorkSuite OS</span>
<span style="font-size: 13px; color: #DCE7FF">Recommended for most computers</span>
</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #FFFFFF; padding: 3px 8px; border: 1px solid rgba(255,255,255,0.4); border-radius: 6px">Enter</span>
</button>
<button style="all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 10px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
<span style="font-size: 16px; font-weight: 500; color: #E8EEFA">Install (safe graphics)</span>
<span style="font-size: 13px; color: #8FA3C8">Use if the screen goes blank or flickers</span>
</span>
</button>
<div style="height: 1px; background: rgba(127,178,255,0.12); margin: 4px 12px"></div>
<button style="all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 10px; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
<span style="font-size: 16px; font-weight: 500; color: #E8EEFA">Utilities</span>
<span style="font-size: 13px; color: #8FA3C8">Memory test, disk check, boot from local drive</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="margin-top: 22px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8FA3C8">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5FD39A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span>Nothing on your disk changes until you confirm in the installer.</span>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid rgba(127,178,255,0.1); background: rgba(4,10,26,0.5); display: flex; align-items: center; justify-content: center; gap: 36px; font-size: 13px; color: #8FA3C8">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 2px 7px; border: 1px solid #3D5280; border-radius: 5px; color: #C9D6EE">↑ ↓</span>Select</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 2px 7px; border: 1px solid #3D5280; border-radius: 5px; color: #C9D6EE">Enter</span>Start</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 2px 7px; border: 1px solid #3D5280; border-radius: 5px; color: #C9D6EE">E</span>Edit entry</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 2px 7px; border: 1px solid #3D5280; border-radius: 5px; color: #C9D6EE">C</span>Command line</span>
<span style="display: flex; align-items: center; gap: 8px; color: #C9D6EE">Auto-start in <span style="font-family: 'IBM Plex Mono', monospace">{{countdown}}s</span></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"countdown":{"editor":"int","default":10,"min":0,"max":60},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { countdown: this.props.countdown ?? 10 };
  }
}
</script>
</body>
</html>
