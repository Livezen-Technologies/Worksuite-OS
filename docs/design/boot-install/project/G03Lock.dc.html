<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – Lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="SetNav" active="Lock screen" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; padding: 32px 44px; display: flex; flex-direction: column; gap: 18px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #12306B 0%, #0A1A3D 60%)">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Lock screen</h1>
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: rgba(122,79,224,0.12); border: 1px solid rgba(122,79,224,0.4); font-size: 13px; color: #C9D6EE">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9A0FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14"></path></svg>
<span>Some settings are managed by <strong>[Company]</strong>. You can make them stricter, not looser.</span>
</div>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-top: {{r.border}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500">{{r.k}}<sc-if value="{{r.managed}}" hint-placeholder-val="{{false}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(122,79,224,0.2); color: #B9A0FF">MANAGED</span></sc-if></span><span style="font-size: 12px; color: #8FA3C8">{{r.d}}</span></span>
<sc-if value="{{r.isToggle}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 44px; height: 26px; border-radius: 13px; background: {{r.track}}; position: relative; opacity: {{r.op}}"><span style="position: absolute; top: 3px; left: {{r.knob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></span></sc-if>
<sc-if value="{{r.isSelect}}" hint-placeholder-val="{{false}}"><span style="min-width: 170px; box-sizing: border-box; padding: 9px 12px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); font-size: 13px; display: flex; justify-content: space-between">{{r.v}}<span style="color: #8FA3C8">▾</span></span></sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">Lock now</span><span style="font-size: 12px; color: #8FA3C8">Or press Super + L</span></span>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; background: #1F6BFF; font-size: 13px; font-weight: 600; cursor: pointer">Lock</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const R = [
      ['Lock before sleep','Always asks for your password after suspend or lid close','toggle',true,true],
      ['Lock when idle','Turn screen off after 5 min, lock 30 s later','select','5 minutes',true],
      ['Show notifications on lock screen','App names only, never message text','select','Names only',false],
      ['Lock when I walk away','Uses your paired phone over Bluetooth','toggle',false,false],
      ['Allow fingerprint to unlock','Password still needed after restart','toggle',true,false],
      ['Lock screen wallpaper','Same as desktop','select','WorkSuite Blocks',false]
    ];
    return { rows: R.map((r, i) => ({ k: r[0], d: r[1], isToggle: r[2] === 'toggle', isSelect: r[2] === 'select', v: r[3], managed: r[4],
      track: r[3] === true ? '#1F6BFF' : 'rgba(127,178,255,0.25)', knob: r[3] === true ? '21px' : '3px', op: r[4] ? 0.6 : 1,
      border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' })) };
  }
}
</script>
</body>
</html>
