<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File operations · conflict</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit} button:focus-visible{outline:2px solid #18D4F0;outline-offset:2px} @keyframes stripe{to{background-position:28px 0}}</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: linear-gradient(160deg, #12306B, #050E24)"><div aria-hidden="true" style="position: absolute; inset: 40px 60px; border-radius: 14px; background: #0E2048; border: 1px solid rgba(127,178,255,0.12); display: flex; overflow: hidden"><div style="width: 200px; background: #0A1A3D"></div><div style="flex: 1; padding: 70px 30px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 26px; align-content: start"><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span><span style="height: 80px; border-radius: 10px; background: rgba(127,178,255,0.08)"></span></div></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(3,8,22,0.55)"></div>
<section role="alertdialog" aria-labelledby="ct" style="position: absolute; border-radius: 16px; background: #10244F; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.5); left: 50%; top: 50%; transform: translate(-50%,-50%); width: 640px; padding: 26px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 14px; align-items: flex-start"><span style="width: 42px; height: 42px; border-radius: 12px; background: rgba(255,159,90,0.16); display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"></path></svg></span><div style="display: flex; flex-direction: column; gap: 4px"><h2 id="ct" style="margin: 0; font-size: 18px; font-weight: 700">“Proposal.docx” already exists</h2><span style="font-size: 13px; color: #8FA3C8">Copying to Documents/Clients · conflict 1 of 7</span></div></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
<sc-for list="{{sides}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="all: unset; display: flex; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid {{s.bd}}; background: {{s.bg}}; cursor: pointer"><span style="width: 44px; height: 54px; border-radius: 6px; background: #E8EEFA; color: #1F6BFF; font-size: 10px; font-weight: 700; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; box-sizing: border-box; flex: none">DOCX</span><span style="display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #C9D6EE"><span style="font-size: 11px; color: #8FA3C8; letter-spacing: .06em">{{s.label}}</span><span style="font-size: 14px; font-weight: 600; color: #E8EEFA">{{s.size}}</span><span>{{s.date}}</span><span style="color: {{s.noteCol}}">{{s.note}}</span></span></button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{acts}}" as="a" hint-placeholder-count="4"><button onClick="{{a.pick}}" role="radio" aria-checked="{{a.on}}" style="all: unset; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; border: 1px solid {{a.bd}}; background: {{a.bg}}; cursor: pointer"><span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid {{a.bd}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{a.dot}}"></span></span><span style="flex: 1; font-size: 14px">{{a.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">{{a.hint}}</span></button></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding-top: 6px"><label style="flex: 1; display: flex; gap: 8px; align-items: center; font-size: 13px; color: #C9D6EE"><input type="checkbox" checked="{{all}}" onChange="{{toggleAll}}" style="accent-color: #1F6BFF; width: 16px; height: 16px">Do this for all 7 conflicts</label><button style="all: unset; padding: 11px 18px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); font-size: 14px; cursor: pointer">Cancel copy</button><button style="all: unset; padding: 11px 24px; border-radius: 10px; background: #1F6BFF; font-size: 14px; font-weight: 600; cursor: pointer">{{cta}}</button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p){super(p);this.state={act:0,all:false};}
  renderVals(){
    const {act,all}=this.state;
    const A=[['Keep both','Proposal (2).docx','Keep both'],['Replace','newer wins','Replace'],['Skip','leave existing','Skip'],['Merge folders',' ','Merge']];
    const sides=[['EXISTING','184 KB','Edited 2 Oct 2026, 14:10','',''],['INCOMING','201 KB','Edited 15 Oct 2026, 09:42','Newer · 17 KB larger','#5FD39A']].map((s,i)=>({label:s[0],size:s[1],date:s[2],note:s[3],noteCol:s[4],on:(act===1)===(i===1),bd:(act===1&&i===1)?'#1F6BFF':'rgba(127,178,255,0.18)',bg:(act===1&&i===1)?'rgba(31,107,255,0.12)':'rgba(4,10,26,0.3)',pick:()=>this.setState({act:i===1?1:2})}));
    const acts=A.slice(0,3).map((a,i)=>({name:a[0],hint:a[1],on:i===act,bd:i===act?'#1F6BFF':'rgba(127,178,255,0.15)',bg:i===act?'rgba(31,107,255,0.12)':'transparent',dot:i===act?'#1F6BFF':'transparent',pick:()=>this.setState({act:i})}));
    return {sides,acts,all,toggleAll:()=>this.setState({all:!all}),cta:A[act][2]+(all?' all':'')};
  }
}
</script>
</body>
</html>
