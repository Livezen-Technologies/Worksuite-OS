<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutdown confirm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%); display: flex; align-items: center; justify-content: center">
<div style="position: absolute; inset: 0; background: rgba(2,6,16,0.62); backdrop-filter: blur(8px)"></div>
<div role="dialog" aria-labelledby="sd-title" style="position: relative; width: 520px; box-sizing: border-box; padding: 32px; border-radius: 20px; background: #0C1E46; border: 1px solid rgba(127,178,255,0.18); box-shadow: 0 30px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 18px">
<div style="position: relative; width: 64px; height: 64px; flex: none">
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="rgba(127,178,255,0.15)" stroke-width="5"></circle><circle cx="32" cy="32" r="28" fill="none" stroke="#1F6BFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 32 32)"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500">{{secs}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="sd-title" style="margin: 0; font-size: 22px; font-weight: 700">Shut down now?</h2>
<span style="font-size: 14px; color: #8FA3C8">Shutting down automatically in {{secs}} seconds.</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #FFB98A">2 apps have unsaved work</span>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,159,90,0.08); border: 1px solid rgba(255,159,90,0.25)">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #1F6BFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #FFFFFF">D</span>
<span style="flex: 1; font-size: 14px">Docs · Q4 plan draft</span>
<button style="all: unset; font-size: 13px; color: #7FB2FF; cursor: pointer">Save</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,159,90,0.08); border: 1px solid rgba(255,159,90,0.25)">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #2E9E6A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #FFFFFF">S</span>
<span style="flex: 1; font-size: 14px">Sheets · Budget 2027</span>
<button style="all: unset; font-size: 13px; color: #7FB2FF; cursor: pointer">Save</button>
</div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #C9D6EE"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #1F6BFF">Install 3 pending updates before shutting down</label>
<div style="display: flex; gap: 12px; justify-content: flex-end">
<button style="all: unset; padding: 12px 22px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Cancel</button>
<button style="all: unset; padding: 12px 22px; border-radius: 10px; font-size: 15px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Restart</button>
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #D9452B; box-shadow: 0 8px 24px rgba(217,69,43,0.35); cursor: pointer">Shut down</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seconds":{"editor":"range","default":42,"min":0,"max":60,"step":1},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.seconds ?? 42;
    const c = 2 * Math.PI * 28;
    return { secs: s, dash: (c * s / 60).toFixed(1) + ' ' + c.toFixed(1) };
  }
}
</script>
</body>
</html>
