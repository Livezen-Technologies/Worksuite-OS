<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote wipe confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<header style="height: 56px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(127,178,255,0.12); background: #071330">
<svg width="22" height="22" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#071330"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
<span style="font-size: 15px; font-weight: 600">WorkSuite Admin</span><span style="color: #5E739C">/</span><span style="font-size: 14px; color: #C9D6EE">Devices</span><span style="color: #5E739C">/</span><span style="font-size: 14px">alex-laptop</span>
</header>
<div style="padding: 28px; display: flex; flex-direction: column; gap: 10px; opacity: 0.35">
<div style="height: 22px; width: 240px; border-radius: 5px; background: rgba(255,255,255,0.2)"></div>
<div style="height: 120px; border-radius: 14px; background: rgba(14,32,72,0.7)"></div>
<div style="height: 260px; border-radius: 14px; background: rgba(14,32,72,0.7)"></div>
</div>
<div style="position: absolute; inset: 56px 0 0 0; background: rgba(2,6,16,0.55); display: flex; align-items: center; justify-content: center">
<div role="alertdialog" aria-labelledby="wp-t" style="width: 520px; box-sizing: border-box; border-radius: 20px; background: #0F2350; border: 1px solid rgba(255,138,122,0.5); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden">
<div style="padding: 24px 24px 14px; display: flex; gap: 16px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(217,69,43,0.18); display: flex; align-items: center; justify-content: center; flex: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF8A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 6px"><h2 id="wp-t" style="margin: 0; font-size: 20px; font-weight: 700">Erase alex-laptop?</h2><p style="margin: 0; font-size: 14px; color: #C9D6EE; line-height: 1.5">All data, accounts and apps are erased the next time it connects. This can't be undone. Assigned to Alex Perera · last seen 2 h ago.</p></div>
</div>
<div style="padding: 6px 24px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="w1" style="font-size: 12px; color: #C9D6EE">1 · Re-enter your admin password</label>
<input id="w1" type="password" onInput="{{setPw}}" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{pwBorder}}; background: rgba(4,10,26,0.6); color: #FFFFFF; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="w2" style="font-size: 12px; color: #C9D6EE">2 · Type the device name <strong style="font-family: 'IBM Plex Mono', monospace; color: #FFFFFF">alex-laptop</strong> to confirm</label>
<input id="w2" onInput="{{setName}}" autocomplete="off" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{nameBorder}}; background: rgba(4,10,26,0.6); color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 14px">
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #C9D6EE"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #D9452B">Also revoke Alex's sign-in on all devices</label>
</div>
<div style="padding: 14px 18px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; color: #8FA3C8">Logged to the audit trail</span>
<div style="display: flex; gap: 10px">
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Cancel</button>
<button disabled="{{blocked}}" style="all: unset; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; color: {{ctaColor}}; background: {{ctaBg}}; cursor: pointer">Erase device</button>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pw: '', name: '' }; }
  renderVals() {
    const { pw, name } = this.state;
    const nameOk = name === 'alex-laptop', pwOk = pw.length >= 8;
    const ok = nameOk && pwOk;
    return { setPw: e => this.setState({ pw: e.target.value }), setName: e => this.setState({ name: e.target.value }),
      pwBorder: pwOk ? '#5FD39A' : 'rgba(255,255,255,0.2)',
      nameBorder: nameOk ? '#5FD39A' : name ? '#FF8A7A' : 'rgba(255,255,255,0.2)',
      blocked: !ok, ctaBg: ok ? '#D9452B' : 'rgba(217,69,43,0.3)', ctaColor: ok ? '#FFFFFF' : 'rgba(255,255,255,0.5)' };
  }
}
</script>
</body>
</html>
