<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shell restarted</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA">
<dc-import name="G01Desktop" hint-size="1280px,800px"></dc-import>
<div role="status" style="position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: 560px; box-sizing: border-box; padding: 16px 18px; border-radius: 16px; background: rgba(10,24,56,0.97); border: 1px solid rgba(95,211,154,0.4); box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; gap: 14px; align-items: center">
<span style="width: 42px; height: 42px; border-radius: 12px; background: rgba(95,211,154,0.14); display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5FD39A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600">The desktop restarted after a problem</span><span style="font-size: 13px; color: #C9D6EE">Your 4 open apps kept running and nothing was lost.</span></span>
<button style="all: unset; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(127,178,255,0.25); font-size: 12px; cursor: pointer">Send report</button>
<button aria-label="Dismiss" style="all: unset; color: #8FA3C8; font-size: 18px; cursor: pointer; padding: 0 4px">×</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
