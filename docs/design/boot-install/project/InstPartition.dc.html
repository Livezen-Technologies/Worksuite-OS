<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Installation type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<nav style="width: 260px; box-sizing: border-box; padding: 36px 22px; background: #071330; border-right: 1px solid rgba(127,178,255,0.12); display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="28" height="28" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#071330"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
<span style="font-size: 16px; font-weight: 600; line-height: 1.25">WorkSuite OS Setup</span>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: {{s.bg}}">
<span style="width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; background: {{s.dot}}; color: {{s.dotText}}; flex: none">{{s.mark}}</span>
<span style="font-size: 14px; color: {{s.color}}; font-weight: {{s.weight}}">{{s.label}}</span>
</li>
</sc-for>
</ol>
<div style="margin-top: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E739C">1.0 · amd64 · EFI</div>
</nav>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 36px 56px 0; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 2 OF 6</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Installation type</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 380px">
<label for="dev" style="font-size: 13px; font-weight: 500; color: #C9D6EE">Storage device</label>
<div style="display: flex; gap: 8px">
<select id="dev" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit; font-size: 14px"><option>vda · 40.00 GiB (/dev/vda)</option></select>
<button aria-label="Rescan devices" style="all: unset; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v4h-4"></path></svg></button>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid #FF9F5A; background: rgba(255,159,90,0.08); cursor: pointer">
<input type="radio" name="mode" checked style="margin: 2px 0 0; width: 18px; height: 18px; accent-color: #1F6BFF; flex: none">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">Erase disk
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path></svg></span>
<span style="font-size: 13px; color: #C9D6EE; line-height: 1.45">Deletes <strong style="color: #FFB98A">all data</strong> on the selected device and installs WorkSuite OS.</span>
</span>
</label>
<label style="display: flex; gap: 14px; padding: 16px 18px; border-radius: 12px; border: 1px solid rgba(127,178,255,0.16); background: rgba(14,32,72,0.6); cursor: pointer">
<input type="radio" name="mode" style="margin: 2px 0 0; width: 18px; height: 18px; accent-color: #1F6BFF; flex: none">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">Manual partitioning</span>
<span style="font-size: 13px; color: #8FA3C8; line-height: 1.45">Create or resize partitions yourself. For advanced users.</span>
</span>
</label>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="swap" style="font-size: 13px; font-weight: 500; color: #C9D6EE">Swap</label>
<select id="swap" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit; font-size: 14px"><option>Swap to file</option><option>No swap</option><option>Swap partition (with hibernate)</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: #C9D6EE">File system</span>
<div style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px dashed rgba(127,178,255,0.2); display: flex; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #C9D6EE">ext4</div>
</div>
</div>

<div style="padding: 16px 18px; border-radius: 12px; border: 1px solid {{encBorder}}; background: rgba(14,32,72,0.6); display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="checkbox" checked="{{enc}}" onChange="{{toggleEnc}}" style="width: 18px; height: 18px; accent-color: #1F6BFF">
<span style="font-size: 15px; font-weight: 600">Encrypt system</span>
<span style="font-size: 13px; color: #8FA3C8">Asks for this passphrase every time the computer starts</span>
</label>
<sc-if value="{{enc}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<input type="password" aria-label="Passphrase" placeholder="Passphrase" onInput="{{setA}}" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit">
<input type="password" aria-label="Confirm passphrase" placeholder="Confirm passphrase" onInput="{{setB}}" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{confirmBorder}}; background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit">
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{msgColor}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{msgColor}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{msgIcon}}"></path></svg>
<span>{{msg}}</span>
</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 8px 14px; align-items: center">
<span style="font-size: 13px; color: #8FA3C8">Before</span>
<div style="height: 18px; border-radius: 6px; background: repeating-linear-gradient(45deg, rgba(127,178,255,0.12) 0 8px, rgba(127,178,255,0.06) 8px 16px)"></div>
<span></span>
<span style="font-size: 12px; color: #8FA3C8">Unpartitioned space · 40.00 GiB</span>
<span style="font-size: 13px; font-weight: 600">After</span>
<div style="height: 18px; border-radius: 6px; overflow: hidden; display: flex; gap: 2px">
<div style="width: 1.3%; min-width: 8px; background: #FF9F5A"></div>
<div style="flex: 1; background: linear-gradient(90deg, #1F6BFF, #18D4F0)"></div>
</div>
<span></span>
<div style="display: flex; gap: 24px; font-size: 12px; color: #C9D6EE">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FF9F5A"></span>EFI system · 512 MiB · FAT32</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #18D4F0"></span>WorkSuite · 39.50 GiB · {{fsLabel}}</span>
</div>
</div>
</div>
</div>
<footer style="height: 80px; box-sizing: border-box; padding: 0 56px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button style="all: unset; padding: 12px 16px; border-radius: 10px; font-size: 15px; color: #8FA3C8; cursor: pointer">Quit installer</button>
<div style="display: flex; gap: 12px">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; color: #E8EEFA; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<button disabled="{{blocked}}" style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: {{ctaColor}}; background: {{ctaBg}}; cursor: pointer">Continue</button>
</div>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { enc: true, a: '', b: '' }; }
  renderVals() {
    const cur = 1;
    const names = ['Language', 'Installation type', 'Your account', 'Time zone', 'Review', 'Install'];
    const steps = names.map((label, i) => ({
      label, mark: i < cur ? '✓' : String(i + 1),
      bg: i === cur ? 'rgba(31,107,255,0.18)' : 'transparent',
      dot: i < cur ? '#5FD39A' : i === cur ? '#1F6BFF' : 'rgba(127,178,255,0.12)',
      dotText: i <= cur ? '#FFFFFF' : '#8FA3C8',
      color: i <= cur ? '#E8EEFA' : '#8FA3C8', weight: i === cur ? 600 : 400
    }));
    const { enc, a, b } = this.state;
    let state = 'empty';
    if (a || b) state = !b ? 'short' : a !== b ? 'bad' : a.length < 8 ? 'short' : 'ok';
    const M = {
      empty: ['Enter a passphrase of at least 8 characters', '#8FA3C8', 'M12 8v5M12 16h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'],
      short: ['Use at least 8 characters, then confirm it', '#8FA3C8', 'M12 8v5M12 16h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'],
      bad: ['Passphrases do not match', '#FF8A7A', 'M6 6l12 12M18 6L6 18'],
      ok: ['Passphrases match', '#5FD39A', 'M5 12.5l4.5 4.5L19 7.5']
    }[state];
    const blocked = enc && state !== 'ok';
    return { steps, enc,
      encBorder: enc ? 'rgba(31,107,255,0.6)' : 'rgba(127,178,255,0.16)',
      fsLabel: enc ? 'ext4 in LUKS2' : 'ext4',
      msg: M[0], msgColor: M[1], msgIcon: M[2],
      confirmBorder: state === 'bad' ? '#FF8A7A' : state === 'ok' ? '#5FD39A' : 'rgba(127,178,255,0.25)',
      blocked, ctaBg: blocked ? 'rgba(31,107,255,0.3)' : '#1F6BFF', ctaColor: blocked ? 'rgba(255,255,255,0.5)' : '#FFFFFF',
      setA: (e) => this.setState({ a: e.target.value }),
      setB: (e) => this.setState({ b: e.target.value }),
      toggleEnc: () => this.setState({ enc: !enc }) };
  }
}
</script>
</body>
</html>
