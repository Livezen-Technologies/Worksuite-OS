<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login – password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
@keyframes ws-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.ws-shake{animation:ws-shake 0.4s ease}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #FFFFFF; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.22) 0%, transparent 38%), radial-gradient(circle at 18% 80%, rgba(31,107,255,0.35) 0%, transparent 45%), linear-gradient(160deg, #0B2254 0%, #061029 60%, #030816 100%)">
<div style="position: absolute; top: 28px; left: 40px; right: 40px; display: flex; justify-content: space-between; font-size: 14px; color: rgba(255,255,255,0.85)">
<span>Thu 15 Oct · 18:07</span>
<span>English (US)</span>
</div>
<div style="position: absolute; top: 200px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="width: 128px; height: 128px; border-radius: 50%; background: linear-gradient(135deg, #1F6BFF, #18D4F0); display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 600; box-shadow: 0 0 0 4px rgba(255,255,255,0.14), 0 20px 50px rgba(0,0,0,0.45)">YN</div>
<div style="margin-top: 6px; font-size: 26px; font-weight: 600">[Your Name]</div>
<form class="{{shakeClass}}" onSubmit="{{submit}}" style="margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="display: flex; align-items: center; width: 340px; height: 48px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 12px; background: rgba(8,20,48,0.6); border: 1px solid {{fieldBorder}}; backdrop-filter: blur(16px)">
<label for="pw" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</label>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #FFFFFF; font: inherit; font-size: 15px">
<button type="submit" aria-label="Sign in" style="all: unset; width: 36px; height: 36px; border-radius: 9px; background: #1F6BFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</button>
</div>
<sc-if value="{{wrong}}" hint-placeholder-val="{{false}}">
<span style="font-size: 13px; color: #FFB4A8">Incorrect password. Try again.</span>
</sc-if>
<sc-if value="{{notWrong}}" hint-placeholder-val="{{true}}">
<span style="font-size: 13px; color: rgba(255,255,255,0.6)">Press Enter to sign in</span>
</sc-if>
</form>
<button style="all: unset; font-size: 13px; color: #7FB2FF; cursor: pointer; padding: 6px">Forgot password?</button>
</div>
<div style="position: absolute; bottom: 32px; left: 40px; display: flex; gap: 10px">
<a href="LoginUsers.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 12px; background: rgba(8,20,48,0.5); border: 1px solid rgba(255,255,255,0.1); color: #FFFFFF; text-decoration: none; font-size: 14px">
<span style="width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 15c2 .6 3 2.2 3.5 5"></path></svg></span>Other user</a>
</div>
<div style="position: absolute; bottom: 32px; right: 40px; display: flex; gap: 10px">
<button aria-label="Network" style="all: unset; width: 44px; height: 44px; border-radius: 12px; background: rgba(8,20,48,0.5); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path></svg></button>
<button aria-label="Accessibility" style="all: unset; width: 44px; height: 44px; border-radius: 12px; background: rgba(8,20,48,0.5); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.5"></circle><path d="M5 8l7 1.5L19 8"></path><path d="M12 9.5v5l-3 6"></path><path d="M12 14.5l3 6"></path></svg></button>
<button aria-label="Power options" style="all: unset; width: 44px; height: 44px; border-radius: 12px; background: rgba(8,20,48,0.5); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.3 7.3a8 8 0 1 0 11.4 0"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { wrong: false, n: 0 }; }
  renderVals() {
    const w = this.state.wrong;
    return {
      wrong: w, notWrong: !w,
      shakeClass: w ? (this.state.n % 2 ? 'ws-shake' : 'ws-shake ws-b') : '',
      fieldBorder: w ? '#FF8A7A' : 'rgba(255,255,255,0.18)',
      submit: (e) => { e.preventDefault(); this.setState({ wrong: true, n: this.state.n + 1 }); }
    };
  }
}
</script>
</body>
</html>
