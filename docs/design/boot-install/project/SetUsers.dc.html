<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="SetNav" active="Users" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; padding: 26px 36px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="display: flex; align-items: center; justify-content: space-between"><h1 style="margin: 0; font-size: 28px; font-weight: 700">Users</h1><button style="all: unset; padding: 10px 18px; border-radius: 10px; background: #1F6BFF; font-size: 14px; font-weight: 600; cursor: pointer">+ Add user</button></div>

<div style="display: flex; align-items: center; gap: 22px; padding: 22px 24px; border-radius: 18px; background: radial-gradient(circle at 90% 10%, rgba(24,212,240,0.25), transparent 45%), rgba(14,32,72,0.75); border: 1px solid rgba(127,178,255,0.18)">
<div style="position: relative">
<span style="width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #1F6BFF, #18D4F0); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 600">AP</span>
<button aria-label="Change picture" style="all: unset; position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; background: #0F2350; border: 2px solid #0A1A3D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>
<span style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 22px; font-weight: 700">Alex Perera</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">alex · alex@[company].com</span>
<span style="display: flex; gap: 6px; margin-top: 2px">
<span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(31,107,255,0.22); color: #B8D4FF">Administrator</span>
<span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(122,79,224,0.22); color: #B9A0FF">Directory account</span>
<span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(95,211,154,0.18); color: #5FD39A">Signed in</span>
</span>
</span>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Sign-in</span>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{signin}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: {{r.border}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 500">{{r.t}}</span><span style="font-size: 11px; color: #8FA3C8">{{r.d}}</span></span>
<span style="font-size: 12px; color: #7FB2FF">{{r.a}}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Other people on this device</span>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{others}}" as="o" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: {{o.border}}">
<span style="width: 38px; height: 38px; border-radius: 50%; background: {{o.c}}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex: none">{{o.i}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 500">{{o.n}}</span><span style="font-size: 11px; color: #8FA3C8">{{o.d}}</span></span>
<span style="font-size: 11px; padding: 2px 7px; border-radius: 5px; background: rgba(127,178,255,0.12); color: #C9D6EE">{{o.role}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 500">Guest sessions</span><span style="font-size: 11px; color: #8FA3C8">Files erased on sign-out</span></span>
<span aria-hidden="true" style="width: 40px; height: 24px; border-radius: 12px; background: #1F6BFF; position: relative"><span style="position: absolute; top: 3px; left: 19px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const S = [['Password','Changed 21 days ago · synced with directory','M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z','Change'],['Fingerprint','2 fingers enrolled','M12 11v4M8 12a4 4 0 0 1 8 0v3M5 12a7 7 0 0 1 14 0','Manage'],['Security key','YubiKey 5C · added 2 Oct','M15 7a4 4 0 1 1-3.5 6H9v3H6v3H3v-4l7.5-7.5A4 4 0 0 1 15 7z','Manage'],['Automatic sign-in','Off · required by [Company]','M13 3h6v18h-6M10 8l4 4-4 4M14 12H3','']];
    const O = [['[User 2]','U2','linear-gradient(135deg,#7A4FE0,#E0559B)','Last signed in yesterday','Standard'],['IT Support','IT','#5E739C','Break-glass local admin · locked','Admin'],['Guest','G','rgba(255,255,255,0.18)','Never used','Guest']];
    return { signin: S.map((s, i) => ({ t: s[0], d: s[1], icon: s[2], a: s[3], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' })),
      others: O.map((o, i) => ({ n: o[0], i: o[1], c: o[2], d: o[3], role: o[4], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' })) };
  }
}
</script>
</body>
</html>
