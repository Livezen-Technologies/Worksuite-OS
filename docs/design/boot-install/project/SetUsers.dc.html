<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="SetNav" active="Users" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; padding: 32px 44px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Users</h1>
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #1F6BFF; cursor: pointer">Add user</button>
</div>
<div style="display: flex; align-items: center; gap: 20px; padding: 22px; border-radius: 16px; background: rgba(14,32,72,0.7); border: 1px solid rgba(127,178,255,0.14)">
<span style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #1F6BFF, #18D4F0); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600">AP</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 20px; font-weight: 700">Alex Perera</span><span style="font-size: 13px; color: #8FA3C8">alex · Administrator · you</span></span>
<button style="all: unset; padding: 9px 16px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.25); font-size: 13px; cursor: pointer">Change password</button>
</div>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-top: {{r.border}}">
<span style="flex: 1; font-size: 14px">{{r.k}}</span><span style="font-size: 13px; color: #C9D6EE">{{r.v}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: #8FA3C8; text-transform: uppercase; letter-spacing: 0.08em">Other users</span>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{others}}" as="o" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-top: {{o.border}}">
<span style="width: 38px; height: 38px; border-radius: 50%; background: {{o.c}}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">{{o.i}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 500">{{o.n}}</span><span style="font-size: 12px; color: #8FA3C8">{{o.d}}</span></span>
<button style="all: unset; font-size: 13px; color: #7FB2FF; cursor: pointer">Manage</button>
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [['Sign-in method','Password + fingerprint'],['Sign in automatically','Off'],['Lock after','5 minutes idle'],['WorkSuite account','alex@[company].com']].map((r, i) => ({ k: r[0], v: r[1], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' })),
      others: [['[User 2]','U2','linear-gradient(135deg,#7A4FE0,#E0559B)','Standard user · last sign-in yesterday'],['Guest','G','rgba(255,255,255,0.18)','Guest session · files erased on sign-out']].map((o, i) => ({ n: o[0], i: o[1], c: o[2], d: o[3], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' }))
    };
  }
}
</script>
</body>
</html>
