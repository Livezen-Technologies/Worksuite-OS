<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files – list and preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="FMSide" active="Documents" hint-size="220px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 60px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(127,178,255,0.12); background: #0C1E46">
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #8FA3C8"><span>alex</span><span>›</span><span style="color: #FFFFFF; font-weight: 600">Documents</span></div>
<div style="margin-left: auto; display: flex; border-radius: 8px; border: 1px solid rgba(127,178,255,0.18); overflow: hidden">
<span aria-label="Grid view" style="width: 34px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2.2" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></span>
<span aria-label="List view" style="width: 34px; height: 32px; background: rgba(31,107,255,0.25); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></span>
</div>
</header>
<div style="flex: 1; min-height: 0; display: flex">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 110px 90px 120px; gap: 12px; padding: 10px 24px; font-size: 12px; color: #8FA3C8; border-bottom: 1px solid rgba(127,178,255,0.1)"><span>Name ↑</span><span>Modified</span><span>Size</span><span>Kind</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<button onClick="{{r.pick}}" style="all: unset; display: grid; grid-template-columns: minmax(0, 1fr) 110px 90px 120px; gap: 12px; align-items: center; padding: 9px 24px; font-size: 13px; background: {{r.bg}}; cursor: pointer">
<span style="display: flex; align-items: center; gap: 10px; min-width: 0"><span style="width: 26px; height: 26px; border-radius: 6px; background: {{r.c}}; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 700; flex: none">{{r.ext}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: {{r.weight}}">{{r.n}}</span>
<sc-if value="{{r.star}}" hint-placeholder-val="{{false}}"><span style="color: #FFB98A">★</span></sc-if></span>
<span style="color: #C9D6EE">{{r.d}}</span><span style="color: #C9D6EE; font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{r.s}}</span><span style="color: #8FA3C8">{{r.k}}</span>
</button>
</sc-for>
</div>
<aside aria-label="Preview" style="width: 300px; box-sizing: border-box; padding: 20px; border-left: 1px solid rgba(127,178,255,0.12); background: #0C1E46; display: flex; flex-direction: column; gap: 14px">
<div style="height: 170px; border-radius: 12px; background: {{sel.thumb}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; padding: 6px 10px; border-radius: 6px; background: {{sel.c}}">{{sel.ext}}</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 600">{{sel.n}}</span><span style="font-size: 12px; color: #8FA3C8">{{sel.k}} · {{sel.s}}</span></div>
<div style="display: flex; gap: 8px">
<button style="all: unset; flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; background: #1F6BFF; font-size: 13px; font-weight: 600; cursor: pointer">Open</button>
<button style="all: unset; flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; border: 1px solid rgba(127,178,255,0.25); font-size: 13px; cursor: pointer">Share</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between"><span style="color: #8FA3C8">{{m.k}}</span><span>{{m.v}}</span></div></sc-for>
</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 3 }; }
  renderVals() {
    const C = { DIR: '#1F6BFF', DOCX: '#1F6BFF', XLSX: '#2E9E6A', PDF: '#D9452B', PNG: '#7A4FE0', PPTX: '#D9572B', MD: '#5E739C' };
    const K = { DIR: 'Folder', DOCX: 'Document', XLSX: 'Spreadsheet', PDF: 'PDF document', PNG: 'Image', PPTX: 'Presentation', MD: 'Markdown' };
    const F = [['Archive','DIR','2 Oct','230 items'],['Contracts','DIR','12 Oct','7 items'],['Projects','DIR','Today','12 items'],['Budget 2027','XLSX','Today','2.4 MB',true],['Brand guide','PDF','1 Oct','8.1 MB'],['Logo export','PNG','11 Oct','640 KB'],['Meeting notes','MD','10 Oct','6 KB'],['Proposal v3','DOCX','9 Oct','312 KB',true],['Q4 plan draft','DOCX','Today','184 KB'],['Roadmap','PPTX','28 Sep','5.6 MB'],['Signed NDA','PDF','12 Oct','220 KB'],['Team offsite','PPTX','Yesterday','12 MB']];
    const s = this.state.sel;
    const rows = F.map((f, i) => ({ n: f[0], ext: f[1] === 'DIR' ? '▣' : f[1], d: f[2], s: f[3], k: K[f[1]], c: C[f[1]], star: !!f[4], weight: f[1] === 'DIR' ? 600 : 400,
      bg: i === s ? 'rgba(31,107,255,0.22)' : i % 2 ? 'rgba(255,255,255,0.015)' : 'transparent', pick: () => this.setState({ sel: i }) }));
    const f = F[s];
    return { rows, sel: { n: f[0], ext: f[1] === 'DIR' ? 'FOLDER' : f[1], k: K[f[1]], s: f[3], c: C[f[1]], thumb: f[1] === 'PNG' ? 'linear-gradient(135deg,#1F4FB0,#18D4F0)' : 'rgba(4,10,26,0.5)' },
      meta: [['Modified', f[2]], ['Location', '~/Documents'], ['Owner', 'alex'], ['Synced', 'WorkSuite Drive']].map(m => ({ k: m[0], v: m[1] })) };
  }
}
</script>
</body>
</html>
