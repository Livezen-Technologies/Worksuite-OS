<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Install local package</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.3) 0%, transparent 38%), linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%)">
<div role="dialog" aria-labelledby="pk-t" style="width: 600px; box-sizing: border-box; border-radius: 20px; background: #0F2350; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden">
<div style="padding: 24px; display: flex; gap: 18px; align-items: center; border-bottom: 1px solid rgba(127,178,255,0.12)">
<span style="width: 60px; height: 60px; border-radius: 14px; background: {{c}}; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">{{i}}</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><h2 id="pk-t" style="margin: 0; font-size: 20px; font-weight: 700">Install {{name}}?</h2><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8">{{file}}</span></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: rgba(127,178,255,0.14)">{{fmt}}</span>
</div>
<div style="padding: 18px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,159,90,0.08); border: 1px solid rgba(255,159,90,0.35); font-size: 13px; color: #E8EEFA; line-height: 1.45">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB98A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"></path></svg>
<span>{{warn}}</span>
</div>
<div style="border-radius: 12px; background: rgba(4,10,26,0.45); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; padding: 9px 14px; border-top: {{r.border}}; font-size: 13px"><span style="color: #8FA3C8">{{r.k}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{r.c}}">{{r.v}}</span></div>
</sc-for>
</div>
<sc-if value="{{isImage}}" hint-placeholder-val="{{false}}">
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #C9D6EE"><input type="checkbox" checked style="width: 16px; height: 16px; accent-color: #1F6BFF">Add to Start menu and keep it updated with AppImageUpdate</label>
</sc-if>
</div>
<div style="padding: 14px 20px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; color: #8FA3C8">{{needs}}</span>
<div style="display: flex; gap: 10px">
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Cancel</button>
<button style="all: unset; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #1F6BFF; cursor: pointer">{{cta}}</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"format":{"editor":"enum","options":[".deb","AppImage"],"default":".deb"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const img = (this.props.format ?? '.deb') === 'AppImage';
    const mk = (R) => R.map((r, i) => ({ k: r[0], v: r[1], c: r[2] || '#E8EEFA', border: i ? '1px solid rgba(127,178,255,0.08)' : 'none' }));
    if (img) return { isImage: true, name: 'Obsidian', i: 'O', c: '#5E3FB0', fmt: 'AppImage', file: '~/Downloads/Obsidian-1.6.7.AppImage',
      warn: 'This app isn’t from App Center. It will run in a sandbox with access to your Documents only, until you allow more.',
      rows: mk([['Publisher','Dynalist Inc. (signature valid)','#5FD39A'],['Version','1.6.7'],['Size','112 MB'],['Installs to','~/Applications · just for you'],['Sandbox','firejail profile: default']]),
      needs: 'No admin password needed', cta: 'Install for me' };
    return { isImage: false, name: 'Zoom', i: 'Z', c: '#0E8FA8', fmt: '.deb', file: '~/Downloads/zoom_amd64.deb',
      warn: 'This package is from outside the WorkSuite repositories. It can change system files. Install only if you trust the source.',
      rows: mk([['Publisher','Zoom Video Communications'],['Version','6.2.3.2056'],['Size','204 MB installed'],['Also installs','4 packages from WorkSuite repos'],['Policy','Allowed by [Company] IT','#5FD39A']]),
      needs: 'Requires administrator password', cta: 'Install' };
  }
}
</script>
</body>
</html>
