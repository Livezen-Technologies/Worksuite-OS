<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What's new</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.3) 0%, transparent 38%), radial-gradient(circle at 18% 80%, rgba(31,107,255,0.45) 0%, transparent 45%), linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%)">
<div style="position: absolute; inset: 0; background: rgba(2,6,16,0.45)"></div>
<div role="dialog" aria-labelledby="wn-t" style="position: relative; width: 640px; box-sizing: border-box; border-radius: 20px; background: #0F2350; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden">
<div style="height: 150px; background: radial-gradient(circle at 70% 30%, rgba(24,212,240,0.5), transparent 50%), linear-gradient(135deg, #1F6BFF, #0D2353); display: flex; align-items: flex-end; padding: 22px 28px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #D6F7FF; letter-spacing: 0.08em">UPDATED TO 1.1</span>
<h2 id="wn-t" style="margin: 0; font-size: 28px; font-weight: 700; color: #FFFFFF">What's new in WorkSuite OS</h2>
</div>
</div>
<div style="padding: 22px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="4">
<div style="display: flex; gap: 12px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(31,107,255,0.18); display: flex; align-items: center; justify-content: center; flex: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FB2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 14px; font-weight: 600">{{i.title}}</span><span style="font-size: 13px; color: #8FA3C8; line-height: 1.4">{{i.text}}</span></span>
</div>
</sc-for>
</div>
<div style="padding: 14px 20px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: space-between; align-items: center">
<a href="#" style="font-size: 13px">Full release notes</a>
<button style="all: unset; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; cursor: pointer">Got it</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const I = [['Safer by default','14 security fixes are now active.','M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'],['Grouped notifications','Messages stack by app in the notification center.','M4 6h16M4 12h16M4 18h10'],['Media on lock screen','Play, pause and skip without unlocking.','M8 5v14l11-7z'],['Faster wake','Up to 20% quicker from sleep.','M13 2L4 14h7l-1 8 9-12h-7z']];
    return { items: I.map(i => ({ title: i[0], text: i[1], icon: i[2] })) };
  }
}
</script>
</body>
</html>
