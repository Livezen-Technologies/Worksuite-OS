<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Files – grid view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="FMSide" active="Documents" hint-size="220px,800px"></dc-import>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 60px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(127,178,255,0.12); background: #0C1E46">
<button aria-label="Back" style="all: unset; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-label="Forward" style="all: unset; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; opacity: 0.4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #8FA3C8"><span>alex</span><span>›</span><span style="color: #FFFFFF; font-weight: 600">Documents</span></div>
<div style="margin-left: auto; display: flex; align-items: center; gap: 8px; width: 240px; height: 34px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; background: rgba(4,10,26,0.5); border: 1px solid rgba(127,178,255,0.14); font-size: 13px; color: #8FA3C8"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search Documents</div>
<div style="display: flex; border-radius: 8px; border: 1px solid rgba(127,178,255,0.18); overflow: hidden">
<span aria-label="Grid view" style="width: 34px; height: 32px; background: rgba(31,107,255,0.25); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></span>
<span aria-label="List view" style="width: 34px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FA3C8" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></span>
</div>
<button style="all: unset; height: 34px; padding: 0 14px; border-radius: 8px; background: #1F6BFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">+ New</button>
</header>
<div style="flex: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #102A5E 0%, #0A1A3D 60%)">
<span style="font-size: 12px; color: #8FA3C8">Folders</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{f.c}}" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"></path></svg>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.n}}</span><span style="font-size: 11px; color: #8FA3C8">{{f.d}}</span></span>
</div>
</sc-for>
</div>
<span style="font-size: 12px; color: #8FA3C8; margin-top: 6px">Files</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{files}}" as="f" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; background: {{f.bg}}; border: 1px solid {{f.border}}">
<div style="height: 96px; border-radius: 8px; background: {{f.thumb}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 5px; background: {{f.c}}; color: #FFFFFF">{{f.ext}}</span></div>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.n}}</span>
<span style="font-size: 11px; color: #8FA3C8; margin-top: -4px">{{f.d}}</span>
</div>
</sc-for>
</div>
</div>
<footer style="height: 32px; box-sizing: border-box; padding: 0 20px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #8FA3C8"><span>4 folders · 12 files</span><span>1 selected · 2.4 MB</span></footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const folders = [['Projects','12 items','#1F6BFF'],['Invoices','48 items','#2E9E6A'],['Contracts','7 items','#B7791F'],['Archive','230 items','#5E739C']].map(f => ({ n: f[0], d: f[1], c: f[2] }));
    const C = { DOCX: '#1F6BFF', XLSX: '#2E9E6A', PDF: '#D9452B', PNG: '#7A4FE0', PPTX: '#D9572B', MD: '#5E739C' };
    const F = [['Q4 plan draft','DOCX','Today'],['Budget 2027','XLSX','Today'],['Team offsite','PPTX','Yesterday'],['Signed NDA','PDF','12 Oct'],['Logo export','PNG','11 Oct'],['Meeting notes','MD','10 Oct'],['Proposal v3','DOCX','9 Oct'],['Expenses Sep','XLSX','3 Oct'],['Brand guide','PDF','1 Oct'],['Screenshot 1','PNG','30 Sep'],['Roadmap','PPTX','28 Sep'],['README','MD','25 Sep']];
    const files = F.map((f, i) => ({ n: f[0], ext: f[1], d: f[2], c: C[f[1]],
      thumb: f[1] === 'PNG' ? 'linear-gradient(135deg,#1F4FB0,#18D4F0)' : 'rgba(4,10,26,0.5)',
      bg: i === 1 ? 'rgba(31,107,255,0.18)' : 'rgba(14,32,72,0.5)', border: i === 1 ? '#1F6BFF' : 'rgba(127,178,255,0.1)' }));
    return { folders, files };
  }
}
</script>
</body>
</html>
