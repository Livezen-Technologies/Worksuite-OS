<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer – Network</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<nav style="width: 288px; box-sizing: border-box; padding: 40px 28px; background: #071330; border-right: 1px solid rgba(127,178,255,0.12); display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="30" height="30" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="3" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#071330"></rect><rect x="0" y="20" width="20" height="20" rx="3" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="3" fill="#18D4F0"></rect></svg>
<span style="font-size: 17px; font-weight: 600">WorkSuite OS Setup</span>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: {{s.bg}}">
<span style="width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; background: {{s.dot}}; color: {{s.dotText}}">{{s.mark}}</span>
<span style="font-size: 14px; color: {{s.color}}; font-weight: {{s.weight}}">{{s.label}}</span>
</li>
</sc-for>
</ol>
<div style="margin-top: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5E739C">1.0 · amd64</div>
</nav>
<main style="flex: 1; display: flex; flex-direction: column; background: radial-gradient(ellipse 80% 60% at 70% 0%, #12306B 0%, #0A1A3D 60%)">
<div style="flex: 1; padding: 56px 72px 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #18D4F0; letter-spacing: 0.08em">STEP 2 OF 7</div>
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Connect to a network</h1>
<p style="margin: 0; font-size: 15px; color: #8FA3C8">Optional. Connecting lets the installer download updates and drivers.</p>
</div>
<div style="width: 640px; border: 1px solid rgba(127,178,255,0.16); border-radius: 12px; background: rgba(14,32,72,0.6); padding: 6px; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 8px; background: rgba(95,211,154,0.1)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5FD39A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="9" width="16" height="10" rx="2"></rect><path d="M8 9V5h8v4"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Wired connection</span><span style="font-size: 13px; color: #5FD39A">Connected · 1 Gbps</span></span>
</div>
<sc-for list="{{nets}}" as="n" hint-placeholder-count="4">
<button style="all: unset; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 8px; cursor: pointer; background: {{n.bg}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"></path><path d="M5.5 12.5a10 10 0 0 1 13 0"></path><path d="M9 16a5 5 0 0 1 6 0"></path><circle cx="12" cy="19.5" r="1"></circle></svg>
<span style="flex: 1; font-size: 15px">{{n.name}}</span>
<span style="font-size: 13px; color: #8FA3C8">{{n.sec}}</span>
</button>
</sc-for>
</div>
<div style="width: 640px; box-sizing: border-box; padding: 16px; border-radius: 12px; border: 1px solid rgba(31,107,255,0.5); background: rgba(31,107,255,0.08); display: flex; gap: 12px; align-items: flex-end">
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<label for="wifi-pw" style="font-size: 13px; font-weight: 500; color: #C9D6EE">Password for "Office-5G"</label>
<input id="wifi-pw" type="password" value="••••••••" style="box-sizing: border-box; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); color: #E8EEFA; font: inherit">
</div>
<button style="all: unset; height: 44px; padding: 0 20px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; display: flex; align-items: center; cursor: pointer">Connect</button>
</div>
</div>
<footer style="height: 88px; box-sizing: border-box; padding: 0 72px; border-top: 1px solid rgba(127,178,255,0.12); display: flex; align-items: center; justify-content: space-between">
<button style="all: unset; padding: 12px 20px; border-radius: 10px; font-size: 15px; color: #8FA3C8; cursor: pointer">Skip, install offline</button>
<div style="display: flex; gap: 12px">
<button style="all: unset; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 500; color: #E8EEFA; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">Back</button>
<button style="all: unset; padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #1F6BFF; box-shadow: 0 8px 24px rgba(31,107,255,0.35); cursor: pointer">Continue</button>
</div>
</footer>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 1;
    const names = ['Language', 'Network', 'Installation type', 'Your account', 'Time zone', 'Review', 'Install'];
    const steps = names.map((label, i) => ({
      label, mark: i < cur ? '✓' : String(i + 1),
      bg: i === cur ? 'rgba(31,107,255,0.18)' : 'transparent',
      dot: i < cur ? '#5FD39A' : i === cur ? '#1F6BFF' : 'rgba(127,178,255,0.12)',
      dotText: i <= cur ? '#FFFFFF' : '#8FA3C8',
      color: i <= cur ? '#E8EEFA' : '#8FA3C8', weight: i === cur ? 600 : 400
    }));
    const nets = [['Office-5G','WPA3', true],['Office-Guest','Open'],['Home-Fiber','WPA2'],['Printer-Direct','WPA2']]
      .map(n => ({ name: n[0], sec: n[1], bg: n[2] ? 'rgba(31,107,255,0.18)' : 'transparent' }));
    return { steps, nets };
  }
}
</script>
</body>
</html>
