<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutdown menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: radial-gradient(circle at 78% 22%, rgba(24,212,240,0.3) 0%, transparent 38%), radial-gradient(circle at 18% 80%, rgba(31,107,255,0.45) 0%, transparent 45%), linear-gradient(160deg, #0E2A66 0%, #071330 60%, #040A1A 100%)">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; box-sizing: border-box; padding: 0 16px; background: rgba(6,14,34,0.82); border-top: 1px solid rgba(127,178,255,0.12); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 8px">
<button aria-label="Apps" style="all: unset; width: 40px; height: 40px; border-radius: 10px; background: rgba(31,107,255,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 60 60" aria-hidden="true"><rect x="20" y="0" width="40" height="40" rx="4" fill="#1F6BFF"></rect><rect x="20" y="20" width="20" height="20" fill="#0A1A3D"></rect><rect x="0" y="20" width="20" height="20" rx="4" fill="#18D4F0"></rect><rect x="20" y="40" width="20" height="20" rx="4" fill="#18D4F0"></rect></svg></button>
<sc-for list="{{dock}}" as="d" hint-placeholder-count="5">
<span style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 7px; background: {{d}}"></span></span>
</sc-for>
<span style="margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px">
<span>18:11</span>
<button aria-label="Power" style="all: unset; width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.12); box-shadow: 0 0 0 1px rgba(127,178,255,0.4) inset; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"></path><path d="M6.3 7.3a8 8 0 1 0 11.4 0"></path></svg></button>
</span>
</div>
<div role="menu" aria-label="Power options" style="position: absolute; right: 16px; bottom: 68px; width: 320px; box-sizing: border-box; padding: 8px; border-radius: 16px; background: rgba(10,24,56,0.94); border: 1px solid rgba(127,178,255,0.18); box-shadow: 0 24px 60px rgba(0,0,0,0.5); backdrop-filter: blur(24px); display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px 14px">
<span style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #1F6BFF, #18D4F0); display: flex; align-items: center; justify-content: center; font-weight: 600">YN</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">[Your Name]</span><span style="font-size: 12px; color: #8FA3C8">Up for 3 h 42 min</span></span>
</div>
<div style="height: 1px; background: rgba(127,178,255,0.12); margin: 0 8px 4px"></div>
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<sc-if value="{{it.sep}}" hint-placeholder-val="{{false}}"><div style="height: 1px; background: rgba(127,178,255,0.12); margin: 4px 8px"></div></sc-if>
<button role="menuitem" style="all: unset; display: flex; align-items: center; gap: 14px; padding: 11px 12px; border-radius: 10px; background: {{it.bg}}; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
<span style="flex: 1; font-size: 14px; font-weight: 500; color: {{it.color}}">{{it.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8FA3C8">{{it.key}}</span>
</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const I = [
      ['Lock','M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z','Super+L'],
      ['Sign out','M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10',''],
      ['Sleep','M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z','',true],
      ['Restart','M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4',''],
      ['Shut down','M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0','']
    ];
    const items = I.map((it, i) => ({ label: it[0], icon: it[1], key: it[2], sep: !!it[3],
      bg: i === 4 ? 'rgba(31,107,255,0.22)' : 'transparent',
      color: i === 4 ? '#FFFFFF' : '#E8EEFA', stroke: i === 4 ? '#7FB2FF' : '#C9D6EE' }));
    return { items, dock: ['#1F6BFF','#2E9E6A','#D9572B','#7A4FE0','#0E8FA8'] };
  }
}
</script>
</body>
</html>
