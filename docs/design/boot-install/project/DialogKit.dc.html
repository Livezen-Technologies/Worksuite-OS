<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message box variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FB2FF}a:hover{color:#B8D4FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 48px; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #071330; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-content: center">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5E739C; letter-spacing: 0.08em">{{b.kind}}</span>
<div role="alertdialog" style="border-radius: 18px; background: #0F2350; border: 1px solid rgba(127,178,255,0.2); box-shadow: 0 24px 60px rgba(0,0,0,0.5); overflow: hidden">
<div style="padding: 24px 24px 20px; display: flex; gap: 16px">
<span style="width: 44px; height: 44px; border-radius: 12px; background: {{b.tint}}; display: flex; align-items: center; justify-content: center; flex: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{b.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">{{b.title}}</h2>
<p style="margin: 0; font-size: 14px; color: #C9D6EE; line-height: 1.5">{{b.body}}</p>
<sc-if value="{{b.code}}" hint-placeholder-val="{{false}}"><span style="margin-top: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8FA3C8; padding: 6px 10px; border-radius: 6px; background: rgba(4,10,26,0.5)">{{b.code}}</span></sc-if>
</div>
</div>
<div style="padding: 14px 18px; background: rgba(4,10,26,0.35); border-top: 1px solid rgba(127,178,255,0.12); display: flex; justify-content: flex-end; gap: 10px">
<sc-if value="{{b.secondary}}" hint-placeholder-val="{{true}}"><button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500; border: 1px solid rgba(127,178,255,0.25); cursor: pointer">{{b.secondary}}</button></sc-if>
<button style="all: unset; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: {{b.btn}}; cursor: pointer">{{b.primary}}</button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const B = [
      ['QUESTION','Leave the installer?','Your choices so far will be lost. Your disk has not been changed.','#7FB2FF','rgba(31,107,255,0.16)','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01','Stay','Leave','#1F6BFF',''],
      ['ERROR','Installation failed','The installer couldn’t write to the disk. Check the drive and try again.','#FF8A7A','rgba(255,138,122,0.14)','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9 9l6 6M15 9l-6 6','Save log','Try again','#1F6BFF','E: write failed on /dev/vda2 (I/O error)'],
      ['WARNING','Not enough space','WorkSuite OS needs at least 25 GB. The selected disk has 18 GB free.','#FFB98A','rgba(255,159,90,0.14)','M12 3l10 18H2zM12 10v5M12 18h.01','Choose another disk','Continue anyway','#D9452B',''],
      ['INFO','Connect to power','The battery is at 18%. Plug in your charger before installing so the install isn’t interrupted.','#5FD39A','rgba(95,211,154,0.14)','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5h.01','','OK','#1F6BFF','']
    ];
    return { boxes: B.map(b => ({ kind: b[0], title: b[1], body: b[2], color: b[3], tint: b[4], icon: b[5], secondary: b[6], primary: b[7], btn: b[8], code: b[9] })) };
  }
}
</script>
</body>
</html>
