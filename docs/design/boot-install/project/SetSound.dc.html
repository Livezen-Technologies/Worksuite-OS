<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings – Sound</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; font-family: 'IBM Plex Sans', sans-serif; color: #E8EEFA; background: #0A1A3D">
<dc-import name="SetNav" active="Sound" hint-size="260px,800px"></dc-import>
<main style="flex: 1; min-width: 0; padding: 32px 44px; display: flex; flex-direction: column; gap: 20px; background: radial-gradient(ellipse 80% 50% at 80% 0%, #12306B 0%, #0A1A3D 60%)">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Sound</h1>
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12)">
<div style="display: flex; align-items: center; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">{{b.title}}</span><span style="min-width: 260px; box-sizing: border-box; padding: 9px 12px; border-radius: 9px; border: 1px solid rgba(127,178,255,0.25); background: rgba(4,10,26,0.5); font-size: 13px; display: flex; justify-content: space-between">{{b.device}}<span style="color: #8FA3C8">▾</span></span></div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9D6EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
<input type="range" aria-label="{{b.title}} volume" value="{{b.vol}}" style="flex: 1; accent-color: #1F6BFF">
<span style="width: 40px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{b.vol}}%</span>
</div>
<div style="display: flex; gap: 3px; height: 8px; align-items: flex-end" aria-hidden="true">
<sc-for list="{{b.meter}}" as="m" hint-placeholder-count="30"><span style="flex: 1; height: 8px; border-radius: 2px; background: {{m}}"></span></sc-for>
</div>
</div>
</sc-for>
<div style="border-radius: 14px; background: rgba(14,32,72,0.6); border: 1px solid rgba(127,178,255,0.12); overflow: hidden">
<sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: {{a.border}}">
<span style="width: 28px; height: 28px; border-radius: 7px; background: {{a.c}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">{{a.i}}</span>
<span style="width: 140px; font-size: 14px">{{a.n}}</span>
<input type="range" aria-label="{{a.n}} volume" value="{{a.v}}" style="flex: 1; accent-color: #1F6BFF">
</div>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const meter = lv => Array.from({ length: 30 }, (_, i) => i < lv ? (i > 24 ? '#FFB98A' : '#18D4F0') : 'rgba(127,178,255,0.12)');
    return {
      blocks: [
        { title: 'Output', device: 'Sony WH-1000XM5', vol: 64, icon: 'M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7', meter: meter(17) },
        { title: 'Input', device: 'Built-in microphone', vol: 80, icon: 'M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v4', meter: meter(9) }
      ],
      apps: [['Chat','C','#7A4FE0',70],['Browser','B','#0E8FA8',45],['System sounds','S','#5E739C',30]].map((a, i) => ({ n: a[0], i: a[1], c: a[2], v: a[3], border: i ? '1px solid rgba(127,178,255,0.1)' : 'none' }))
    };
  }
}
</script>
</body>
</html>
