set default=0
# WorkSuite: boot the live entry unattended after 5 s; mirror the menu on the serial port (VM tests, headless).
set timeout=5
serial --unit=0 --speed=115200

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_input console serial
terminal_output gfxterm serial

