set color_normal=light-gray/black
set color_highlight=white/blue
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
if [ -e /boot/grub/splash.png ]; then
    # Theme fonts are not loaded automatically on the ISO (grub-mkconfig does that on installed systems).
    loadfont /boot/grub/live-theme/ibmplexsans-16.pf2
    loadfont /boot/grub/live-theme/ibmplexmono-13.pf2
    set theme=/boot/grub/live-theme/theme.txt
fi
