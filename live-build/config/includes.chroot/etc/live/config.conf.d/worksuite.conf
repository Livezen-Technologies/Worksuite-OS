# live-config (0030-user-setup and 0031-worksuite-live-user): the live user's groups. Debian's default list leaves
# out lpadmin, so cupsd answered "Forbidden" to Settings › Printers (lpinfo, lpadmin) on the live system (issue #51).
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev powerdev scanner bluetooth lpadmin"
