#!/usr/sbin/nft -f
# WorkSuite OS default firewall (docs/security/hardening.md): inbound default-deny, outbound allowed.
# Only this table is replaced: no "flush ruleset", so the device agent's managed VPN kill switch
# (table inet worksuite_vpn_killswitch, services/device-agent/src/vpn.ts) survives a reload. A packet must pass
# every table's chain on a hook, so the kill switch's output policy still applies on top of the accept below.

table inet worksuite_filter
delete table inet worksuite_filter
table inet worksuite_filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state { established, related } accept
    iifname "lo" accept
    # ICMP essentials: errors (PMTU discovery), echo, and IPv6 neighbour discovery / router advertisements.
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } limit rate 10/second accept
    ip6 nexthdr icmpv6 icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept
    ip6 nexthdr icmpv6 icmpv6 type { mld-listener-query, mld2-listener-report } ip6 saddr fe80::/10 accept
    # DHCP / DHCPv6 client replies (the first offer can arrive before conntrack has an entry).
    udp sport 67 udp dport 68 accept
    ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
    # mDNS on the local link: printer discovery for CUPS.
    ip daddr 224.0.0.251 udp dport 5353 accept
    ip6 daddr ff02::fb udp dport 5353 accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
