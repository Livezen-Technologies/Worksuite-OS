# WorkSuite Security (#68): freshclam drops to the clamav user and refuses to start when it cannot write its database
# or its log ("Problem with internal logger"), which left "Automatic updates are not running" and no definitions. The
# image build may leave either directory missing or root-owned; they are (re)created for clamav at every boot.
d /var/lib/clamav 0755 clamav clamav -
d /var/log/clamav 0755 clamav adm -
