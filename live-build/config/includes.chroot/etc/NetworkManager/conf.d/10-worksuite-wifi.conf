# Wi-Fi (#31): NetworkManager manages every Wi-Fi and Ethernet device through wpa_supplicant (packaged in the image),
# including ones listed in /etc/network/interfaces (Debian's ifupdown plugin leaves those alone by default), so Settings › Network and the Quick Settings
# can scan, connect and disconnect on any supported adapter.
[ifupdown]
managed=true

[device]
wifi.backend=wpa_supplicant
# A random MAC while scanning makes some drivers (Realtek, older Broadcom/Atheros) drop the link or miss networks (#42).
wifi.scan-rand-mac-address=no

# Stable Wi-Fi (#42): defaults for every Wi-Fi connection that does not set its own.
[connection-wifi-worksuite]
match-device=type:wifi
# Driver power saving is the most common cause of a laptop's Wi-Fi dropping and needing a reconnect (2 = disable).
wifi.powersave=2
# The adapter's own MAC: routers with MAC filters, DHCP reservations and captive portals keep recognising the laptop.
wifi.cloned-mac-address=permanent
# Saved networks join on their own and keep retrying after a failed join (0 = no limit; the default gives up after 4).
connection.autoconnect-retries=0
# A slow DHCP server or WPA handshake is not a failure yet.
ipv4.dhcp-timeout=60
connection.auth-retries=3
