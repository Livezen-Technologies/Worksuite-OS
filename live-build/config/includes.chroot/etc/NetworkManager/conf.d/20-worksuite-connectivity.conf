# WorkSuite OS: NetworkManager connectivity checking (WSOS-INT-001, docs/networking.md).
# NetworkManager fetches this URL every `interval` seconds and expects `response` in the body. A captive portal
# intercepts it, NM reports connectivity "portal", and the WorkSuite shell opens its "Sign in to network" window.
# Debian's check endpoint (same as network-manager-config-connectivity-debian). Organizations can point this at
# their own endpoint with a later conf.d file (e.g. 30-org-connectivity.conf).
[connectivity]
enabled=true
uri=http://network-test.debian.org/nm
response=NetworkManager is online
interval=300
