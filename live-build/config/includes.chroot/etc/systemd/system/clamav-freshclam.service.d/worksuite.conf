# WorkSuite Security (services/device-agent/src/security.ts): signature checks per day come from the device policy
# (av_signature_checks_per_day, written to /etc/worksuite/freshclam.env by the device agent); 12 when unmanaged.
# freshclam retries on its own after a network loss; Restart= brings it back if it dies (#20 §11).
[Service]
Environment=FRESHCLAM_CHECKS=12
EnvironmentFile=-/etc/worksuite/freshclam.env
ExecStart=
ExecStart=/usr/bin/freshclam -d --foreground=true --checks=${FRESHCLAM_CHECKS}
Nice=10
IOSchedulingClass=idle
Restart=on-failure
RestartSec=5min
