# Step "Install WorkSuite apps": the bundled WorkSuite apps (Office, Desktop, FrameFlow, POS) on the installed system.
# They are already in the image with every dependency (live-build/build.sh, hook 0200-worksuite-apps) and unpackfs
# copied them, so this works offline: /usr/libexec/worksuite/worksuite-apps-check makes sure each bundled one is fully
# installed and refreshes the desktop-entry and MIME caches. First-boot configuration (start menu and taskbar pins,
# default apps in worksuite-mimeapps.list, WorkSuite Desktop's welcome after the first-run assistant, the lp/dialout
# groups POS needs in usersq.conf) needs no job here.
---
dontChroot: false
timeout: 120
script:
  - "/usr/libexec/worksuite/worksuite-apps-check"
