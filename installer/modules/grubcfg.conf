# Installed-system kernel command line. grubcfg appends "splash" itself when plymouth is installed in the target
# (it is: worksuite-branding depends on it), and worksuite-branding's /etc/default/grub.d/worksuite.cfg keeps
# "quiet splash" with GRUB_GFXPAYLOAD_LINUX=keep so the WorkSuite Plymouth theme shows (not the text fallback).
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet" ]
