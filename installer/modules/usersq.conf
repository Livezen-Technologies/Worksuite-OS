# WSOS-INS-002, WSOS-AUTH-002: first admin account; autologin off.
---
# QML page from the WorkSuite branding directory (installer/branding/worksuite/usersq.qml).
qmlSearch: both
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: sudo
    must_exist: true
    system: true
  - lpadmin
  - netdev
  - bluetooth
autoLogin: false
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  minLength: 8
  maxLength: -1
allowWeakPasswords: false
user:
  shell: /bin/bash
  forbidden_names: [ root, _greetd ]
