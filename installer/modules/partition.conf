# WSOS-INS-003/004/008: whole-disk erase only, UEFI only, LUKS2 offered; no alongside/manual/dual boot.
---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: false
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
luksGeneration: luks2
showNotEncryptedBootMessage: false
# Keep /home is offered only when selected explicitly (§9.2, P2) via the replace option.

# Full-disk encryption is the default (WSOS-INS-004): the checkbox starts ticked; the user can still untick it.
enableLuksAutomatedPartitioning: true
preCheckEncryption: true

# Encrypted installs: an unencrypted /boot (ext4, 1 GiB) next to the ESP, everything else in LUKS2 (argon2id, the
# recovery key in its own slot). GRUB then never asks for the passphrase on a text console: it reads the kernel from
# /boot, and the initramfs asks once in the splash's own password field. /boot holding only the kernel and initramfs
# unencrypted is what Debian and Ubuntu do; Secure Boot with signed kernels covers its integrity.
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    noEncrypt: true
    mountPoint: "/boot"
    size: 1GiB
  - name: "root"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
