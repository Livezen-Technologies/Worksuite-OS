# Welcome page and install requirements (SRS §2.4 minimums, WSOS-INS-005 offline install).
---
# QML page from the WorkSuite branding directory (installer/branding/worksuite/welcomeq.qml).
qmlSearch: both
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
requirements:
  requiredStorage: 32      # GiB
  requiredRam: 3.5         # GiB; 4 GB machines report a little less than 4 GiB usable
  check: [ storage, ram, power, root, screen ]
  # The install works fully offline from the ISO, so internet is not checked.
  required: [ storage, ram, root ]
