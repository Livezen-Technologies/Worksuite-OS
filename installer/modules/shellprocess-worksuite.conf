# Post-install: clear live-user and enrollment state (WSOS-INS-007).
---
dontChroot: false
timeout: 120
script:
  - "rm -rf /var/lib/worksuite-device-agent/* /etc/worksuite/enrollment*"
  - "rm -f /etc/ssh/ssh_host_*"
  - "rm -f /etc/NetworkManager/system-connections/* /var/lib/NetworkManager/secret_key"
# The first-boot setup assistant (WSOS-INS-009) is the shell's first-run screen (shell/src/App.tsx), shown on the
# first desktop session; no extra unit is needed.
