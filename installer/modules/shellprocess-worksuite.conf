# Post-install: clear live-user and enrollment state (WSOS-INS-007); first boot runs the setup assistant (WSOS-INS-009).
---
dontChroot: false
timeout: 120
script:
  - "rm -rf /var/lib/worksuite-device-agent/* /etc/worksuite/enrollment*"
  - "rm -f /etc/ssh/ssh_host_*"
  - "systemctl enable worksuite-first-boot.service || true"
