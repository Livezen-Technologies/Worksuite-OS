# Post-install: clear live-user and enrollment state (WSOS-INS-007).
---
dontChroot: false
timeout: 120
script:
  - "rm -rf /var/lib/worksuite-device-agent/* /etc/worksuite/enrollment*"
  - "rm -f /etc/ssh/ssh_host_*"
  - "rm -f /etc/NetworkManager/system-connections/* /var/lib/NetworkManager/secret_key"
  # Boot splash: the WorkSuite theme and the framebuffer drivers in the initramfs the initramfs job builds next.
  - "command -v plymouth-set-default-theme >/dev/null && plymouth-set-default-theme worksuite || true"
  - "grep -qsx FRAMEBUFFER=y /etc/initramfs-tools/conf.d/worksuite-splash || echo FRAMEBUFFER=y > /etc/initramfs-tools/conf.d/worksuite-splash"
  # Encrypted installs: GRUB asks for the passphrase (/boot is on the encrypted root); the initramfs then opens the
  # disk with luksbootkeyfile's /crypto_keyfile.bin. cryptsetup-initramfs only packs key files matching
  # KEYFILE_PATTERN, and the initramfs holding the key must not be world-readable.
  - "if [ -f /crypto_keyfile.bin ]; then echo 'KEYFILE_PATTERN=/crypto_keyfile.bin' >> /etc/cryptsetup-initramfs/conf-hook; echo 'UMASK=0077' > /etc/initramfs-tools/conf.d/worksuite-keyfile; fi"
# The first-boot setup assistant (WSOS-INS-009) is the shell's first-run screen (shell/src/App.tsx), shown on the
# first desktop session; no extra unit is needed.
