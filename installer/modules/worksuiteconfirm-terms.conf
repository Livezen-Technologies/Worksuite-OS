# The WorkSuite OS terms, the last page before Install: the text (branding/worksuite/terms/LICENSE-<lang>.txt) and a
# required acceptance box. The worksuiteterms job records the accepted version and time on the target
# (/var/lib/worksuite/terms-accepted, 0644, no personal data).
---
mode: terms
# Unattended / OEM images that have accepted the terms on the owner's behalf: true pre-ticks the box.
accepted: false
