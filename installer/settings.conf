# Calamares settings for WorkSuite OS (SRS §9.4). Installed to /etc/calamares/settings.conf.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: worksuite
    module: shellprocess
    config: shellprocess-worksuite.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - networkcfg
      - hwclock
      - packages
      - shellprocess@worksuite
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: worksuite
prompt-install: true        # explicit confirmation before writing to disk (WSOS-INS-003)
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
