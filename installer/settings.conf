# Calamares settings for WorkSuite OS (SRS §9.4). Installed to /etc/calamares/settings.conf.
---
# "local" = the system module directory (/usr/lib/<multiarch>/calamares/modules), where the WorkSuite modules
# worksuiteconfirm and worksuiterecovery are installed next to the stock ones.
modules-search: [ local ]

instances:
  - id: worksuite
    module: shellprocess
    config: shellprocess-worksuite.conf
  # Typed disk-name confirmation before anything is written (WSOS-INS-003).
  - id: erase
    module: worksuiteconfirm
    config: worksuiteconfirm-erase.conf
  # Recovery key shown once after install (WSOS-INS-004); skips itself on unencrypted installs.
  - id: recovery
    module: worksuiteconfirm
    config: worksuiteconfirm-recovery.conf
  # Install-stage markers read by the slideshow (show.qml); see worksuitephase/main.py.
  - id: prepare
    module: worksuitephase
    config: worksuitephase-prepare.conf
  - id: copy
    module: worksuitephase
    config: worksuitephase-copy.conf
  - id: locale
    module: worksuitephase
    config: worksuitephase-locale.conf
  - id: unlock
    module: worksuitephase
    config: worksuitephase-unlock.conf
  - id: account
    module: worksuitephase
    config: worksuitephase-account.conf
  - id: components
    module: worksuitephase
    config: worksuitephase-components.conf
  - id: boot
    module: worksuitephase
    config: worksuitephase-boot.conf
  - id: cleanup
    module: worksuitephase
    config: worksuitephase-cleanup.conf

sequence:
  - show:
      # Order follows the WorkSuite installer design; calamares-sidebar.qml groups these into its steps.
      - welcomeq       # language, and Express or Custom install
      - keyboardq      # Custom only (Express passes over it)
      - partition
      - usersq
      - localeq        # Custom only
      - summaryq
      - worksuiteconfirm@erase
  - exec:
      - worksuitephase@prepare
      - partition
      - worksuiterecovery
      - mount
      - worksuitephase@copy
      - unpackfs
      - machineid
      - worksuitephase@locale
      - localeq
      - keyboardq
      - localecfg
      - worksuitephase@unlock
      - luksbootkeyfile
      - fstab          # after luksbootkeyfile: crypttab names /crypto_keyfile.bin only if it exists by then
      - worksuitephase@account
      - usersq
      # No networkcfg: it would copy the live session's NetworkManager connections (Wi-Fi passphrases, VPN secrets)
      # into the installed system (WSOS-INS-007). Networks are set up again in the first-boot assistant.
      - hwclock
      - worksuitephase@components
      - packages
      - shellprocess@worksuite
      - worksuitephase@boot
      - initramfscfg   # with the keyfile in crypttab and KEYFILE_PATTERN (shellprocess@worksuite): one passphrase prompt (GRUB), not two
      - initramfs
      - grubcfg
      - bootloader
      - worksuitephase@cleanup
      - umount
  - show:
      - worksuiteconfirm@recovery
      - finishedq

branding: worksuite
prompt-install: false       # the typed disk-name confirmation (worksuiteconfirm@erase) is the explicit confirmation (WSOS-INS-003)
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
