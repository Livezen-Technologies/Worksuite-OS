# WorkSuite failed sign-in lockout (WSOS-AUTH-004), read by pam_faillock via conf=/etc/worksuite/faillock.conf.
# Installed to /usr/share/worksuite/faillock.conf and copied to /etc/worksuite/faillock.conf when that is missing.
# On managed devices worksuite-device-agent rewrites /etc/worksuite/faillock.conf from the signed policy
# (login_failures_max, login_lockout_s).
dir = /var/run/faillock
audit
silent
deny = 5
fail_interval = 900
unlock_time = 600
