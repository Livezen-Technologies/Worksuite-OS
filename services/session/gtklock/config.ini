# gtklock settings for the WorkSuite lock screen (docs/design/boot-install/project/Lock.dc.html).
# gtklock reads [main] keys with the same names as its long options.
[main]
style=/etc/xdg/worksuite/gtklock/style.css
time-format=%H:%M
# Design: clock first, "press any key or click to unlock", then the password field.
start-hidden=true
idle-hide=true
idle-timeout=30
follow-focus=true
