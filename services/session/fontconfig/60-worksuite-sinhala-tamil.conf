<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Sinhala and Tamil Unicode text in every app (shell, installer, GTK/Qt, browsers): fonts without those scripts
     (IBM Plex, DejaVu) fall back to Noto, not to whatever face fontconfig finds first. Installed to /etc/fonts/conf.d. -->
<fontconfig>
  <!-- Text tagged as Sinhala or Tamil uses the Noto faces first. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Sinhala UI</string><string>Noto Sans Sinhala</string><string>LKLUG</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ta</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans Tamil UI</string><string>Noto Sans Tamil</string></edit>
  </match>
  <!-- Untagged text: the generic families list the Sinhala and Tamil faces right after the Latin default. -->
  <alias binding="weak">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans Sinhala UI</family><family>Noto Sans Sinhala</family><family>Noto Sans Tamil UI</family><family>Noto Sans Tamil</family><family>LKLUG</family></prefer>
  </alias>
  <alias binding="weak">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif Sinhala</family><family>Noto Serif Tamil</family><family>LKLUG</family></prefer>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Noto Sans Sinhala</family><family>Noto Sans Tamil</family></prefer>
  </alias>
  <!-- The shell's Latin face has no Sinhala or Tamil glyphs; name the fallbacks for it too. -->
  <alias binding="weak">
    <family>IBM Plex Sans</family>
    <accept><family>Noto Sans Sinhala UI</family><family>Noto Sans Tamil UI</family></accept>
  </alias>
</fontconfig>
