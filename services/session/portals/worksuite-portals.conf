# Installed as /usr/share/xdg-desktop-portal/worksuite-portals.conf (matched from XDG_CURRENT_DESKTOP=WorkSuite:GNOME).
# WSOS-INT-012: explicit backend per interface. Since 1.1 the session is GNOME Shell: screenshots and screen sharing
# go through GNOME's portal (Mutter's screen cast), files and URIs through GNOME's, gtk for what GNOME's lacks.
[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.FileChooser=gnome
org.freedesktop.impl.portal.OpenURI=gtk
org.freedesktop.impl.portal.Settings=gnome
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=gnome
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Inhibit=gnome
