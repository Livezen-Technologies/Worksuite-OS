# Installed as /usr/share/xdg-desktop-portal/worksuite-portals.conf (matched from XDG_CURRENT_DESKTOP=WorkSuite:wlroots).
# WSOS-INT-012: explicit backend per interface. Acceptance tests each interface actually used.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.OpenURI=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Inhibit=none
