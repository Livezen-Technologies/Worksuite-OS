# WorkSuite defaults for the foot terminal (found through XDG_CONFIG_DIRS=/etc/xdg/worksuite:…, set in the Labwc
# environment; a user's ~/.config/foot/foot.ini still wins). Copy and paste like other Windows-style terminals:
# Ctrl+Shift+C / Ctrl+Shift+V, and also Ctrl+Insert / Shift+Insert (Shift+Insert pastes the clipboard, not the
# primary selection; the middle mouse button still pastes the selection).
[main]
font=monospace:size=11

[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste
primary-paste=none
