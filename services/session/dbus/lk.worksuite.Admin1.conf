<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="lk.worksuite.Admin1"/>
  </policy>
  <!-- Anyone may call; every method is behind its own polkit action (services/session/admin/worksuite_admin/bus.py). -->
  <policy context="default">
    <allow send_destination="lk.worksuite.Admin1" send_interface="lk.worksuite.Admin1"/>
    <allow send_destination="lk.worksuite.Admin1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
