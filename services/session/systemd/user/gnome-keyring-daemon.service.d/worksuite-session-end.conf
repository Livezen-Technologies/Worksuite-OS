# WSOS-INT-009: the login keyring daemon ends with the graphical session, in the WorkSuite (greetd) and the GNOME (GDM)
# session alike. logind keeps the user manager for UserStopDelaySec (10 s) after the last session, and for good with a
# VT/SSH login or lingering (KillUserProcesses stays at Debian's "no"); the daemon it kept was locked, and the next
# sign-in's pam_gnome_keyring had no fresh daemon to unlock, so apps asked to unlock the login keyring.
# Stopped here, the next sign-in's PAM session part (auto_start) starts it again through gnome-keyring-daemon.socket,
# which stays listening, and unlocks it with the password. worksuite-session also stops it after its apps (cleanup);
# this covers the GNOME session and a WorkSuite session that ended without cleanup.
[Unit]
PartOf=graphical-session.target
