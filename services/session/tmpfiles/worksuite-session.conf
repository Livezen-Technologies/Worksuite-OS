# WSOS-SES-006: abnormal-session notices for the greeter. Users may create uid-<uid> here but cannot list, read or
# remove other files (sticky, no read bit); the greeter (_greetd, owner) reads and removes them.
d /run/worksuite 0755 root root -
d /run/worksuite/session-notice 1733 _greetd _greetd -
# G04: the greeter (_greetd) writes the break-glass reason here; only root (the directory session hook) reads it.
d /run/worksuite/break-glass 1730 root _greetd -
# Boot splash handoff: the greeter (_greetd) marks its first frame here; greetd's ExecStartPost then ends Plymouth.
d /run/worksuite/greeter 0755 _greetd _greetd -
# The greeter remembers who signed in last (their tile comes first).
d /var/cache/worksuite-greeter 0750 _greetd _greetd -
