# Optional TURN relay for WorkSuite Remote Support (issue #37). coturn (Debian: apt install coturn), configured for
# the TURN REST API: worksuite-server hands each session short-lived credentials made from the shared secret below,
# so no long-term TURN password exists on devices or in the console. Media stays DTLS-SRTP end to end; the relay
# only forwards encrypted packets.
#
# worksuite-server environment (e.g. systemctl edit worksuite-server):
#   WORKSUITE_STUN_URLS=stun:turn.example.com:3478
#   WORKSUITE_TURN_URLS=turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp,turns:turn.example.com:5349?transport=tcp
#   WORKSUITE_TURN_SECRET=<the same value as static-auth-secret>
#   WORKSUITE_TURN_TTL=3600
# Install: cp turnserver.conf /etc/turnserver.conf, set the values marked CHANGE, then systemctl restart coturn.
# Firewall: 3478/udp+tcp, 5349/tcp, and the relay range below (udp).

listening-port=3478
tls-listening-port=5349
# CHANGE: this server's public name and, behind NAT, public-ip/private-ip.
realm=turn.example.com
server-name=turn.example.com
#external-ip=203.0.113.10/10.0.0.10

# TURN REST API (coturn's use-auth-secret): username "<expiry-unix-time>:<session>", password HMAC-SHA1 of it.
use-auth-secret
# CHANGE: a long random value (openssl rand -hex 32); keep it secret, same as WORKSUITE_TURN_SECRET.
static-auth-secret=CHANGE-ME

# CHANGE: certificate for turns: (e.g. from certbot), readable by the turnserver user.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

min-port=49160
max-port=49200
fingerprint
no-multicast-peers
no-cli
no-tcp-relay
stale-nonce=600
# Never relay into private networks (stops the relay being used to reach internal hosts).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=12
total-quota=1200
log-file=syslog
simple-log
