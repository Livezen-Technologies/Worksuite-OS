# WorkSuite smart-card / PIV sign-in (WSOS-DIR-011). Installed as /etc/pam_pkcs11/pam_pkcs11.conf by
# `worksuite-smartcard-setup enable`. The card's certificate must chain to a CA in /etc/pam_pkcs11/cacerts and must
# not be revoked (CRL); its Microsoft UPN maps to the directory account name (user@domain).
pam_pkcs11 {
  nullok = false;
  debug = false;
  use_first_pass = false;
  card_only = true;
  wait_for_card = false;
  use_pkcs11_module = opensc;
  pkcs11_module opensc {
    module = /usr/lib/x86_64-linux-gnu/opensc-pkcs11.so;
    description = "OpenSC PKCS#11 (PIV, CAC and many national ID cards)";
    slot_num = 0;
    ca_dir = /etc/pam_pkcs11/cacerts;
    crl_dir = /etc/pam_pkcs11/crls;
    cert_policy = ca,signature,crl_auto;
  }
  use_mappers = ms;
  mapper_search_path = /usr/lib/pam_pkcs11;
  mapper ms {
    debug = false;
    module = internal;
    ignorecase = true;
    ignoredomain = false;
    domain = "";
  }
}
