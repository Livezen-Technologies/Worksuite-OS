<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="lk.worksuite.Setup1"/>
  </policy>
  <policy context="default">
    <allow send_destination="lk.worksuite.Setup1" send_interface="lk.worksuite.Setup1"/>
    <allow send_destination="lk.worksuite.Setup1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
