openapi: 3.1.0
info:
  title: WorkSuite Desktop API (desktop/v1 + desktop/v1/os)
  version: 1.0.0-draft
  description: |
    Endpoints used by WorkSuite OS (SRS §10.2, §14.5). Existing desktop/v1 endpoints are described as the OS
    uses them; the desktop/v1/os group and sync/mutations are new.
    Every call: `Authorization: Bearer` (OneAuth access token), `X-WS-Device` (device credential, WSOS-IDN-005),
    optional `X-Request-Id` (echoed; matches server logs). All endpoints sit behind the auth and desktopdevice
    filters; tenant ownership is enforced server-side — a client-supplied organization ID is never proof of access.
    Rate limits: 429 with `Retry-After`. Max JSON body 1 MiB unless stated (413 PAYLOAD_TOO_LARGE).
    Versioning: path-versioned (`v1`); additive changes only within v1; unknown fields are ignored by clients.
servers:
  - url: https://{host}/
    variables:
      host: { default: worksuite.example.com }
security:
  - bearer: []
    device: []
tags:
  - { name: existing }
  - { name: os, description: New desktop/v1/os group }
  - { name: sync }
  - { name: devices }

paths:
  /.well-known/worksuite-desktop:
    get:
      tags: [existing]
      summary: Enterprise server discovery
      security: []
      responses:
        '200': { description: Discovery document, content: { application/json: { schema: { $ref: '#/components/schemas/Discovery' } } } }

  /desktop/v1/releases/manifest:
    get:
      tags: [existing]
      summary: Signed release manifest (extended with os platform, arch, ring — §14.5)
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [desktop, os] } }
        - { name: arch, in: query, required: true, schema: { $ref: '#/components/schemas/Arch' } }
        - { name: ring, in: query, required: true, schema: { $ref: '#/components/schemas/Ring' } }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200': { description: Manifest, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseManifest' } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/bootstrap:
    get:
      tags: [existing]
      summary: User, org, modules and settings at login
      responses:
        '200':
          description: Bootstrap
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  user: { type: object }
                  org: { type: object }
                  modules: { type: array, items: { type: object } }
                  apps:
                    description: >-
                      WorkSuite web apps enabled for the org. The desktop shows these in its launcher and opens
                      web_url in a dedicated app window (worksuite-app); navigation stays on web_url's origin.
                    type: array
                    items: { $ref: '#/components/schemas/WebApp' }
                  settings: { type: object }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/apps:
    get:
      tags: [existing]
      summary: WorkSuite app catalog (incl. offline level, WSOS-SYN-009)
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: Apps
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, name, offline_level]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            offline_level: { type: string, enum: [full_offline, cached_read, online_only] }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/policies:
    get:
      tags: [existing]
      summary: Effective signed user/device policy
      responses:
        '200': { description: Policy, content: { application/json: { schema: { $ref: '#/components/schemas/Policy' } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/links/resolve:
    get:
      tags: [existing]
      summary: Resolve worksuite:// links
      parameters: [ { name: url, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Target, content: { application/json: { schema: { type: object, properties: { app_id: { type: string }, route: { type: string }, web_url: { type: string, format: uri, nullable: true, description: 'URL the app window opens; null when the org has no such web app' } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/search:
    get:
      tags: [search]
      summary: Search WorkSuite records the caller may open (launcher global search, WSOS-LCH)
      description: |
        Results are scoped server-side to what the signed-in user can open; clients must not cache them across accounts.
        Platform mapping: GET /api/search/global?q=&types= (worksuite app/Modules/Search/Config/Routes.php,
        GlobalSearchController::query), whose data.results[].items[] {id,title,subtitle,route,at,score} become results
        with type from the group key and link worksuite://<module><route>.
      security: [ { bearer: [] } ]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: types, in: query, required: false, description: 'Comma-separated: mail, contact, crm, task, chat, event, note, project, document', schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Results, best first
          content:
            application/json:
              schema:
                type: object
                required: [query, results]
                properties:
                  query: { type: string }
                  state: { type: string, enum: [ready, building], description: 'building: the index is incomplete, so an empty answer is not "nothing there"' }
                  results: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/files/search:
    get:
      tags: [search]
      summary: Search Drive files the caller may open
      description: 'Platform mapping: GET /api/files/search?q=&limit= (worksuite app/Modules/Files/Config/Routes.php, FilesController::search; data.files[]).'
      security: [ { bearer: [] } ]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: 'Files, best first', content: { application/json: { schema: { type: object, required: [files], properties: { query: { type: string }, files: { type: array, items: { $ref: '#/components/schemas/DriveFile' } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/files/recent:
    get:
      tags: [search]
      summary: The caller's recently opened Drive files, newest first
      description: 'Platform mapping: GET /api/drive/list?view=recent (worksuite app/Modules/Files/Config/Routes.php, DriveController::list over file_recents).'
      security: [ { bearer: [] } ]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: Recent files, content: { application/json: { schema: { type: object, required: [files], properties: { files: { type: array, items: { $ref: '#/components/schemas/DriveFile' } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/audit:
    post:
      tags: [existing]
      summary: Client audit events (no secrets, WSOS-SEC-008)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 500
                  items: { type: object, required: [id, type, at], properties: { id: { type: string, format: uuid }, type: { type: string }, at: { type: string, format: date-time }, data: { type: object } } }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/devices/register:
    post:
      tags: [existing, devices]
      summary: Device enrollment with short-lived enrollment token
      security: [ { bearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token, public_key, arch]
              properties:
                enrollment_token: { type: string }
                public_key: { type: string, description: PEM; TPM-backed when available }
                tpm_backed: { type: boolean }
                arch: { $ref: '#/components/schemas/Arch' }
                hostname: { type: string }
                wg_public_key: { $ref: '#/components/schemas/WireGuardKey', description: 'Optional: the device''s WireGuard public key for the managed VPN (never the private key)' }
      responses:
        '201': { description: Device credential, content: { application/json: { schema: { type: object, required: [device_id, credential], properties: { device_id: { type: string }, credential: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/devices/heartbeat:
    post:
      tags: [existing, devices]
      summary: Health, versions and observed state; returns pending signed commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [os_version, shell_version, kernel_version, policy_version]
              properties:
                os_version: { type: string }
                shell_version: { type: string }
                kernel_version: { type: string }
                policy_version: { type: string }
                update_status: { type: string }
                observed: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Pending commands
          content:
            application/json:
              schema: { type: object, properties: { commands: { type: array, items: { $ref: '#/components/schemas/CommandEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/devices/commands/{id}/ack:
    post:
      tags: [existing, devices]
      summary: Command result (received → started → completed|failed|rejected)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [received, started, completed, failed, rejected] }
                reason: { type: string, description: e.g. REPLAY, EXPIRED, WRONG_DEVICE, NOT_ENCRYPTED }
      responses:
        '204': { description: Recorded }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/sync/changes:
    get:
      tags: [existing, sync]
      summary: Record change stream for one stream since a cursor
      parameters:
        - { name: stream, in: query, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Changes (tombstones included for the server window, default 30 days — WSOS-SYN-007)
          content:
            application/json:
              schema:
                type: object
                required: [changes, next_cursor, has_more]
                properties:
                  changes: { type: array, items: { $ref: '#/components/schemas/Change' } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        '410': { description: CURSOR_EXPIRED — client performs bounded full resync (WSOS-SYN-006), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/sync/events:
    post:
      tags: [existing, sync]
      summary: Client sync telemetry events
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/sync/mutations:
    post:
      tags: [sync]
      summary: Idempotent mutation batch (new)
      description: |
        Deduplicated by (account, mutation_id): a repeated mutation returns `duplicate` with the original revision
        and causes no second business effect (WSOS-SYN-001). Per-record results; one bad record does not fail the batch.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, mutations]
              properties:
                batch_id: { type: string, format: uuid }
                mutations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Mutation' } }
      responses:
        '200':
          description: Per-mutation results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties: { results: { type: array, items: { $ref: '#/components/schemas/MutationResult' } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/files/{id}/lock:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [existing]
      summary: Take document lock (WSOS-DRV-003)
      responses:
        '200': { description: Lock, content: { application/json: { schema: { type: object, properties: { lock_id: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        '409': { description: LOCKED by another user, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [existing]
      summary: Release document lock
      responses:
        '204': { description: Released }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/catalog:
    get:
      tags: [os]
      summary: Approved Linux apps with policy flags
      parameters:
        - { name: arch, in: query, required: true, schema: { $ref: '#/components/schemas/Arch' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Catalog page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties: { items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/licence:
    get:
      tags: [os]
      summary: Signed, device-bound licence state for update entitlement gating (WSOS-AUP-012)
      description: >
        Signed with the release key ("<key_id>:<base64 Ed25519>" over the canonical JSON without the signature), valid
        for 7 days. Feature releases whose manifest names an entitlement install only with state active and that
        entitlement; security releases continue during grace. No licence on record answers state expired.
      responses:
        '200':
          description: Licence
          content:
            application/json:
              schema:
                type: object
                required: [device_id, edition, state, entitlements, issued_at, valid_until, signature]
                properties:
                  device_id: { type: string }
                  edition: { type: string }
                  state: { type: string, enum: [active, grace, expired] }
                  entitlements: { type: array, items: { type: string } }
                  grace_until: { type: [string, 'null'], format: date-time }
                  issued_at: { type: string, format: date-time }
                  valid_until: { type: string, format: date-time }
                  signature: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/vpn:
    get:
      tags: [os]
      summary: Signed per-device WireGuard config for the organization's managed VPN (WSOS-INT-001)
      description: >
        The organization holds the gateway endpoint, its public key, the address pool, allowed IPs, DNS and the
        always-on / kill-switch flags; each device gets its own tunnel address. Signed like policies ("<key_id>:<base64
        Ed25519>" over the canonical JSON without the signature). Never contains a private key: the device generates its
        own keypair and registers only the public key (devices/register wg_public_key, or PUT os/vpn/peer). No VPN for
        the organization answers enabled false (signed), and the device removes its managed connection.
      security: [ { device: [] } ]
      responses:
        '200': { description: Config, content: { application/json: { schema: { $ref: '#/components/schemas/VpnConfig' } } } }
        '409': { description: 'VPN_PEER_KEY_REQUIRED (register a public key first; also after an admin rotates the key) or VPN_POOL_EXHAUSTED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/vpn/peer:
    put:
      tags: [os]
      summary: Register or rotate the device's WireGuard public key; returns the new signed config
      security: [ { device: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              additionalProperties: false
              properties:
                public_key: { $ref: '#/components/schemas/WireGuardKey' }
      responses:
        '200': { description: Config, content: { application/json: { schema: { $ref: '#/components/schemas/VpnConfig' } } } }
        '409': { description: VPN_KEY_IN_USE (key registered to another device) or VPN_POOL_EXHAUSTED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/inventory:
    post:
      tags: [os]
      summary: Hardware + installed-software inventory (WSOS-MDM-001)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collected_at, hardware, software]
              properties:
                collected_at: { type: string, format: date-time }
                hardware: { type: object, additionalProperties: true }
                software:
                  type: array
                  maxItems: 20000
                  items: { type: object, required: [source, name, version], properties: { source: { type: string, enum: [apt, flatpak, appimage] }, name: { type: string }, version: { type: string } } }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/update-results:
    post:
      tags: [os]
      summary: Per-update outcome (WSOS-UPD-005, WSOS-AUP-011)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_id, result, os_version, shell_version, kernel_version]
              properties:
                release_id: { type: string }
                ring: { $ref: '#/components/schemas/Ring' }
                arch: { $ref: '#/components/schemas/Arch' }
                result: { type: string, enum: [success, failed, rolled_back, refused_signature, refused_downgrade] }
                reboot_required: { type: boolean }
                health_check: { type: string, enum: [pass, fail, skipped] }
                os_version: { type: string }
                shell_version: { type: string }
                kernel_version: { type: string }
                error: { type: string }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/problem-reports:
    post:
      tags: [os]
      summary: Problem report the user reviewed and chose to send (SRS §11.6-d)
      description: |
        Built in Settings › About › Report a problem. Only the sections the user kept are sent; the shell redacts
        tokens, passwords, keys and email addresses first. Bearer token of the user; X-WS-Device when enrolled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, sections]
              properties:
                id: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
                created_at: { type: string, format: date-time }
                description: { type: string, maxLength: 2000 }
                sections:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id: { type: string, enum: [system, services, session_services, session_log, system_log, packages] }
                      text: { type: string, maxLength: 70000 }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/audit:
    post:
      tags: [os]
      summary: Privileged package changes made on the device (WSOS-SEC-008)
      description: |
        Sent by the device agent from the package service's local audit log. `type` is `package.<event>`; ids are
        stable per log line, so a resend is ignored. At most 500 events, `data` at most 4 KiB each.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [id, type, at]
                    properties:
                      id: { type: string, maxLength: 64 }
                      type: { type: string, pattern: '^package\\.[a-z_]{1,64}$' }
                      at: { type: string, format: date-time }
                      data: { type: object }
      responses:
        '202': { description: Accepted }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/diagnostics:
    post:
      tags: [os]
      summary: Approved diagnostic bundle upload (resumable)
      description: |
        Resumable: first request with `Upload-Length` creates the upload (201 + Location); subsequent PATCH-style
        chunks are sent here with `Upload-Offset`. Integrity: `Digest: sha-256=<base64>` of the full bundle, verified
        on completion (422 DIGEST_MISMATCH). Max bundle 200 MiB.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: Upload-Length, in: header, schema: { type: integer, maximum: 209715200 } }
        - { name: Upload-Offset, in: header, schema: { type: integer } }
        - { name: Digest, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, contentMediaType: application/octet-stream } } } }
      responses:
        '201': { description: Upload created, headers: { Location: { schema: { type: string } } } }
        '204': { description: Chunk accepted, headers: { Upload-Offset: { schema: { type: integer } } } }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/directory:
    get:
      tags: [os]
      summary: Directory join settings for this device (§14.4)
      responses:
        '200':
          description: Join settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, enum: [ad, ldap, oneauth, none] }
                  domain: { type: string }
                  offline_login_days: { type: integer, default: 7 }
                  group_role_map: { type: object, additionalProperties: { type: string, enum: [administrator, standard, kiosk] } }
                  escrow_public_key: { type: string, description: PEM RSA public key the break-glass password is encrypted to (RSA-OAEP-256) }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/directory/authenticate:
    post:
      tags: [os]
      summary: Verify a directory password for OS sign-in (WSOS-DIR-002/005/009); device credential required
      description: Called by the OS PAM helper only. The reply carries no password material; the device derives its own offline verifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 320 }
                password: { type: string, maxLength: 1024, writeOnly: true }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  user_id: { type: integer, description: Stable id; the OS derives the local UID from it (WSOS-DIR-003) }
                  name: { type: string }
                  groups: { type: array, items: { type: string } }
                  offline_login_days: { type: integer }
        '401': { description: INVALID_CREDENTIALS }
        '403': { description: ACCOUNT_DISABLED, DEVICE_REQUIRED or DEVICE_REVOKED }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/break-glass/events:
    post:
      tags: [os]
      summary: Audit a break-glass admin use or rotation (WSOS-DIR-010)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, username, at]
              properties:
                id: { type: string }
                type: { type: string, enum: [used, rotated] }
                username: { type: string }
                at: { type: string, format: date-time }
      responses:
        '202': { description: Recorded }
        default: { $ref: '#/components/responses/Error' }

  /desktop/v1/os/break-glass:
    post:
      tags: [os]
      summary: Escrow the rotated local break-glass admin password (WSOS-DIR-010)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, encrypted_secret, rotated_at]
              properties:
                username: { type: string }
                encrypted_secret: { type: string, description: Encrypted to the org escrow key; server never sees plaintext }
                rotated_at: { type: string, format: date-time }
      responses:
        '204': { description: Stored }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: OneAuth access token (≤ 15 min) }
    device: { type: apiKey, in: header, name: X-WS-Device, description: Device credential from devices/register }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; replays within 24 h return the original response.
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      schema: { type: string, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    Error:
      description: Structured error
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SearchResult:
      type: object
      required: [id, type, title, link]
      properties:
        id: { type: string }
        type: { type: string, description: 'mail, contact, crm, task, chat, event, note, project, document' }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        link: { type: string, description: 'worksuite:// deep link, resolved with links/resolve' }
        at: { type: string, format: date-time, nullable: true }
        score: { type: number }
    DriveFile:
      type: object
      required: [id, name, link]
      properties:
        id: { type: string }
        name: { type: string }
        ext: { type: string }
        folder: { type: string, nullable: true }
        size: { type: integer, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        link: { type: string, description: 'worksuite://files/... deep link' }
        score: { type: number }
    WebApp:
      type: object
      required: [id, name, web_url]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$', description: 'Module key; the desktop entry is worksuite-<id>.desktop' }
        name: { type: string }
        web_url: { type: string, format: uri, description: 'https URL of the module''s web app (<web base>/<id>/)' }
        offline_level: { type: string, enum: [full_offline, cached_read, online_only], description: 'Offline level the app declares (WSOS-SYN-009); shown in the desktop launcher' }
    WireGuardKey:
      type: string
      pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$'
      description: WireGuard Curve25519 public key, base64 of 32 bytes (wg pubkey form)

    VpnConfig:
      type: object
      required: [device_id, enabled, version, issued_at, signature]
      description: >
        Managed WireGuard VPN for one device (WSOS-INT-001). The device applies it as the NetworkManager system
        connection "WorkSuite VPN" (type wireguard, root-only keyfile with its own private key); always_on or policy
        vpn_required → autoconnect; kill_switch → nftables drops non-tunnel traffic except the WireGuard handshake to the
        endpoint, DHCP and neighbour discovery. Revocation, wipe or enabled false → the connection and kill switch are removed.
      properties:
        device_id: { type: string }
        enabled: { type: boolean }
        version: { type: string, description: Organization VPN settings version }
        issued_at: { type: string, format: date-time }
        device_public_key: { $ref: '#/components/schemas/WireGuardKey' }
        interface:
          type: object
          required: [address, dns, dns_search]
          properties:
            address: { type: array, items: { type: string }, description: 'Tunnel address(es), CIDR, e.g. 10.70.0.2/32' }
            dns: { type: array, items: { type: string } }
            dns_search: { type: array, items: { type: string } }
            mtu: { type: integer, minimum: 1280, maximum: 1500 }
        peer:
          type: object
          required: [public_key, endpoint, allowed_ips]
          properties:
            public_key: { $ref: '#/components/schemas/WireGuardKey' }
            endpoint: { type: string, description: 'host:port of the gateway' }
            allowed_ips: { type: array, items: { type: string }, description: '0.0.0.0/0 = full tunnel' }
            persistent_keepalive: { type: integer }
        always_on: { type: boolean }
        kill_switch: { type: boolean, description: Only offered with a full tunnel }
        key_rotation_days: { type: integer, description: The device generates a new keypair this often and registers the public key }
        signature: { type: string, description: '"<key_id>:<base64 Ed25519>" over the canonical JSON (sorted keys) without this field' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine code
              examples: [VALIDATION, PERMISSION_DENIED, TOKEN_EXPIRED, DEVICE_REVOKED, CURSOR_EXPIRED, REVISION_CONFLICT, PAYLOAD_TOO_LARGE, RATE_LIMITED, LOCKED, NOT_FOUND]
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            details:
              type: array
              items: { type: object, properties: { field: { type: string }, code: { type: string }, message: { type: string } } }

    Arch: { type: string, enum: [amd64, arm64] }
    Ring: { type: string, enum: [development, pilot, stable] }

    Page:
      type: object
      required: [items]
      properties:
        items: { type: array }
        next_cursor: { type: [string, 'null'] }

    Discovery:
      type: object
      properties:
        api_base: { type: string }
        oneauth_issuer: { type: string }
        update_host: { type: string, default: download.worksuitecloud.com }

    ReleaseManifest:
      description: >
        Signed OS release manifest per ring and arch, served at
        https://download.worksuitecloud.com/os/manifests/{ring}/{arch}.json by the WorkSuite Update Center
        (Livezen-Technologies/worksite-download, which signs it with its release key through its signing service),
        or the policy's update_mirror / update_host in /etc/worksuite/updates.json. Optional fields security, critical,
        mandatory come from the Update Center's release type (security, emergency); state from pause / pull.
        Devices check 15 min after boot and every 6 h (WSOS-AUP-001).
      type: object
      required: [release_id, version, min_version, ring, arch, signature]
      properties:
        release_id: { type: string }
        version: { type: string }
        min_version: { type: string, description: Oldest supported version; devices below it treat the release as mandatory }
        ring: { $ref: '#/components/schemas/Ring' }
        arch: { $ref: '#/components/schemas/Arch' }
        mandatory: { type: boolean }
        critical: { type: boolean, description: Installs on metered connections and on battery }
        security: { type: boolean, description: Installs in Automatic and Notify modes (WSOS-AUP-005) }
        deadline: { type: string, format: date-time, description: For mandatory/critical releases (WSOS-AUP-007) }
        rollout_percent: { type: integer, minimum: 0, maximum: 100 }
        state: { type: string, enum: [active, paused, pulled] }
        rollback_directive:
          type: [object, 'null']
          description: Allows this (older) release to replace from_version (WSOS-AUP-003)
          properties:
            from_version: { type: string }
            reason: { type: string }
        entitlement: { type: string, description: Edition entitlement a feature release needs (WSOS-AUP-012); absent = every device }
        bundle:
          type: object
          description: Only in offline .wsupdate bundles (WSOS-AUP-010) - every package in pool/ with its size and SHA-256
          properties:
            files: { type: array, items: { type: object, required: [name, sha256, size], properties: { name: { type: string }, sha256: { type: string }, size: { type: integer } } } }
        signature: { type: string, description: '"<key_id>:<base64 Ed25519>" over the canonical JSON (sorted keys) of the manifest without this field' }

    Policy:
      type: object
      required: [version, signature]
      properties:
        version: { type: string }
        update_ring: { $ref: '#/components/schemas/Ring' }
        update_mode: { type: string, enum: [automatic, notify, manual] }
        maintenance_window: { type: string }
        lock_timeout_max_s: { type: integer, minimum: 60, maximum: 86400, description: 'WSOS-LOCK-003 longest idle time before the screen locks; users choose any shorter time, never "never". Device: /etc/worksuite/lock-policy.conf → worksuite-idle' }
        offline_access_days: { type: integer, minimum: 0, maximum: 365, description: 'WSOS-AUTH-003/DIR-005 days without a check-in after which sessions lock and local sign-in is refused until the device checks in (pam_nologin); absent or 0 = no limit' }
        usb_storage: { type: string, enum: [allow, read_only, block], description: 'WSOS-INT-004 USB mass storage: block = drivers not loaded and disks hidden from UDisks2; read_only = disks set read-only by udev before mounting' }
        bluetooth: { type: boolean, description: 'WSOS-INT-003 false = bluetooth.service masked and radios rfkill-blocked; true or absent = allowed' }
        login_failures_max: { type: integer, minimum: 3, maximum: 20, description: 'WSOS-AUTH-004 pam_faillock deny (default 5)' }
        login_lockout_s: { type: integer, minimum: 0, maximum: 86400, description: 'WSOS-AUTH-004 pam_faillock unlock_time; 0 = until reset by an administrator (default 600)' }
        allow_pin: { type: boolean, description: 'Device PIN sign-in (Settings > Users). false = PINs are refused at sign-in and cannot be set; absent = allowed. Device: /etc/worksuite/signin-policy.conf' }
        pin_min_length: { type: integer, minimum: 4, maximum: 12, description: 'Shortest device PIN accepted when one is set (default 6; PINs are digits, at most 12)' }
        app_allowlist: { type: array, items: { type: string } }
        approved_remotes: { type: array, items: { type: string } }
        offline_wipe_days: { type: integer, description: WSOS-WIPE-006 offline kill timer; absent = off }
        update_mirror: { type: string, description: 'WSOS-AUP-009 enterprise mirror (https) for manifests; WorkSuite signatures still required' }
        vpn_required: { type: boolean, description: 'WSOS-INT-001 the managed VPN connects at boot and reconnects (always-on) even if the VPN config does not ask for it' }
        user_vpn: { type: string, enum: [allow, block], description: 'WSOS-INT-001 block = Settings offers no VPN import and the agent removes every VPN profile except the managed one; absent = allow' }
        kiosk:
          type: object
          description: 'WSOS-AUTH-002 / SRS §2.3 kiosk mode for the listed devices (services/server/src/kiosk.ts). The admin sends exit_pin once; the server stores and signs only exit_pin_verifier (scrypt), and the admin API returns exit_pin_set instead.'
          required: [enabled]
          properties:
            enabled: { type: boolean }
            user: { type: string, description: 'local kiosk account; not root or wsadmin' }
            devices: { type: array, items: { type: string } }
            app:
              oneOf:
                - { type: object, required: [type, url], properties: { type: { const: url }, url: { type: string, format: uri, description: https only } } }
                - { type: object, required: [type, id], properties: { type: { const: module }, id: { type: string, enum: [home, mail, chat, calendar, tasks, files, crm, hr] } } }
                - { type: object, required: [type, id], properties: { type: { const: desktop }, id: { type: string, description: '.desktop file id' } } }
            allowed_urls: { type: array, maxItems: 100, items: { type: string, description: 'https://host[:port][/path-prefix], host may start with *.' } }
            idle_reset_minutes: { type: integer, minimum: 0, maximum: 1440, description: '0 = never' }
            show_on_screen_keyboard: { type: boolean }
            allow_exit_pin: { type: boolean }
            exit_pin: { type: string, writeOnly: true, pattern: '^\\d{6,12}$' }
            exit_pin_set: { type: boolean, readOnly: true }
            exit_pin_verifier: { type: string, description: 'in the signed device policy only' }
        signature: { type: string, description: '"<key_id>:<base64 Ed25519>" over the canonical JSON (sorted keys) of the policy without this field' }

    CatalogItem:
      type: object
      required: [id, source, name, arches]
      properties:
        id: { type: string }
        source: { type: string, enum: [apt, flatpak, appimage] }
        name: { type: string }
        arches: { type: array, items: { $ref: '#/components/schemas/Arch' } }
        required: { type: boolean }
        blocked: { type: boolean }
        sha256: { type: string, description: AppImage integrity }
        category: { type: string }
        summary: { type: string }
        publisher: { type: string }

    CommandEnvelope:
      type: object
      required: [id, command, device_id, issued_at, expires_at, args, signature]
      properties:
        id: { type: string, format: uuid }
        command: { type: string, enum: [RefreshPolicy, InstallApprovedApplication, ScheduleUpdate, RequestLock, RebootDuringWindow, CollectApprovedDiagnostics, RemoteWipe] }
        device_id: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        args: { type: object }
        signature:
          type: object
          required: [alg, key_id, value]
          properties: { alg: { const: ed25519 }, key_id: { type: string }, value: { type: string, contentEncoding: base64 } }

    Mutation:
      type: object
      required: [mutation_id, module, object_id, operation, base_revision]
      properties:
        mutation_id: { type: string, format: uuid }
        module: { type: string }
        object_id: { type: string }
        operation: { type: string, enum: [create, update, delete] }
        base_revision: { type: [integer, 'null'] }
        payload: {}
        force: { type: boolean, description: Last-write-wins types only (preferences) }

    MutationResult:
      type: object
      required: [mutation_id, status]
      properties:
        mutation_id: { type: string, format: uuid }
        status: { type: string, enum: [applied, duplicate, conflict, rejected] }
        revision: { type: integer, description: Authoritative revision (applied/duplicate/conflict) }
        server_version: { description: Current server data on conflict }
        server_deleted: { type: boolean }
        error: { $ref: '#/components/schemas/Error/properties/error' }

    Change:
      type: object
      required: [module, object_id, revision, deleted]
      properties:
        module: { type: string }
        object_id: { type: string }
        revision: { type: integer }
        deleted: { type: boolean }
        data: {}
