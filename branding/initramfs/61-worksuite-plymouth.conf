<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- initramfs only (copied in by the worksuite-plymouth-fonts hook): the boot splash's design fonts, IBM Plex Sans
     and Mono, preferred for sans-serif and monospace so every Plymouth label renders in Plex, not the fallback. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/ibm-plex</dir>
  <alias binding="strong"><family>sans-serif</family><prefer><family>IBM Plex Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>IBM Plex Mono</family></prefer></alias>
</fontconfig>
