# Installed by worksuite-branding.
GRUB_THEME=/usr/share/grub/themes/worksuite/theme.txt
GRUB_GFXMODE=auto
# No console text from boot to the greeter: only the splash (kernel, udev and systemd status quiet, no cursor).
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0"
# Menu hidden for one second: Esc, F4 or Shift in that second opens the (themed) menu for Recovery. With no wait at
# all (GRUB_TIMEOUT=0) GRUB never looked for those keys, and an Esc pressed while it started dropped it to its
# command line instead (E2E), from which "normal" showed the menu without the theme.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
GRUB_RECORDFAIL_TIMEOUT=0
# Graphical output only: no "Welcome to GRUB" text console.
GRUB_TERMINAL_OUTPUT=gfxterm
# /boot is not encrypted (installer/modules/partition.conf): GRUB never asks for the disk passphrase.
GRUB_ENABLE_CRYPTODISK=n
GRUB_DISTRIBUTOR="WorkSuite OS"
GRUB_GFXPAYLOAD_LINUX=keep
