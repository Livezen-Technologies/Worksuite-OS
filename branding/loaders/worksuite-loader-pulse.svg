<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="96" height="96" role="img" aria-label="Loading WorkSuite">
  <title>Loading WorkSuite</title>
  <style>
.m { transform-box: view-box; transform-origin: 64px 64px; animation: m-beat 1.5s ease-in-out infinite; }
    .ring { fill: none; stroke: #0a6cff; stroke-width: 2.5; transform-box: view-box; transform-origin: 64px 64px; opacity: 0; animation: m-ring 1.5s ease-out infinite; }
    .ring2 { stroke: #00daf2; animation-delay: .75s }
    @keyframes m-beat { 0%,100% { transform: scale(.82) } 14% { transform: scale(.9) } 28% { transform: scale(.8) } 42% { transform: scale(.88) } 70% { transform: scale(.82) } }
    @keyframes m-ring { 0% { transform: scale(.7); opacity: .8 } 100% { transform: scale(1.25); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="ring" x="20" y="20" width="88" height="88" rx="14"/>
  <rect class="ring ring2" x="20" y="20" width="88" height="88" rx="14"/>
  <g class="m"><rect x="16" y="48" width="32" height="32" fill="#00daf2"/><rect x="48" y="80" width="32" height="32" fill="#00daf2"/><rect x="48" y="16" width="64" height="64" fill="#0a6cff"/><rect x="48" y="48" width="32" height="32" fill="#001842"/></g>
</svg>
