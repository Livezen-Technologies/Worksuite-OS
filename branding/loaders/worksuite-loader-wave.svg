<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="96" height="96" role="img" aria-label="Loading WorkSuite">
  <title>Loading WorkSuite</title>
  <style>
.w { transform-box: fill-box; transform-origin: center; animation: w-wave 1.6s ease-in-out infinite both; }
    @keyframes w-wave { 0%,50%,100% { transform: scale(1) } 25% { transform: scale(.55) } }
    /* solid logo shown only while every cell is at rest, hides the seams between cells */
    .wb { animation: w-base 1.6s linear infinite; }
    @keyframes w-base { 0% { opacity: 1 } 3%,80% { opacity: 0 } 83%,100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="w" style="animation-delay:0.12s" x="15.6" y="47.6" width="32.8" height="32.8" fill="#00daf2"/>
  <rect class="w" style="animation-delay:0.12s" x="47.6" y="79.6" width="32.8" height="32.8" fill="#00daf2"/>
  <rect class="w" style="animation-delay:0.36s" x="47.6" y="15.6" width="32.8" height="32.8" fill="#0a6cff"/>
  <rect class="w" style="animation-delay:0.48s" x="79.6" y="15.6" width="32.8" height="32.8" fill="#0a6cff"/>
  <rect class="w" style="animation-delay:0.36s" x="79.6" y="47.6" width="32.8" height="32.8" fill="#0a6cff"/>
  <rect class="w" style="animation-delay:0.24s" x="47.6" y="47.6" width="32.8" height="32.8" fill="#001842"/>
  <g class="wb"><rect x="16" y="48" width="32" height="32" fill="#00daf2"/><rect x="48" y="80" width="32" height="32" fill="#00daf2"/><rect x="48" y="16" width="64" height="64" fill="#0a6cff"/><rect x="48" y="48" width="32" height="32" fill="#001842"/></g>
</svg>
