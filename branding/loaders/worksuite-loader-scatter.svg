<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="96" height="96" role="img" aria-label="Loading WorkSuite">
  <title>Loading WorkSuite</title>
  <style>
.x { animation: 2s cubic-bezier(.7,0,.3,1) infinite; }
    .xl { animation-name: x-l } .xb { animation-name: x-b } .xq { animation-name: x-q }
    .xn { transform-box: fill-box; transform-origin: center; animation-name: x-n }
    @keyframes x-l { 0%,15%,85%,100% { transform: translate(0,0) } 40%,60% { transform: translate(-10px,0) } }
    @keyframes x-b { 0%,15%,85%,100% { transform: translate(0,0) } 40%,60% { transform: translate(0,10px) } }
    @keyframes x-q { 0%,15%,85%,100% { transform: translate(0,0) } 40%,60% { transform: translate(10px,-10px) } }
    @keyframes x-n { 0%,15%,85%,100% { transform: rotate(0) scale(1) } 40%,60% { transform: rotate(90deg) scale(.8) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="x xl" x="16" y="48" width="32" height="32" fill="#00daf2"/>
  <rect class="x xb" x="48" y="80" width="32" height="32" fill="#00daf2"/>
  <rect class="x xq" x="48" y="16" width="64" height="64" fill="#0a6cff"/>
  <rect class="x xn" x="48" y="48" width="32" height="32" fill="#001842"/>
</svg>
